  <g fill="#1f4e79">
    <polygon points="140,767 132,762.5 132,771.5"/><polygon points="253,767 245,762.5 245,771.5"/>
    <polygon points="366,767 358,762.5 358,771.5"/><polygon points="479,767 471,762.5 471,771.5"/>
    <polygon points="592,767 584,762.5 584,771.5"/>
