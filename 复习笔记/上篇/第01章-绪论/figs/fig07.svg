<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
  </defs>
  <!-- 处理单元 -->
  <g>
    <rect x="60" y="24" width="150" height="66" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="135" y="50" font-size="13" font-weight="bold" fill="#c05621" text-anchor="middle">Processing Unit</text>
    <text x="135" y="72" font-size="11" fill="#22303f" text-anchor="middle">处理单元（业务逻辑）</text>
    <rect x="285" y="24" width="150" height="66" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="360" y="50" font-size="13" font-weight="bold" fill="#c05621" text-anchor="middle">Processing Unit</text>
    <text x="360" y="72" font-size="11" fill="#22303f" text-anchor="middle">处理单元（业务逻辑）</text>
    <rect x="510" y="24" width="150" height="66" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="585" y="50" font-size="13" font-weight="bold" fill="#c05621" text-anchor="middle">Processing Unit</text>
    <text x="585" y="72" font-size="11" fill="#22303f" text-anchor="middle">处理单元（业务逻辑）</text>
  </g>
  <!-- 虚拟中间件容器 -->
  <rect x="40" y="150" width="640" height="230" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.6"/>
  <text x="360" y="176" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">虚拟中间件 Virtualized Middleware</text>
  <!-- 四个组件 2×2 -->
  <g>
    <rect x="70" y="196" width="280" height="76" rx="5" fill="#ffffff" stroke="#1f4e79"/>
    <text x="210" y="222" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">消息中间件 Messaging Grid</text>
    <text x="210" y="246" font-size="11" fill="#22303f" text-anchor="middle">请求分配、会话控制</text>
    <rect x="370" y="196" width="280" height="76" rx="5" fill="#ffffff" stroke="#1f4e79"/>
    <text x="510" y="222" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">数据中间件 Data Grid</text>
    <text x="510" y="246" font-size="11" fill="#22303f" text-anchor="middle">数据复制同步到各处理单元</text>
    <rect x="70" y="288" width="280" height="76" rx="5" fill="#ffffff" stroke="#1f4e79"/>
    <text x="210" y="314" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">处理中间件 Processing Grid</text>
    <text x="210" y="338" font-size="11" fill="#22303f" text-anchor="middle">可选：协调不同类型处理单元</text>
    <rect x="370" y="288" width="280" height="76" rx="5" fill="#ffffff" stroke="#1f4e79"/>
    <text x="510" y="314" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">部署中间件 Deployment Manager</text>
    <text x="510" y="338" font-size="11" fill="#22303f" text-anchor="middle">处理单元启停、负载与响应监控</text>
  </g>
  <!-- 处理单元 -> 虚拟中间件（顶缘三个独立连接点） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="135" y1="93" x2="135.0" y2="136.0"/>
    <polygon points="135.0,144.0 130.5,136.0 139.5,136.0" fill="#1f4e79"/>
    <line x1="360" y1="93" x2="360.0" y2="136.0"/>
    <polygon points="360.0,144.0 355.5,136.0 364.5,136.0" fill="#1f4e79"/>
    <line x1="585" y1="93" x2="585.0" y2="136.0"/>
    <polygon points="585.0,144.0 580.5,136.0 589.5,136.0" fill="#1f4e79"/>
  </g>
  <text x="360" y="406" font-size="12" fill="#6b7a8a" text-anchor="middle">数据复制到内存、无中央数据库：访问量增减时弹性启停处理单元，内存数据需持久化</text>
</svg>
