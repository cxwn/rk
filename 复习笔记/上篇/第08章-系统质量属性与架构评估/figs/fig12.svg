<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">Hoover 与 Banking：质量结论及权衡点</text>
  <rect x="35" y="55" width="650" height="45" rx="7" fill="#1f4e79"/>
  <text x="180" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">比较维度</text>
  <text x="390" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Hoover</text>
  <text x="585" y="84" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Banking</text>
  <g font-size="13">
    <rect x="35" y="100" width="650" height="48" fill="#f7fafc" stroke="#d7e0e8"/>
    <rect x="35" y="148" width="650" height="48" fill="#ffffff" stroke="#d7e0e8"/>
    <rect x="35" y="196" width="650" height="48" fill="#f7fafc" stroke="#d7e0e8"/>
    <rect x="35" y="244" width="650" height="48" fill="#ffffff" stroke="#d7e0e8"/>
    <rect x="35" y="292" width="650" height="48" fill="#f7fafc" stroke="#d7e0e8"/>
    <line x1="295" y1="55" x2="295" y2="340" stroke="#d7e0e8"/>
    <line x1="490" y1="55" x2="490" y2="340" stroke="#d7e0e8"/>
    <text x="55" y="130" font-weight="bold">封装与耦合</text><text x="315" y="130" fill="#4a6130">框架与应用分离</text><text x="510" y="130" fill="#c05621">应用信息嵌入多处</text>
    <text x="55" y="178" font-weight="bold">可修改 / 可变 / 复用</text><text x="315" y="178" fill="#4a6130">非风险：影响面小</text><text x="510" y="178" fill="#c05621">风险：修改代价高</text>
    <text x="55" y="226" font-weight="bold">可靠性 / 功能性</text><text x="315" y="226" fill="#4a6130">能处理错误并协同</text><text x="510" y="226" fill="#4a6130">基本满足，属非风险</text>
    <text x="55" y="274" font-weight="bold">概念完整性</text><text x="315" y="274" fill="#4a6130">机制统一、控制少</text><text x="510" y="274" fill="#c05621">控制链长、一致性弱</text>
    <text x="55" y="322" font-weight="bold">安全性 / 性能</text><text x="315" y="322" fill="#4a6130">封装好、组件链短</text><text x="510" y="322" fill="#c05621">信息分散、组件链长</text>
  </g>
  <rect x="35" y="365" width="310" height="85" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <rect x="375" y="365" width="310" height="85" rx="8" fill="#fdf0e6" stroke="#c05621"/>
  <text x="190" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">敏感点示例</text>
  <text x="190" y="418" text-anchor="middle" font-size="12">平均处理速度对参与组件数量敏感</text>
  <text x="190" y="438" text-anchor="middle" font-size="12">错误处理对已知事件类型数量敏感</text>
  <text x="530" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05621">权衡点示例</text>
  <text x="530" y="418" text-anchor="middle" font-size="12">应用嵌入位置数量：影响变化、修改与安全</text>
  <text x="530" y="438" text-anchor="middle" font-size="12">参与组件数量：影响性能及其他属性</text>
  <text x="360" y="470" text-anchor="middle" font-size="12" fill="#6b7a8a">结论须针对高优先级质量目标，不能仅凭“功能可运行”判定架构无风险</text>
</svg>
