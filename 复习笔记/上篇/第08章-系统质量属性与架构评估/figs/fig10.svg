  <text x="245" y="420" text-anchor="middle" font-size="12" fill="#4a6130">框架组件独立，应用仅在明确接口处挂接</text>
  <text x="592" y="420" text-anchor="middle" font-size="12" fill="#4a6130">应用特定信息</text>
  <rect x="90" y="462" width="540" height="25" rx="5" fill="#f3f6ee"/>
  <text x="360" y="480" text-anchor="middle" font-size="12" fill="#4a6130">评估结论：可修改性、可变性、复用性和概念完整性较好</text>
