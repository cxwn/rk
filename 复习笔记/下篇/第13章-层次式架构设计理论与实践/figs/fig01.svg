<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="22" font-weight="bold" fill="#22303f">常用四层层次式架构（重绘图13-1）</text>
  <rect x="38" y="62" width="116" height="48" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="96" y="92" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="16" fill="#c05621">用户请求</text>
  <line x1="154" y1="86" x2="215" y2="86" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="223,86 215,81.5 215,90.5" fill="#1f4e79"/>
  <rect x="226" y="54" width="454" height="76" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="453" y="82" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">表现层（展示层）</text>
  <text x="453" y="108" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">界面组件 · 输入接收 · 结果展示</text>
  <line x1="453" y1="130" x2="453" y2="153" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="453,161 448.5,153 457.5,153" fill="#1f4e79"/>
  <rect x="226" y="164" width="454" height="76" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="453" y="192" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">中间层（业务层）</text>
  <text x="453" y="218" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">业务规则 · 工作流 · 事务边界</text>
  <line x1="453" y1="240" x2="453" y2="263" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="453,271 448.5,263 457.5,263" fill="#1f4e79"/>
  <rect x="226" y="274" width="454" height="76" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="453" y="302" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">数据访问层（持久层）</text>
  <text x="453" y="328" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">DAO · ORM · 连接与数据转换</text>
  <line x1="453" y1="350" x2="453" y2="373" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="453,381 448.5,373 457.5,373" fill="#1f4e79"/>
  <rect x="226" y="384" width="454" height="76" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="2"/>
  <text x="453" y="412" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#4a6130">数据层</text>
  <text x="453" y="438" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">数据库 · 文件 · XML文档</text>
  <rect x="34" y="164" width="152" height="186" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="110" y="194" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="16" font-weight="bold" fill="#c05621">封闭层约束</text>
  <text x="52" y="224" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">请求逐层向下</text>
  <text x="52" y="250" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">每层服务上层</text>
  <text x="52" y="276" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">同时作为下层客户</text>
  <text x="52" y="310" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#6b7a8a">接口稳定，实现可替换</text>
  <text x="360" y="486" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#6b7a8a">核心：关注分离；层数可按规模调整，并非固定四层</text>
</svg>
