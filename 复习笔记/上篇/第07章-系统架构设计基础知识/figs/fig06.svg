<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 185" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect x="0" y="0" width="720" height="185" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">体系结构设计过程：五步迭代</text>
  <g font-size="12" font-weight="bold" fill="#1f4e79">
    <rect x="10" y="46" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="72" y="74" text-anchor="middle">① 提出体系</text>
    <text x="72" y="94" text-anchor="middle">结构模型</text>
    <rect x="152" y="46" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="214" y="74" text-anchor="middle">② 把构件映射</text>
    <text x="214" y="94" text-anchor="middle">到体系结构</text>
    <rect x="294" y="46" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="356" y="74" text-anchor="middle">③ 分析构件</text>
    <text x="356" y="94" text-anchor="middle">相互作用</text>
    <rect x="436" y="46" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="498" y="74" text-anchor="middle">④ 产生软件</text>
    <text x="498" y="94" text-anchor="middle">体系结构</text>
    <rect x="578" y="46" width="124" height="64" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="640" y="82" text-anchor="middle" fill="#c05621">⑤ 设计评审</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.5">
    <line x1="134" y1="78" x2="141" y2="78"/>
    <line x1="276" y1="78" x2="283" y2="78"/>
    <line x1="418" y1="78" x2="425" y2="78"/>
    <line x1="560" y1="78" x2="567" y2="78"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="149,78 141,73.5 141,82.5"/>
    <polygon points="291,78 283,73.5 283,82.5"/>
    <polygon points="433,78 425,73.5 425,82.5"/>
    <polygon points="575,78 567,73.5 567,82.5"/>
  </g>
  <polyline points="640,110 640,140 72,140 72,121" fill="none" stroke="#6b7a8a" stroke-width="1.3" stroke-dasharray="5 3"/>
  <polygon points="72,113 67.5,121 76.5,121" fill="#6b7a8a"/>
  <text x="356" y="134" text-anchor="middle" font-size="11" fill="#6b7a8a">迭代</text>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#22303f">首要步骤是选择合适的体系结构风格；设计评审邀请独立于开发的外部人员</text>
</svg>
