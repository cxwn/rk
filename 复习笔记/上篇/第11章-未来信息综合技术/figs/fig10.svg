<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">数字孪生体概念模型与三种类型</text>
  <rect x="40" y="60" width="220" height="150" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
