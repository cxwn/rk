<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 依赖 -->
  <text x="180" y="26" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">依赖</text>
  <rect x="40" y="46" width="90" height="42" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="85" y="72" font-size="12" fill="#22303f" text-anchor="middle">事物 A</text>
  <rect x="250" y="46" width="90" height="42" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="295" y="72" font-size="12" fill="#22303f" text-anchor="middle">事物 B</text>
  <line x1="133" y1="67" x2="239" y2="67" stroke="#1f4e79" stroke-width="1.4" stroke-dasharray="5,3" fill="none"/>
  <polygon points="247,67 239,62.5 239,71.5" fill="#1f4e79"/>
  <text x="180" y="114" font-size="11" fill="#6b7a8a" text-anchor="middle">可能有方向的虚线</text>
  <!-- 关联（聚集） -->
  <text x="540" y="26" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">关联（聚集）</text>
  <rect x="400" y="46" width="90" height="42" rx="4" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="445" y="72" font-size="12" fill="#22303f" text-anchor="middle">整体</text>
  <rect x="610" y="46" width="90" height="42" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="655" y="72" font-size="12" fill="#22303f" text-anchor="middle">部分</text>
  <line x1="498" y1="67" x2="607" y2="67" stroke="#1f4e79" stroke-width="1.4"/>
  <polygon points="498,67 490,60 482,67 490,74" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="540" y="114" font-size="11" fill="#6b7a8a" text-anchor="middle">实线；聚集时整体端为空心菱形</text>
  <!-- 泛化 -->
  <text x="180" y="176" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">泛化</text>
  <rect x="40" y="196" width="90" height="42" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="85" y="222" font-size="12" fill="#22303f" text-anchor="middle">子元素</text>
  <rect x="250" y="196" width="90" height="42" rx="4" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="295" y="222" font-size="12" fill="#22303f" text-anchor="middle">父元素</text>
  <line x1="133" y1="217" x2="229" y2="217" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="247,217 229,209 229,225" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="180" y="264" font-size="11" fill="#6b7a8a" text-anchor="middle">带空心箭头的实线，指向父元素</text>
  <!-- 实现 -->
  <text x="540" y="176" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">实现</text>
  <rect x="400" y="196" width="90" height="42" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="445" y="222" font-size="12" fill="#22303f" text-anchor="middle">实现类</text>
  <rect x="610" y="196" width="90" height="42" rx="4" fill="#fdf0e6" stroke="#c05621"/>
  <text x="655" y="222" font-size="12" fill="#22303f" text-anchor="middle">接口</text>
  <line x1="493" y1="217" x2="589" y2="217" stroke="#1f4e79" stroke-width="1.4" stroke-dasharray="5,3" fill="none"/>
  <polygon points="607,217 589,209 589,225" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="540" y="264" font-size="11" fill="#6b7a8a" text-anchor="middle">带空心箭头的虚线</text>
  <text x="360" y="304" font-size="11" fill="#6b7a8a" text-anchor="middle">（据教材图 2-29～2-33 重绘）</text>
</svg>
