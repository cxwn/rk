<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">NoSQL 四层体系框架（由下至上）</text>
  <rect x="25" y="60" width="85" height="55" rx="6" fill="#f6f9fc" stroke="#6b7a8a"/>
  <text x="67" y="93" text-anchor="middle" font-size="14" fill="#22303f">上层应用</text>
  <line x1="110" y1="87" x2="119" y2="87" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="127,87 119,82.5 119,91.5" fill="#1f4e79"/>
  <rect x="130" y="60" width="460" height="55" rx="7" fill="#1f4e79" stroke="#1f4e79"/>
  <text x="185" y="94" font-size="16" font-weight="bold" fill="#ffffff">④ 接口层</text>
  <text x="310" y="82" font-size="11.5" fill="#ffffff">REST｜Thrift｜Map/Reduce</text>
  <text x="310" y="103" font-size="11.5" fill="#ffffff">Get/Put｜特定语言 API</text>
  <rect x="130" y="130" width="460" height="55" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="185" y="164" font-size="16" font-weight="bold" fill="#1f4e79">③ 数据逻辑模型层</text>
  <text x="365" y="164" font-size="13" fill="#22303f">数据的逻辑表现形式</text>
  <rect x="130" y="200" width="460" height="55" rx="7" fill="#fdf0e6" stroke="#c05621"/>
  <text x="185" y="234" font-size="16" font-weight="bold" fill="#c05621">② 数据分布层</text>
  <text x="335" y="234" font-size="13" fill="#22303f">CAP 支持｜多数据中心｜动态部署</text>
  <rect x="130" y="270" width="460" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="185" y="304" font-size="16" font-weight="bold" fill="#4a6130">① 数据持久层</text>
  <text x="335" y="304" font-size="13" fill="#22303f">内存｜硬盘｜内存＋硬盘｜可插拔</text>
  <text x="625" y="220" font-size="12" fill="#6b7a8a" transform="rotate(-90 625 220)">逐层支撑</text>
  <rect x="70" y="345" width="580" height="38" rx="6" fill="#f3f6ee"/>
  <text x="360" y="370" text-anchor="middle" font-size="13" fill="#4a6130">适用：模型较简单｜需灵活扩展｜高性能｜一致性要求不苛刻｜Key 易映射复杂值</text>
</svg>
