<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">四类 NoSQL 数据库的数据组织方式</text>
  <rect x="20" y="60" width="155" height="300" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="97" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">列式存储</text>
  <rect x="42" y="115" width="110" height="105" fill="#ffffff" stroke="#6b7a8a"/>
  <rect x="42" y="115" width="110" height="28" fill="#1f4e79"/>
  <rect x="79" y="143" width="37" height="77" fill="#fdf0e6"/>
  <line x1="79" y1="115" x2="79" y2="220" stroke="#6b7a8a"/>
  <line x1="116" y1="115" x2="116" y2="220" stroke="#6b7a8a"/>
  <line x1="42" y1="143" x2="152" y2="143" stroke="#6b7a8a"/>
  <line x1="42" y1="169" x2="152" y2="169" stroke="#d5dde5"/>
  <line x1="42" y1="195" x2="152" y2="195" stroke="#d5dde5"/>
  <text x="97" y="248" text-anchor="middle" font-size="13" fill="#22303f">按列／列族组织</text>
  <text x="97" y="275" text-anchor="middle" font-size="12" fill="#6b7a8a">海量数据与分析</text>
  <text x="97" y="314" text-anchor="middle" font-size="12" fill="#1f4e79">Cassandra</text>
  <text x="97" y="339" text-anchor="middle" font-size="12" fill="#1f4e79">HBase、Riak</text>
  <rect x="195" y="60" width="155" height="300" rx="8" fill="#fdf0e6" stroke="#c05621"/>
  <text x="272" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">键值存储</text>
  <rect x="208" y="135" width="52" height="42" rx="5" fill="#ffffff" stroke="#c05621"/>
  <text x="234" y="162" text-anchor="middle" font-size="13" fill="#22303f">Key</text>
  <line x1="260" y1="156" x2="279" y2="156" stroke="#c05621" stroke-width="1.5"/>
  <polygon points="287,156 279,151.5 279,160.5" fill="#c05621"/>
  <rect x="290" y="135" width="48" height="42" rx="5" fill="#ffffff" stroke="#c05621"/>
  <text x="314" y="162" text-anchor="middle" font-size="13" fill="#22303f">Value</text>
  <text x="272" y="205" text-anchor="middle" font-size="12" fill="#6b7a8a">哈希定位，简单易部署</text>
  <text x="272" y="248" text-anchor="middle" font-size="13" fill="#22303f">按键快速读写整个值</text>
  <text x="272" y="275" text-anchor="middle" font-size="12" fill="#6b7a8a">局部查值效率较低</text>
  <text x="272" y="327" text-anchor="middle" font-size="12" fill="#c05621">Redis、Oracle BDB</text>
  <rect x="370" y="60" width="155" height="300" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="447" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a6130">文档型</text>
  <rect x="393" y="115" width="108" height="110" rx="5" fill="#ffffff" stroke="#8aa15c"/>
  <text x="406" y="141" font-size="13" fill="#4a6130">{</text>
  <text x="414" y="164" font-size="12" fill="#22303f">"name": "林"</text>
  <text x="414" y="187" font-size="12" fill="#22303f">"tags": [...]</text>
  <text x="406" y="213" font-size="13" fill="#4a6130">}</text>
  <text x="447" y="251" text-anchor="middle" font-size="13" fill="#22303f">JSON 等半结构化文档</text>
  <text x="447" y="278" text-anchor="middle" font-size="12" fill="#6b7a8a">支持嵌套键值</text>
  <text x="447" y="314" text-anchor="middle" font-size="12" fill="#4a6130">MongoDB、CouchDB</text>
  <text x="447" y="339" text-anchor="middle" font-size="12" fill="#4a6130">SequoiaDB</text>
  <rect x="545" y="60" width="155" height="300" rx="8" fill="#f6f9fc" stroke="#6b7a8a"/>
  <text x="622" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">图数据库</text>
  <line x1="598" y1="145" x2="637" y2="142" stroke="#6b7a8a" stroke-width="1.5"/>
  <line x1="643" y1="154" x2="614" y2="188" stroke="#6b7a8a" stroke-width="1.5"/>
  <line x1="595" y1="185" x2="589" y2="164" stroke="#6b7a8a" stroke-width="1.5"/>
  <circle cx="580" cy="147" r="18" fill="#eaf1f8" stroke="#1f4e79"/>
  <circle cx="655" cy="140" r="18" fill="#fdf0e6" stroke="#c05621"/>
  <circle cx="602" cy="202" r="18" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="622" y="250" text-anchor="middle" font-size="13" fill="#22303f">结点＋边表达关系</text>
  <text x="622" y="277" text-anchor="middle" font-size="12" fill="#6b7a8a">社交、交通网络</text>
  <text x="622" y="327" text-anchor="middle" font-size="12" fill="#1f4e79">Neo4j、InfoGrid</text>
  <text x="360" y="385" text-anchor="middle" font-size="13" fill="#6b7a8a">共同特点：易扩展｜大数据量高性能｜模型灵活｜高可用</text>
</svg>
