  <rect x="75" y="157" width="210" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="180" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">领域包 B</text>
  <text x="180" y="199" text-anchor="middle" font-size="12" fill="#6b7a8a">较具体实现</text>
  <rect x="75" y="239" width="210" height="52" rx="6" fill="#fdf0e6" stroke="#c05621"/>
