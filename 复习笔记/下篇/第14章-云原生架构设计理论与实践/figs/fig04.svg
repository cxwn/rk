<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="170" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b7a8a">传统架构</text>
  <text x="510" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Mesh 化架构</text>
  <!-- 左 业务进程 -->
  <rect x="50" y="50" width="240" height="200" rx="8" fill="#f4f6f8" stroke="#6b7a8a" stroke-width="1.5"/>
  <text x="170" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#22303f">业务进程</text>
  <rect x="70" y="82" width="200" height="36" rx="5" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="170" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">业务代码</text>
  <rect x="70" y="130" width="95" height="30" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="117" y="149" text-anchor="middle" font-size="11" fill="#1f4e79">RPC SDK</text>
  <rect x="175" y="130" width="95" height="30" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="222" y="149" text-anchor="middle" font-size="11" fill="#1f4e79">Redis SDK</text>
  <rect x="70" y="168" width="95" height="30" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="117" y="187" text-anchor="middle" font-size="11" fill="#1f4e79">MQ SDK</text>
  <rect x="175" y="168" width="95" height="30" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="222" y="187" text-anchor="middle" font-size="11" fill="#1f4e79">DB SDK</text>
  <text x="170" y="224" text-anchor="middle" font-size="11" fill="#6b7a8a">SDK 与业务代码耦合</text>
  <!-- 左网络 -->
  <line x1="170" y1="254" x2="170" y2="269" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="170,277 165.5,269 174.5,269" fill="#6b7a8a"/>
  <rect x="50" y="280" width="240" height="34" rx="5" fill="#e4e9ee" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="170" y="302" text-anchor="middle" font-size="12" fill="#22303f">网络</text>
  <!-- 右 业务进程 -->
  <rect x="330" y="50" width="170" height="200" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="415" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">业务进程</text>
  <rect x="345" y="82" width="140" height="36" rx="5" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="415" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">业务代码</text>
  <rect x="345" y="130" width="140" height="30" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="415" y="149" text-anchor="middle" font-size="11" fill="#1f4e79">薄 Client（少变化）</text>
  <text x="415" y="190" text-anchor="middle" font-size="11" fill="#6b7a8a">只负责与 Mesh 通信</text>
  <text x="415" y="212" text-anchor="middle" font-size="11" fill="#6b7a8a">中间件升级业务无感</text>
  <!-- 右 Mesh 进程 -->
  <rect x="530" y="50" width="160" height="200" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="610" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">Mesh 进程</text>
  <text x="610" y="104" text-anchor="middle" font-size="12" fill="#22303f">流量控制</text>
  <text x="610" y="130" text-anchor="middle" font-size="12" fill="#22303f">安全策略</text>
  <text x="610" y="156" text-anchor="middle" font-size="12" fill="#22303f">微隔离……</text>
  <text x="610" y="190" text-anchor="middle" font-size="11" fill="#c05621">熔断/限流/降级</text>
  <text x="610" y="212" text-anchor="middle" font-size="11" fill="#c05621">重试/反压/隔仓</text>
  <!-- Client -> Mesh -->
  <line x1="489" y1="145" x2="519" y2="145" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="527,145 519,140.5 519,149.5" fill="#c05621"/>
  <!-- Mesh -> 网络 -->
  <line x1="610" y1="254" x2="610" y2="269" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="610,277 605.5,269 614.5,269" fill="#c05621"/>
  <rect x="330" y="280" width="360" height="34" rx="5" fill="#e4e9ee" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="510" y="302" text-anchor="middle" font-size="12" fill="#22303f">网络（新协议、加密、染色……）</text>
  <!-- 底部说明 -->
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#22303f">中间件 SDK 从业务进程剥离为 Mesh 进程，分布式治理与零信任安全由 Mesh 承担</text>
</svg>
