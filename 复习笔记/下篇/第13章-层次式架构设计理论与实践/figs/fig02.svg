<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="22" font-weight="bold" fill="#22303f">MVC协作关系（重绘图13-2）</text>
  <rect x="270" y="60" width="180" height="88" rx="9" fill="#fdf0e6" stroke="#c05621" stroke-width="2"/>
  <text x="360" y="91" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#c05621">控制器 Controller</text>
  <text x="360" y="119" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">解释输入 · 调用模型 · 选择视图</text>
  <rect x="52" y="284" width="190" height="94" rx="9" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="147" y="316" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">视图 View</text>
  <text x="147" y="344" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">显示状态 · 接收输入</text>
  <text x="147" y="366" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#6b7a8a">可查询模型，不做业务处理</text>
  <rect x="478" y="284" width="190" height="94" rx="9" fill="#f3f6ee" stroke="#8aa15c" stroke-width="2"/>
  <text x="573" y="316" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#4a6130">模型 Model</text>
  <text x="573" y="344" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">业务数据 · 业务逻辑</text>
  <text x="573" y="366" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#6b7a8a">处理流程，通知状态更新</text>
  <line x1="320" y1="148" x2="196" y2="272" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="190,280 194,271 201,275" fill="#1f4e79"/>
  <text x="206" y="202" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#1f4e79">选择视图</text>
  <line x1="400" y1="148" x2="524" y2="272" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="530,280 519,275 526,271" fill="#1f4e79"/>
  <text x="474" y="202" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#1f4e79">调用业务处理</text>
  <line x1="242" y1="320" x2="466" y2="320" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="474,320 466,315.5 466,324.5" fill="#1f4e79"/>
  <text x="354" y="307" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#1f4e79">状态查询</text>
  <line x1="478" y1="354" x2="254" y2="354" stroke="#c05621" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <polygon points="246,354 254,349.5 254,358.5" fill="#c05621"/>
  <text x="362" y="383" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#c05621">数据更新事件（虚线）</text>
  <rect x="245" y="404" width="230" height="42" rx="7" fill="#eaf1f8" stroke="#6b7a8a"/>
  <text x="360" y="431" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">请求 → 控制器 → 模型 → 视图 → 用户</text>
</svg>
