  <rect x="474" y="105" width="62" height="45" rx="4" fill="#ffffff" stroke="#c05621"/>
  <rect x="556" y="105" width="52" height="45" rx="4" fill="#ffffff" stroke="#c05621"/>
  <rect x="628" y="105" width="52" height="45" rx="4" fill="#ffffff" stroke="#c05621"/>
