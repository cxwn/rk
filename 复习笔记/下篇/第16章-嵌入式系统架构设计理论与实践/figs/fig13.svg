<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="460" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">ADD 七步迭代与 DARTS 五步开发</text>
  <text x="35" y="61" font-size="16" font-weight="bold" fill="#1f4e79">ADD：质量属性场景驱动</text>
  <g text-anchor="middle" font-size="12" fill="#22303f">
    <rect x="25" y="82" width="84" height="72" rx="6" fill="#1f4e79"/><text x="67" y="111" fill="#ffffff" font-weight="bold">1 评审</text><text x="67" y="134" fill="#eaf1f8">输入可用</text>
    <rect x="122" y="82" width="84" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79"/><text x="164" y="105" font-weight="bold">2 选驱动</text><text x="164" y="128">建立迭代</text><text x="164" y="146">目标</text>
    <rect x="219" y="82" width="84" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79"/><text x="261" y="105" font-weight="bold">3 选元素</text><text x="261" y="128">确定细化</text><text x="261" y="146">对象</text>
    <rect x="316" y="82" width="84" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79"/><text x="358" y="105" font-weight="bold">4 选概念</text><text x="358" y="128">模式战术</text><text x="358" y="146">满足驱动</text>
    <rect x="413" y="82" width="84" height="72" rx="6" fill="#fdf0e6" stroke="#c05621"/><text x="455" y="105" font-weight="bold">5 实例化</text><text x="455" y="128">分配职责</text><text x="455" y="146">定义接口</text>
    <rect x="510" y="82" width="84" height="72" rx="6" fill="#fdf0e6" stroke="#c05621"/><text x="552" y="105" font-weight="bold">6 草拟视图</text><text x="552" y="128">记录设计</text><text x="552" y="146">决策</text>
    <rect x="607" y="82" width="84" height="72" rx="6" fill="#f3f6ee" stroke="#8aa15c"/><text x="649" y="105" font-weight="bold">7 分析评审</text><text x="649" y="128">检查目标</text><text x="649" y="146">决定迭代</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.3" fill="none">
    <line x1="109" y1="118" x2="114" y2="118"/><line x1="206" y1="118" x2="211" y2="118"/><line x1="303" y1="118" x2="308" y2="118"/>
    <line x1="400" y1="118" x2="405" y2="118"/><line x1="497" y1="118" x2="502" y2="118"/><line x1="594" y1="118" x2="599" y2="118"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="119,118 111,113.5 111,122.5"/><polygon points="216,118 208,113.5 208,122.5"/><polygon points="313,118 305,113.5 305,122.5"/>
    <polygon points="410,118 402,113.5 402,122.5"/><polygon points="507,118 499,113.5 499,122.5"/><polygon points="604,118 596,113.5 596,122.5"/>
  </g>
  <polyline points="649,154 649,190 164,190 164,162" stroke="#8aa15c" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <polygon points="164,157 159.5,165 168.5,165" fill="#8aa15c"/>
  <text x="406" y="181" text-anchor="middle" font-size="12" fill="#4a6130">高风险或关键驱动未满足：继续迭代</text>
  <text x="35" y="239" font-size="16" font-weight="bold" fill="#c05621">DARTS：并发任务与接口驱动</text>
  <g text-anchor="middle" font-size="13" fill="#22303f">
    <rect x="25" y="265" width="120" height="82" rx="7" fill="#c05621"/><text x="85" y="294" fill="#ffffff" font-weight="bold">1 RTSA 规范</text><text x="85" y="320" fill="#fdf0e6">SCD / DFD / STD</text>
    <rect x="162" y="265" width="120" height="82" rx="7" fill="#fdf0e6" stroke="#c05621"/><text x="222" y="294" font-weight="bold">2 划分任务</text><text x="222" y="320">应用结构化标准</text>
    <rect x="299" y="265" width="120" height="82" rx="7" fill="#fdf0e6" stroke="#c05621"/><text x="359" y="294" font-weight="bold">3 定义接口</text><text x="359" y="316">消息 / 事件 / IHM</text><text x="359" y="336">分配时间预算</text>
    <rect x="436" y="265" width="120" height="82" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="496" y="294" font-weight="bold">4 设计任务</text><text x="496" y="316">顺序程序模块化</text><text x="496" y="336">PDL 详细设计</text>
    <rect x="573" y="265" width="120" height="82" rx="7" fill="#1f4e79"/><text x="633" y="294" fill="#ffffff" font-weight="bold">5 形成成果</text><text x="633" y="316" fill="#eaf1f8">规范 / 任务结构</text><text x="633" y="336" fill="#eaf1f8">任务分解</text>
  </g>
  <g stroke="#c05621" stroke-width="1.4" fill="none"><line x1="145" y1="306" x2="154" y2="306"/><line x1="282" y1="306" x2="291" y2="306"/><line x1="419" y1="306" x2="428" y2="306"/><line x1="556" y1="306" x2="565" y2="306"/></g>
  <g fill="#c05621"><polygon points="159,306 151,301.5 151,310.5"/><polygon points="296,306 288,301.5 288,310.5"/><polygon points="433,306 425,301.5 425,310.5"/><polygon points="570,306 562,301.5 562,310.5"/></g>
  <rect x="80" y="385" width="560" height="48" rx="8" fill="#eaf1f8"/>
  <text x="360" y="406" text-anchor="middle" font-size="13" fill="#1f4e79">ADD 回答「如何满足质量场景」；DARTS 回答「如何组织并发实时任务」</text>
  <text x="360" y="425" text-anchor="middle" font-size="12" fill="#6b7a8a">两者都要形成可评审、可追踪的架构决策</text>
</svg>