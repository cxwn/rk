<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">某快递公司核心业务上云架构（混合过渡态）</text>
  <!-- 层1 流量入口 -->
  <text x="70" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">流量入口</text>
  <rect x="110" y="44" width="560" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <rect x="122" y="54" width="260" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="252" y="75" text-anchor="middle" font-size="11" fill="#22303f">云 DNS / PrivateZone</text>
  <rect x="396" y="54" width="260" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="526" y="75" text-anchor="middle" font-size="11" fill="#22303f">F5 / SLB 内外网 VIP</text>
  <!-- 层2 接入层 -->
  <text x="70" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">接入层</text>
  <rect x="110" y="120" width="560" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <rect x="122" y="130" width="260" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="252" y="151" text-anchor="middle" font-size="11" fill="#22303f">Nginx（内/外网）</text>
  <rect x="396" y="130" width="260" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="526" y="151" text-anchor="middle" font-size="11" fill="#22303f">Ingress 统一域名转发</text>
  <!-- 层3 应用服务 -->
  <text x="70" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">应用服务</text>
  <rect x="110" y="196" width="560" height="52" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <rect x="120" y="206" width="176" height="32" rx="4" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="208" y="227" text-anchor="middle" font-size="11" fill="#22303f">Java Pod（K8s）</text>
  <rect x="304" y="206" width="176" height="32" rx="4" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="392" y="227" text-anchor="middle" font-size="11" fill="#22303f">.NET/Java VM（ECS）</text>
  <rect x="488" y="206" width="176" height="32" rx="4" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="576" y="227" text-anchor="middle" font-size="11" fill="#22303f">Namespace 隔离</text>
  <!-- 层4 中台中间件 -->
  <text x="70" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">中台中间件</text>
  <rect x="110" y="272" width="560" height="52" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <rect x="120" y="282" width="176" height="32" rx="4" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
  <text x="208" y="303" text-anchor="middle" font-size="11" fill="#22303f">云 Redis</text>
  <rect x="304" y="282" width="176" height="32" rx="4" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
  <text x="392" y="303" text-anchor="middle" font-size="11" fill="#22303f">OLTP/OLAP 数据库</text>
  <rect x="488" y="282" width="176" height="32" rx="4" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
  <text x="576" y="303" text-anchor="middle" font-size="11" fill="#22303f">消息中间件</text>
  <!-- 层5 基础设施 -->
  <text x="70" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7a8a">基础设施</text>
  <rect x="110" y="348" width="560" height="52" rx="6" fill="#f4f6f8" stroke="#6b7a8a" stroke-width="1.2"/>
  <rect x="122" y="358" width="260" height="32" rx="4" fill="#ffffff" stroke="#6b7a8a" stroke-width="1"/>
  <text x="252" y="379" text-anchor="middle" font-size="11" fill="#22303f">ACK + 神龙裸金属服务器</text>
  <rect x="396" y="358" width="260" height="32" rx="4" fill="#ffffff" stroke="#6b7a8a" stroke-width="1"/>
  <text x="526" y="379" text-anchor="middle" font-size="11" fill="#22303f">存量 VMware / 物理机</text>
  <!-- 层间箭头 -->
  <line x1="390" y1="100" x2="390" y2="109" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="390,117 385.5,109 394.5,109" fill="#1f4e79"/>
  <line x1="390" y1="176" x2="390" y2="185" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="390,193 385.5,185 394.5,185" fill="#1f4e79"/>
  <line x1="390" y1="252" x2="390" y2="261" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="390,269 385.5,261 394.5,261" fill="#1f4e79"/>
  <line x1="390" y1="328" x2="390" y2="337" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="390,345 385.5,337 394.5,337" fill="#1f4e79"/>
</svg>
