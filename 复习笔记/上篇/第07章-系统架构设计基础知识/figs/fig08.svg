  <polyline points="90,168 90,186 170,186 170,209" fill="none" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="170,217 165.5,209 174.5,209" fill="#1f4e79"/>
  <rect x="110" y="220" width="120" height="38" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="170" y="244" text-anchor="middle" font-size="13" fill="#1f4e79">子程序 C</text>
  <text x="170" y="286" text-anchor="middle" font-size="11" fill="#22303f">单线程控制；过程调用为连接件</text>
  <line x1="350" y1="14" x2="350" y2="290" stroke="#6b7a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="540" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">层次型</text>
  <g font-size="13" font-weight="bold" fill="#4a6130">
