<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303f">信息系统的组成与五个基本功能</text>
  <rect x="40" y="50" width="640" height="105" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="60" y="76" font-size="15" font-weight="bold" fill="#1f4e79">六类组成：以处理信息流为目的的人机一体化系统</text>
  <g font-size="13" fill="#22303f" text-anchor="middle">
    <rect x="42" y="94" width="96" height="42" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="90" y="120">计算机硬件</text>
    <rect x="150" y="94" width="96" height="42" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="198" y="120">网络通信设备</text>
    <rect x="258" y="94" width="96" height="42" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="306" y="120">计算机软件</text>
    <rect x="366" y="94" width="96" height="42" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="414" y="120">信息资源</text>
    <rect x="474" y="94" width="96" height="42" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="522" y="120">信息用户</text>
    <rect x="582" y="94" width="96" height="42" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="630" y="120">规章制度</text>
  </g>
  <line x1="360" y1="155" x2="360" y2="172" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,182 355.5,174 364.5,174" fill="#1f4e79"/>
  <rect x="40" y="185" width="640" height="185" rx="10" fill="#f8fafc" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="60" y="212" font-size="15" font-weight="bold" fill="#1f4e79">五个基本功能</text>
  <text x="660" y="212" text-anchor="end" font-size="12" fill="#6b7a8a">原始数据经过处理，转化为可用的信息</text>
  <g text-anchor="middle">
    <rect x="47" y="240" width="106" height="68" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="100" y="267" font-size="17" font-weight="bold" fill="#1f4e79">输入</text>
    <text x="100" y="291" font-size="12" fill="#22303f">收集原始数据</text>
    <rect x="177" y="240" width="106" height="68" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="230" y="267" font-size="17" font-weight="bold" fill="#1f4e79">存储</text>
    <text x="230" y="291" font-size="12" fill="#22303f">保存资料数据</text>
    <rect x="307" y="240" width="106" height="68" rx="7" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="267" font-size="17" font-weight="bold" fill="#c05621">处理</text>
    <text x="360" y="291" font-size="12" fill="#22303f">加工分析数据</text>
    <rect x="437" y="240" width="106" height="68" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="490" y="267" font-size="17" font-weight="bold" fill="#4a6130">输出</text>
    <text x="490" y="291" font-size="12" fill="#22303f">提供所需信息</text>
    <rect x="567" y="240" width="106" height="68" rx="7" fill="#fdf0e6" stroke="#c05621"/>
    <text x="620" y="267" font-size="17" font-weight="bold" fill="#c05621">控制</text>
    <text x="620" y="291" font-size="12" fill="#22303f">管理约束环节</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="153" y1="274" x2="166" y2="274"/><line x1="283" y1="274" x2="296" y2="274"/>
    <line x1="413" y1="274" x2="426" y2="274"/><line x1="543" y1="274" x2="556" y2="274"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="174,274 166,269.5 166,278.5"/><polygon points="304,274 296,269.5 296,278.5"/>
    <polygon points="434,274 426,269.5 426,278.5"/><polygon points="564,274 556,269.5 556,278.5"/>
  </g>
  <rect x="55" y="329" width="610" height="26" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="360" y="347" text-anchor="middle" font-size="13" fill="#4a6130">控制贯穿加工、处理、传输与输出；各项功能最终服务于有效输出</text>
  <text x="360" y="400" text-anchor="middle" font-size="13" fill="#6b7a8a">计算机只是技术基础，用户与计算机共同完成信息工作</text>
</svg>
