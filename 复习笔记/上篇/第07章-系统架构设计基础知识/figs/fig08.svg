    <text x="540" y="55" text-anchor="middle">用户系统</text>
    <rect x="400" y="94" width="280" height="40" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
    <text x="540" y="119" text-anchor="middle">各种构件</text>
    <rect x="400" y="158" width="280" height="40" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
    <text x="540" y="183" text-anchor="middle">核心层</text>
    <rect x="400" y="222" width="280" height="40" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
    <text x="540" y="247" text-anchor="middle">基本工具</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.4">
    <line x1="520" y1="70" x2="520" y2="83"/>
    <line x1="520" y1="134" x2="520" y2="147"/>
    <line x1="520" y1="198" x2="520" y2="211"/>
    <line x1="580" y1="94" x2="580" y2="81"/>
    <line x1="580" y1="158" x2="580" y2="145"/>
    <line x1="580" y1="222" x2="580" y2="209"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="520,91 515.5,83 524.5,83"/>
    <polygon points="520,155 515.5,147 524.5,147"/>
    <polygon points="520,219 515.5,211 524.5,211"/>
    <polygon points="580,73 575.5,81 584.5,81"/>
    <polygon points="580,137 575.5,145 584.5,145"/>
    <polygon points="580,201 575.5,209 584.5,209"/>
  </g>
  <text x="505" y="86" text-anchor="end" font-size="10" fill="#6b7a8a">提供服务</text>
  <text x="595" y="86" font-size="10" fill="#6b7a8a">作为客户</text>
  <text x="540" y="286" text-anchor="middle" font-size="11" fill="#22303f">每层为上层服务，并作为下层的客户</text>
