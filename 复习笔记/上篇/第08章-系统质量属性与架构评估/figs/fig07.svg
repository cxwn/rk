<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">ATAM 效用树：从整体效用落到可排序场景</text>
  <rect x="280" y="50" width="160" height="45" rx="8" fill="#1f4e79"/>
  <text x="360" y="79" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">树根：效用</text>
  <line x1="360" y1="95" x2="360" y2="114" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,122 355.5,114 364.5,114" fill="#1f4e79"/>
  <rect x="140" y="125" width="440" height="70" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">第二层：质量属性</text>
  <text x="360" y="179" text-anchor="middle" font-size="16">性能　　安全性　　可修改性　　可用性</text>
  <line x1="360" y1="195" x2="360" y2="219" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,227 355.5,219 364.5,219" fill="#1f4e79"/>
  <rect x="140" y="230" width="440" height="60" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="360" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6130">第三层：属性分类 / 具体说明</text>
  <text x="360" y="278" text-anchor="middle" font-size="13">例如：性能 → 响应时间；安全性 → 数据机密性</text>
  <line x1="360" y1="290" x2="360" y2="319" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,327 355.5,319 364.5,319" fill="#1f4e79"/>
  <rect x="60" y="330" width="600" height="90" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05621">叶子：质量属性场景</text>
  <rect x="85" y="370" width="260" height="32" rx="5" fill="#ffffff"/>
  <rect x="375" y="370" width="260" height="32" rx="5" fill="#ffffff"/>
  <text x="215" y="391" text-anchor="middle" font-size="12">95% 订单请求 2 秒内返回</text>
  <text x="505" y="391" text-anchor="middle" font-size="12">未授权用户不能读取订单数据</text>
  <rect x="60" y="440" width="600" height="40" rx="6" fill="#eaf1f8"/>
  <text x="360" y="465" text-anchor="middle" font-size="14" fill="#1f4e79">修剪后逐叶标注（重要性，实现难易度）：(H,L) = 重要且易实现</text>
</svg>
