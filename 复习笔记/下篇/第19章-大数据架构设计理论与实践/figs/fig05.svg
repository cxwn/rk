<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">服务层：合并视图并对外查询（教材图 19-8 重绘）</text>
  <rect x="40" y="55" width="220" height="65" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="150" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">Batch View</text>
  <text x="150" y="103" text-anchor="middle" font-size="11" fill="#22303f">截至上次批算的准确结果</text>
  <rect x="460" y="55" width="220" height="65" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="570" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">Real-time View</text>
  <text x="570" y="103" text-anchor="middle" font-size="11" fill="#22303f">最近增量的低延迟结果</text>
  <line x1="150" y1="120" x2="277" y2="159" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="284,167 275,163 278,155" fill="#1f4e79"/>
  <line x1="570" y1="120" x2="443" y2="159" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="436,167 442,155 445,163" fill="#c05621"/>
  <rect x="250" y="170" width="220" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.4"/>
  <text x="360" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">Serving Layer</text>
  <text x="360" y="214" text-anchor="middle" font-size="11" fill="#22303f">按 Monoid 或业务规则合并</text>
  <line x1="360" y1="225" x2="360" y2="239" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="360,247 355.5,239 364.5,239" fill="#8aa15c"/>
  <rect x="250" y="250" width="220" height="40" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="360" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">最终查询视图</text>
  <rect x="25" y="165" width="180" height="90" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="115" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f4e79">可结合函数</text>
  <text x="115" y="212" text-anchor="middle" font-size="10" fill="#22303f">直接合并部分结果</text>
  <text x="115" y="233" text-anchor="middle" font-size="10" fill="#4a6130">如求和、计数</text>
  <rect x="515" y="165" width="180" height="90" rx="6" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="605" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">不可直接结合</text>
  <text x="605" y="212" text-anchor="middle" font-size="10" fill="#22303f">先拆中间量再合并</text>
  <text x="605" y="233" text-anchor="middle" font-size="10" fill="#4a6130">或采用明确业务规则</text>
</svg>