  <text x="84" y="362" text-anchor="middle" font-size="10" fill="#22303f">云侧计算与存储</text>
  <text x="84" y="382" text-anchor="middle" font-size="10" fill="#22303f">边缘处理与共享</text>
  <text x="84" y="402" text-anchor="middle" font-size="10" fill="#22303f">端侧实时操作</text>
  <text x="84" y="419" text-anchor="middle" font-size="9" fill="#6b7a8a">动态任务迁移</text>
  <rect x="158" y="292" width="128" height="136" rx="5" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="222" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">持续学习</text>
  <text x="222" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">与协同学习</text>
  <text x="222" y="362" text-anchor="middle" font-size="10" fill="#22303f">少量数据建识别</text>
  <text x="222" y="382" text-anchor="middle" font-size="10" fill="#22303f">自主找数与标注</text>
  <text x="222" y="402" text-anchor="middle" font-size="10" fill="#22303f">重训练持续提升</text>
  <text x="222" y="419" text-anchor="middle" font-size="9" fill="#6b7a8a">云端共享数据</text>
  <rect x="296" y="292" width="128" height="136" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="360" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">知识图谱</text>
  <text x="360" y="362" text-anchor="middle" font-size="10" fill="#22303f">动态、个性化知识</text>
  <text x="360" y="382" text-anchor="middle" font-size="10" fill="#22303f">结合感知与决策</text>
  <text x="360" y="402" text-anchor="middle" font-size="10" fill="#22303f">分布于云边端</text>
  <rect x="434" y="292" width="128" height="136" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="498" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">场景自适应</text>
  <text x="498" y="362" text-anchor="middle" font-size="10" fill="#22303f">三维语义理解</text>
  <text x="498" y="382" text-anchor="middle" font-size="10" fill="#22303f">预测场景事件</text>
  <text x="498" y="402" text-anchor="middle" font-size="10" fill="#22303f">改变行为模式</text>
  <rect x="572" y="292" width="128" height="136" rx="5" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="636" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">数据安全</text>
  <text x="636" y="362" text-anchor="middle" font-size="10" fill="#22303f">端到端安全传输</text>
  <text x="636" y="382" text-anchor="middle" font-size="10" fill="#22303f">服务器安全存储</text>
  <text x="636" y="402" text-anchor="middle" font-size="10" fill="#22303f">云边端差异防护</text>
  <text x="30" y="452" font-size="11" fill="#6b7a8a">记忆：示教再现无感知 → 感觉型能识别 → 智能型可决策；4.0 重协同、学习与安全。</text>
