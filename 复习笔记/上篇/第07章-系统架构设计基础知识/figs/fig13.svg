<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 205" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect x="0" y="0" width="720" height="205" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">软件架构复用的基本过程</text>
  <rect x="30" y="60" width="180" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="120" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">① 构造/获取</text>
  <text x="120" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">可复用资产</text>
  <rect x="280" y="60" width="170" height="60" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="365" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">② 可复用资产库</text>
  <text x="365" y="106" text-anchor="middle" font-size="12" fill="#22303f">构件库</text>
  <rect x="520" y="60" width="170" height="60" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="605" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">③ 复用这些资产</text>
  <text x="605" y="106" text-anchor="middle" font-size="12" fill="#22303f">定制后组装集成</text>
  <line x1="210" y1="90" x2="269" y2="90" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="277,90 269,85.5 269,94.5" fill="#1f4e79"/>
  <text x="243" y="76" text-anchor="middle" font-size="11" fill="#6b7a8a">入库</text>
  <line x1="450" y1="90" x2="509" y2="90" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="517,90 509,85.5 509,94.5" fill="#1f4e79"/>
  <text x="485" y="76" text-anchor="middle" font-size="10" fill="#6b7a8a">选择/定制/组装</text>
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#22303f">获取：资产须可靠、可被广泛使用、易于理解和修改</text>
  <text x="360" y="170" text-anchor="middle" font-size="11" fill="#22303f">管理：构件库支持存储、管理、检索与浏览维护；关键是构件分类与构件检索</text>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#22303f">使用：检索获取后修改、扩展、配置，再组装与集成形成最终系统</text>
</svg>
