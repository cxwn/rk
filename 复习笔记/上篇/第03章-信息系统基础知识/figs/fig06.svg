    <polyline points="280,560 280,578 80,578 80,607"/>
    <polyline points="320,560 320,585 220,585 220,607"/>
    <line x1="360" y1="560" x2="360" y2="607"/>
    <polyline points="400,560 400,585 500,585 500,607"/>
    <polyline points="440,560 440,578 640,578 640,607"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="80,617 75.5,609 84.5,609"/><polygon points="220,617 215.5,609 224.5,609"/>
    <polygon points="360,617 355.5,609 364.5,609"/><polygon points="500,617 495.5,609 504.5,609"/>
    <polygon points="640,617 635.5,609 644.5,609"/>
