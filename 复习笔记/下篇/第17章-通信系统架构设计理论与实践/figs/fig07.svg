<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">两类设备五种互连拓扑与可用性（教材图 17-18 重绘）</text>
  <text x="80" y="46" text-anchor="middle" font-size="10" fill="#6b7a8a">①一对一·单点单归</text>
  <text x="220" y="46" text-anchor="middle" font-size="10" fill="#6b7a8a">②一对二·单点双归</text>
  <text x="360" y="46" text-anchor="middle" font-size="10" fill="#6b7a8a">③二对一·双点单归</text>
  <text x="500" y="46" text-anchor="middle" font-size="10" fill="#6b7a8a">④双一对一·双点双归</text>
  <text x="640" y="46" text-anchor="middle" font-size="10" fill="#6b7a8a">⑤双一对二·双归属</text>
  <!-- (a) -->
  <line x1="80" y1="80" x2="80" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <rect x="63" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="80" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="63" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="80" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <text x="80" y="168" text-anchor="middle" font-size="10" fill="#22303f">A1=R1×R2</text>
  <!-- (b) 2 NE1 + 1 NE2 -->
  <line x1="197" y1="80" x2="197" y2="100" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="243" y1="80" x2="243" y2="100" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="197" y1="100" x2="243" y2="100" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="220" y1="100" x2="220" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <rect x="180" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="197" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="226" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="243" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="203" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="220" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <text x="220" y="168" text-anchor="middle" font-size="10" fill="#22303f">A2=R2×[1-(1-R1)²]</text>
  <!-- (c) 1 NE1 + 2 NE2 -->
  <line x1="360" y1="80" x2="360" y2="100" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="337" y1="100" x2="383" y2="100" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="337" y1="100" x2="337" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="383" y1="100" x2="383" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <rect x="343" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="360" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="320" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="337" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <rect x="366" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="383" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <text x="360" y="168" text-anchor="middle" font-size="10" fill="#22303f">A3=R1×[1-(1-R2)²]</text>
  <!-- (d) -->
  <line x1="477" y1="80" x2="477" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="523" y1="80" x2="523" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <rect x="460" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="477" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="506" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="523" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="460" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="477" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <rect x="506" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="523" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <text x="500" y="168" text-anchor="middle" font-size="10" fill="#22303f">A4=1-(1-R1×R2)²</text>
  <!-- (e) 全连接 -->
  <line x1="617" y1="80" x2="617" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="663" y1="80" x2="663" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="617" y1="80" x2="663" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="663" y1="80" x2="617" y2="120" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <rect x="600" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="617" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="646" y="60" width="34" height="20" rx="3" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1"/>
  <text x="663" y="74" text-anchor="middle" font-size="9" fill="#1f4e79">NE1</text>
  <rect x="600" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="617" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <rect x="646" y="120" width="34" height="20" rx="3" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1"/>
  <text x="663" y="134" text-anchor="middle" font-size="9" fill="#4a6130">NE2</text>
  <text x="640" y="168" text-anchor="middle" font-size="10" fill="#22303f">A5=[1-(1-R1)²]×[1-(1-R2)²]</text>
  <!-- 可用性公式与途径 -->
  <text x="360" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">可用性 A = MTBF / (MTBF + MTTR)</text>
  <text x="360" y="238" text-anchor="middle" font-size="11" fill="#22303f">MTBF：平均无故障时间（可靠性）；MTTR：平均故障修复时间（可维护性）</text>
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#22303f">途径① 提高 MTBF：少出故障，软件 Bug 是可靠性主因，提升软件质量更具成本优势</text>
  <text x="360" y="284" text-anchor="middle" font-size="11" fill="#22303f">途径② 缩短 MTTR：快速发现（BFD/NQA 链路检测）+ 快速恢复（VRRP/802.3ad 等）</text>
  <text x="360" y="312" text-anchor="middle" font-size="11" fill="#4a6130">助记：串联相乘求「同时正常」；并联用 1-(1-R)ⁿ 求「至少一个正常」；双点双归先算单链再并联</text>
</svg>
