<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 上排：指令部件、MMU、Cache -->
  <g font-size="14" font-weight="bold" fill="#1f4e79">
    <rect x="40" y="40" width="150" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="115" y="76" text-anchor="middle">指令部件</text>
    <rect x="270" y="40" width="150" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="345" y="76" text-anchor="middle">MMU 部件</text>
    <rect x="500" y="40" width="150" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="575" y="76" text-anchor="middle">Cache 部件</text>
  </g>
  <!-- 中排：存取、寄存器、运算 -->
  <g font-size="14" font-weight="bold" fill="#1f4e79">
    <rect x="40" y="160" width="150" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="115" y="196" text-anchor="middle">存取部件</text>
    <rect x="270" y="160" width="150" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="345" y="196" text-anchor="middle">寄存器组</text>
    <rect x="500" y="160" width="150" height="60" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="575" y="188" text-anchor="middle" fill="#c05621">运算部件</text>
    <text x="575" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#22303f">整型 / 浮点 / 向量</text>
  </g>
  <!-- 完成部件 -->
  <rect x="270" y="270" width="150" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="345" y="300" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">完成部件</text>
  <!-- 总线 -->
  <rect x="40" y="344" width="610" height="36" rx="5" fill="#ffffff" stroke="#6b7a8a" stroke-width="1"/>
  <text x="345" y="367" font-size="12" fill="#6b7a8a" text-anchor="middle">地址总线 / 数据总线（各部件互连）</text>
  <!-- 连线：指令->MMU->Cache -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="193" y1="70" x2="259" y2="70"/>
    <polygon points="267,70 259,65.5 259,74.5" fill="#1f4e79"/>
    <line x1="423" y1="70" x2="489" y2="70"/>
    <polygon points="497,70 489,65.5 489,74.5" fill="#1f4e79"/>
    <!-- 指令->存取 -->
    <line x1="115" y1="103" x2="115" y2="149"/>
    <polygon points="115,157 110.5,149 119.5,149" fill="#1f4e79"/>
    <!-- 存取->寄存器->运算 -->
    <line x1="193" y1="190" x2="259" y2="190"/>
    <polygon points="267,190 259,185.5 259,194.5" fill="#1f4e79"/>
    <line x1="423" y1="190" x2="489" y2="190"/>
    <polygon points="497,190 489,185.5 489,194.5" fill="#1f4e79"/>
    <!-- 运算/存取/寄存器 -> 完成部件（顶缘三个独立连接点） -->
    <polyline points="575,223 575,246 400,246 400,262"/>
    <polygon points="400,267 395.5,259 404.5,259" fill="#1f4e79"/>
    <polyline points="190,223 190,246 320,246 320,262"/>
    <polygon points="320,267 315.5,259 324.5,259" fill="#1f4e79"/>
    <line x1="345" y1="223" x2="345" y2="262"/>
    <polygon points="345,267 340.5,259 349.5,259" fill="#1f4e79"/>
    <!-- 完成部件 -> 指令部件（结果反馈，绕行最左侧） -->
    <polyline points="267,295 15,295 15,70 32,70" stroke="#c05621"/>
    <polygon points="40,70 32,65.5 32,74.5" fill="#c05621"/>
  </g>
  <text x="360" y="394" font-size="11" fill="#c05621" text-anchor="middle">完成部件向指令部件反馈执行结果，控制顺序执行与跳转时序</text>
</svg>
