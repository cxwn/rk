<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">TOGAF 能力框架与六个组件</text>
  <rect x="25" y="168" width="150" height="92" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="100" y="199" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05621">业务愿景及驱动</text>
  <text x="100" y="224" text-anchor="middle" font-size="11" fill="#22303f">业务需求与能力成熟度</text>
  <text x="100" y="243" text-anchor="middle" font-size="11" fill="#22303f">驱动架构建设</text>
  <rect x="215" y="48" width="475" height="348" rx="9" fill="#fbfdff" stroke="#1f4e79" stroke-width="1.6"/>
  <text x="452" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">架构能力框架</text>
  <text x="452" y="94" text-anchor="middle" font-size="11" fill="#6b7a8a">组织 · 流程 · 技能 · 角色 · 职责（第 6 组件）</text>
  <rect x="240" y="115" width="195" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="337" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">1. 架构开发方法 ADM</text>
  <text x="337" y="164" text-anchor="middle" font-size="11" fill="#22303f">核心：分步开发企业架构</text>
  <rect x="465" y="115" width="195" height="66" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.4"/>
  <text x="562" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">2. ADM 指南和技术</text>
  <text x="562" y="164" text-anchor="middle" font-size="11" fill="#22303f">支持 ADM 的落地应用</text>
  <rect x="240" y="207" width="195" height="66" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.4"/>
  <text x="337" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">3. 架构内容框架</text>
  <text x="337" y="256" text-anchor="middle" font-size="11" fill="#22303f">元模型 · ABB · 交付成果</text>
  <rect x="465" y="207" width="195" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="562" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">4. 企业连续体和工具</text>
  <text x="562" y="256" text-anchor="middle" font-size="11" fill="#22303f">架构资产分类 · 存储 · 复用</text>
  <rect x="350" y="300" width="205" height="66" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="452" y="327" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">5. TOGAF 参考模型</text>
  <text x="452" y="349" text-anchor="middle" font-size="11" fill="#22303f">TRM + III-RM</text>
  <line x1="175" y1="205" x2="205" y2="205" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <line x1="205" y1="205" x2="205" y2="148" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <line x1="205" y1="148" x2="229" y2="148" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="237,148 229,143.5 229,152.5" fill="#c05621"/>
  <text x="192" y="183" text-anchor="middle" font-size="10" fill="#c05621">需求</text>
  <text x="360" y="423" text-anchor="middle" font-size="11" fill="#6b7a8a">ADM 产出进入资源库并持续回填；企业连续体支持从通用资产演进到组织特定架构</text>
</svg>
