<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303f">专家系统的三种推理方式</text>
  <rect x="20" y="52" width="680" height="110" rx="9" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="35" y="83" font-size="15" font-weight="bold" fill="#1f4e79">正向推理</text>
  <text x="35" y="107" font-size="12" fill="#6b7a8a">数据驱动</text>
  <text x="35" y="132" font-size="12" fill="#6b7a8a">目标解空间大</text>
  <g text-anchor="middle" font-size="14">
    <rect x="180" y="82" width="120" height="55" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="240" y="116">条件／事实</text>
    <rect x="340" y="82" width="120" height="55" rx="7" fill="#fdf0e6" stroke="#c05621"/><text x="400" y="116">推理机</text>
    <rect x="500" y="82" width="120" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/><text x="560" y="116">结论</text>
  </g>
  <line x1="300" y1="109" x2="329" y2="109" stroke="#1f4e79" stroke-width="1.5"/><line x1="460" y1="109" x2="489" y2="109" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="337,109 329,104.5 329,113.5" fill="#1f4e79"/><polygon points="497,109 489,104.5 489,113.5" fill="#1f4e79"/>
  <rect x="20" y="180" width="680" height="110" rx="9" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="35" y="211" font-size="15" font-weight="bold" fill="#c05621">反向推理</text>
  <text x="35" y="235" font-size="12" fill="#6b7a8a">目标驱动</text>
  <text x="35" y="260" font-size="12" fill="#6b7a8a">解空间较小</text>
  <g text-anchor="middle" font-size="14">
    <rect x="180" y="210" width="120" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/><text x="240" y="244">条件／证据</text>
    <rect x="340" y="210" width="120" height="55" rx="7" fill="#fdf0e6" stroke="#c05621"/><text x="400" y="244">推理机</text>
    <rect x="500" y="210" width="120" height="55" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="560" y="244">假设结论</text>
  </g>
  <line x1="500" y1="237" x2="471" y2="237" stroke="#c05621" stroke-width="1.5"/><line x1="340" y1="237" x2="311" y2="237" stroke="#c05621" stroke-width="1.5"/>
  <polygon points="463,237 471,232.5 471,241.5" fill="#c05621"/><polygon points="303,237 311,232.5 311,241.5" fill="#c05621"/>
  <rect x="20" y="308" width="680" height="110" rx="9" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="35" y="339" font-size="15" font-weight="bold" fill="#4a6130">双向推理</text>
  <text x="35" y="363" font-size="12" fill="#6b7a8a">正反向同时</text>
  <text x="35" y="388" font-size="12" fill="#6b7a8a">中间达到一致</text>
  <g text-anchor="middle" font-size="14">
    <rect x="180" y="338" width="120" height="55" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="240" y="372">条件／事实</text>
    <rect x="340" y="338" width="120" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/><text x="400" y="372">一致状态</text>
    <rect x="500" y="338" width="120" height="55" rx="7" fill="#fdf0e6" stroke="#c05621"/><text x="560" y="372">目标假设</text>
  </g>
  <line x1="300" y1="365" x2="329" y2="365" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="337,365 329,360.5 329,369.5" fill="#1f4e79"/>
  <line x1="500" y1="365" x2="471" y2="365" stroke="#c05621" stroke-width="1.5"/>
  <polygon points="463,365 471,360.5 471,369.5" fill="#c05621"/>
