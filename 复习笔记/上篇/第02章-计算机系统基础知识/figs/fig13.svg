<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="125" y="22" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">OSI/RM 七层</text>
  <text x="360" y="22" font-size="14" font-weight="bold" fill="#c05621" text-anchor="middle">主要协议</text>
  <text x="595" y="22" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">TCP/IP 四层</text>
  <!-- OSI 层块 -->
  <g font-size="13" fill="#1f4e79" font-weight="bold">
    <rect x="40" y="36" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="65" text-anchor="middle">应用层</text>
    <rect x="40" y="94" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="123" text-anchor="middle">表示层</text>
    <rect x="40" y="152" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="181" text-anchor="middle">会话层</text>
    <rect x="40" y="210" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="239" text-anchor="middle">传输层</text>
    <rect x="40" y="268" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="297" text-anchor="middle">网络层</text>
    <rect x="40" y="326" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="355" text-anchor="middle">数据链路层</text>
    <rect x="40" y="384" width="170" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="125" y="413" text-anchor="middle">物理层</text>
  </g>
  <!-- 中间协议块 -->
  <g font-size="11" fill="#22303f">
    <rect x="280" y="36" width="160" height="164" rx="5" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="76" text-anchor="middle">FTP / Telnet / SMTP</text>
    <text x="360" y="104" text-anchor="middle">NFS / SNMP / HTTP</text>
    <text x="360" y="132" text-anchor="middle">（应用层协议）</text>
    <rect x="280" y="210" width="160" height="48" rx="5" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="239" text-anchor="middle">TCP、UDP</text>
    <rect x="280" y="268" width="160" height="48" rx="5" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="297" text-anchor="middle">IP、ICMP、ARP、RARP</text>
    <rect x="280" y="326" width="160" height="106" rx="5" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="366" text-anchor="middle">Ethernet / 802.3</text>
    <text x="360" y="390" text-anchor="middle">FDDI、PPP / SLIP</text>
  </g>
  <!-- TCP/IP 层块 -->
  <g font-size="13" fill="#4a6130" font-weight="bold">
    <rect x="510" y="36" width="170" height="164" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="595" y="123" text-anchor="middle">应用层</text>
    <rect x="510" y="210" width="170" height="48" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="595" y="239" text-anchor="middle">传输层</text>
    <rect x="510" y="268" width="170" height="48" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="595" y="297" text-anchor="middle">网际层</text>
    <rect x="510" y="326" width="170" height="106" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="595" y="384" text-anchor="middle">网络接口层</text>
  </g>
  <!-- OSI -> 协议（左半，各层独立横线） -->
  <g stroke="#6b7a8a" stroke-width="1.3" fill="none">
    <line x1="213" y1="60" x2="269" y2="60"/>
    <line x1="213" y1="118" x2="269" y2="118"/>
    <line x1="213" y1="176" x2="269" y2="176"/>
    <line x1="213" y1="234" x2="269" y2="234"/>
    <line x1="213" y1="292" x2="269" y2="292"/>
    <line x1="213" y1="350" x2="269" y2="350"/>
    <line x1="213" y1="408" x2="269" y2="408"/>
  </g>
  <!-- 协议 -> TCP/IP（右半，每组一条横线带箭头） -->
  <g stroke="#1f4e79" stroke-width="1.4" fill="none">
    <line x1="443" y1="118" x2="499" y2="118"/>
    <polygon points="507,118 499,113.5 499,122.5" fill="#1f4e79"/>
    <line x1="443" y1="234" x2="499" y2="234"/>
    <polygon points="507,234 499,229.5 499,238.5" fill="#1f4e79"/>
    <line x1="443" y1="292" x2="499" y2="292"/>
    <polygon points="507,292 499,287.5 499,296.5" fill="#1f4e79"/>
    <line x1="443" y1="379" x2="499" y2="379"/>
    <polygon points="507,379 499,374.5 499,383.5" fill="#1f4e79"/>
  </g>
  <text x="360" y="466" font-size="12" fill="#1f4e79" text-anchor="middle">助记（OSI 下→上）：物、数、网、传、会、表、应；TCP/IP：网络接口 / 网际 / 传输 / 应用</text>
  <text x="360" y="488" font-size="11" fill="#6b7a8a" text-anchor="middle">OSI 上三层对应 TCP/IP 应用层，下两层对应网络接口层</text>
</svg>
