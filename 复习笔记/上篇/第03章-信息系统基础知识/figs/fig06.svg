<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="840" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303f">MIS 金字塔、功能结构与功能—过程</text>
  <text x="195" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">管理层次：越往下处理量越大</text>
  <polygon points="195,78 250,140 140,140" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="195" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">战略计划</text>
  <polygon points="140,150 250,150 290,220 100,220" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="195" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">管理控制</text>
  <polygon points="100,230 290,230 325,300 65,300" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="195" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">运行控制</text>
