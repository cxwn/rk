<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">5G 网络边缘计算（MEC）架构（教材图 17-14 简化重绘）</text>
  <!-- 左 移动边缘云 -->
  <rect x="40" y="50" width="290" height="170" rx="10" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="185" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">移动边缘云</text>
  <rect x="60" y="85" width="120" height="34" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="120" y="106" text-anchor="middle" font-size="11" fill="#4a6130">MEP 边缘平台</text>
  <rect x="200" y="85" width="110" height="34" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="255" y="106" text-anchor="middle" font-size="11" fill="#4a6130">边缘应用</text>
  <rect x="120" y="160" width="120" height="36" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="180" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">UPF（边缘下沉）</text>
  <!-- 中间控制面 -->
  <rect x="345" y="60" width="90" height="30" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="390" y="79" text-anchor="middle" font-size="11" fill="#1f4e79">AF / NEF</text>
  <line x1="390" y1="90" x2="390" y2="99" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="390,107 385.5,99 394.5,99" fill="#1f4e79"/>
  <rect x="345" y="110" width="90" height="30" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="390" y="129" text-anchor="middle" font-size="11" fill="#1f4e79">PCF 策略</text>
  <line x1="390" y1="140" x2="390" y2="149" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="390,157 385.5,149 394.5,149" fill="#1f4e79"/>
  <rect x="345" y="160" width="90" height="36" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="390" y="182" text-anchor="middle" font-size="11" fill="#1f4e79">SMF 会话</text>
  <line x1="345" y1="178" x2="251" y2="178" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="243,178 251,173.5 251,182.5" fill="#1f4e79"/>
  <!-- 右 移动中心云 -->
  <rect x="450" y="50" width="240" height="170" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="570" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">移动中心云</text>
  <rect x="490" y="85" width="140" height="36" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="560" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">UPF（中心）</text>
  <line x1="560" y1="121" x2="560" y2="149" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="560,157 555.5,149 564.5,149" fill="#c05621"/>
  <rect x="490" y="160" width="140" height="36" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="560" y="183" text-anchor="middle" font-size="11" fill="#22303f">中心 DN / 应用</text>
  <!-- 底部接入 -->
  <rect x="40" y="280" width="70" height="36" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="75" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">UE</text>
  <line x1="110" y1="298" x2="149" y2="298" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="157,298 149,293.5 149,302.5" fill="#1f4e79"/>
  <rect x="160" y="280" width="100" height="36" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="210" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">5G-AN</text>
  <!-- 绿线 本地分流 -->
  <line x1="210" y1="280" x2="210" y2="250" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <line x1="210" y1="250" x2="180" y2="250" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <line x1="180" y1="250" x2="180" y2="207" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="180,199 175.5,207 184.5,207" fill="#4a6130"/>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#4a6130">本地分流</text>
  <!-- 灰线 到中心 -->
  <line x1="240" y1="280" x2="240" y2="250" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="240" y1="250" x2="560" y2="250" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <line x1="560" y1="250" x2="560" y2="231" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="560,223 555.5,231 564.5,231" fill="#6b7a8a"/>
  <text x="400" y="242" text-anchor="middle" font-size="10" fill="#6b7a8a">业务流（到中心应用）</text>
  <text x="360" y="342" text-anchor="middle" font-size="11" fill="#22303f">UPF 下沉边缘 + MEP 平台：就近分流、降时延、减后端压力；SSC 模式 1/2/3 保障移动中业务连续性</text>
</svg>
