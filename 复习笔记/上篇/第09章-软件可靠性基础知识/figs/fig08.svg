<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 415" width="720" height="415" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="415" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">软件可靠性管理：贯穿软件开发全过程</text>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="115" y1="96" x2="115" y2="103"/>
    <line x1="115" y1="148" x2="115" y2="155"/>
    <line x1="115" y1="200" x2="115" y2="207"/>
    <line x1="115" y1="252" x2="115" y2="259"/>
    <line x1="115" y1="304" x2="115" y2="311"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="115,109 110.5,103 119.5,103"/>
    <polygon points="115,161 110.5,155 119.5,155"/>
    <polygon points="115,213 110.5,207 119.5,207"/>
    <polygon points="115,265 110.5,259 119.5,259"/>
    <polygon points="115,317 110.5,311 119.5,311"/>
  </g>
  <g>
    <rect x="60" y="60" width="110" height="36" rx="6" fill="#1f4e79"/>
    <text x="115" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">需求分析</text>
    <text x="200" y="84" font-size="12.5" fill="#22303f">确定可靠性目标与验收标准，制定管理框架、文档与数据收集规范</text>
    <rect x="60" y="112" width="110" height="36" rx="6" fill="#1f4e79"/>
    <text x="115" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">概要设计</text>
    <text x="200" y="136" font-size="12.5" fill="#22303f">确定可靠性度量，制定详细验收方案，开展可靠性设计</text>
    <rect x="60" y="164" width="110" height="36" rx="6" fill="#1f4e79"/>
    <text x="115" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">详细设计</text>
    <text x="200" y="188" font-size="12.5" fill="#22303f">可靠性设计与可靠性预测（确定可靠性度量估计值）</text>
    <rect x="60" y="216" width="110" height="36" rx="6" fill="#1f4e79"/>
    <text x="115" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">编码</text>
    <text x="200" y="240" font-size="12.5" fill="#22303f">可靠性测试（含于单元测试）与排错</text>
    <rect x="60" y="268" width="110" height="36" rx="6" fill="#1f4e79"/>
    <text x="115" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">测试</text>
    <text x="200" y="292" font-size="12.5" fill="#22303f">可靠性测试（含于集成、系统测试），可靠性建模与评价</text>
    <rect x="60" y="320" width="110" height="36" rx="6" fill="#1f4e79"/>
    <text x="115" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">实施</text>
    <text x="200" y="344" font-size="12.5" fill="#22303f">可靠性测试（含于验收测试），调整模型并做可靠性评价</text>
  </g>
  <rect x="40" y="368" width="640" height="34" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="360" y="390" text-anchor="middle" font-size="12" fill="#4a6130">各阶段共同活动：调整活动计划、收集可靠性数据、明确后续详细计划、编制可靠性文档</text>
