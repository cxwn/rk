<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">SOA 多服务通信与企业数据交换总线</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">SOA：独立完整应用之间通过消息 / RPC 协作</text>
  <rect x="40" y="70" width="250" height="100" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="165" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">多层 C/S 应用 1</text>
  <text x="165" y="130" text-anchor="middle" font-size="12" fill="#22303f">对外是一个独立完整服务</text>
  <text x="165" y="151" text-anchor="middle" font-size="11" fill="#6b7a8a">内部各层共同支撑本应用</text>
  <rect x="430" y="70" width="250" height="100" rx="8" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="555" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a6130">多层 C/S 应用 2</text>
  <text x="555" y="130" text-anchor="middle" font-size="12" fill="#22303f">对外是一个独立完整服务</text>
  <text x="555" y="151" text-anchor="middle" font-size="11" fill="#6b7a8a">可开放功能、模块或数据</text>
  <line x1="290" y1="103" x2="419" y2="103" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="427,103 419,98.5 419,107.5" fill="#1f4e79"/>
  <text x="360" y="93" text-anchor="middle" font-size="10" fill="#6b7a8a">请求 / 消息</text>
  <line x1="430" y1="140" x2="301" y2="140" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="293,140 301,135.5 301,144.5" fill="#4a6130"/>
  <text x="360" y="158" text-anchor="middle" font-size="10" fill="#6b7a8a">回复 / 消息</text>
  <rect x="30" y="202" width="660" height="194" rx="8" fill="#fbfdff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">企业数据交换总线：公共连接与分发通道</text>
  <rect x="55" y="248" width="100" height="38" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <rect x="185" y="248" width="100" height="38" rx="4" fill="#f3f6ee" stroke="#4a6130"/>
  <rect x="315" y="248" width="100" height="38" rx="4" fill="#fdf0e6" stroke="#c05621"/>
  <rect x="445" y="248" width="100" height="38" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <rect x="575" y="248" width="90" height="38" rx="4" fill="#f3f6ee" stroke="#4a6130"/>
  <text x="105" y="272" text-anchor="middle" font-size="12" fill="#22303f">应用 1</text>
  <text x="235" y="272" text-anchor="middle" font-size="12" fill="#22303f">应用 2</text>
  <text x="365" y="272" text-anchor="middle" font-size="12" fill="#22303f">应用 3</text>
  <text x="495" y="272" text-anchor="middle" font-size="12" fill="#22303f">应用 m</text>
  <text x="620" y="272" text-anchor="middle" font-size="12" fill="#22303f">应用 n</text>
  <line x1="105" y1="286" x2="105" y2="309" stroke="#1f4e79" stroke-width="1.3" fill="none"/>
  <polygon points="105,317 100.5,309 109.5,309" fill="#1f4e79"/>
  <line x1="235" y1="286" x2="235" y2="309" stroke="#4a6130" stroke-width="1.3" fill="none"/>
  <polygon points="235,317 230.5,309 239.5,309" fill="#4a6130"/>
  <line x1="365" y1="286" x2="365" y2="309" stroke="#c05621" stroke-width="1.3" fill="none"/>
  <polygon points="365,317 360.5,309 369.5,309" fill="#c05621"/>
  <line x1="495" y1="286" x2="495" y2="309" stroke="#1f4e79" stroke-width="1.3" fill="none"/>
  <polygon points="495,317 490.5,309 499.5,309" fill="#1f4e79"/>
  <line x1="620" y1="286" x2="620" y2="309" stroke="#4a6130" stroke-width="1.3" fill="none"/>
  <polygon points="620,317 615.5,309 624.5,309" fill="#4a6130"/>
  <rect x="85" y="320" width="550" height="42" rx="5" fill="#1f4e79" stroke="#1f4e79"/>
  <text x="360" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">连接器：按配置或消息头接收、分发数据 / 请求 / 回复</text>
  <text x="360" y="384" text-anchor="middle" font-size="11" fill="#6b7a8a">可基于消息/交易中间件或 CORBA/IIOP；代理可并行或串行工作</text>
  <text x="360" y="423" text-anchor="middle" font-size="11" fill="#c05621">实践提醒：成熟总线多面向实时交易，可靠的大数据量传输通常需要单独设计</text>
</svg>
