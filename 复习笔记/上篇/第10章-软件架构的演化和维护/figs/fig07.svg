<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">软件的三级动态性</text>
  <rect x="35" y="75" width="185" height="180" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <rect x="55" y="92" width="70" height="28" rx="14" fill="#1f4e79"/>
  <text x="90" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">级别 1</text>
  <text x="127" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">交互动态性</text>
  <text x="127" y="183" text-anchor="middle" font-size="14" fill="#22303f">结构固定</text>
  <text x="127" y="208" text-anchor="middle" font-size="14" fill="#22303f">数据动态交互</text>
  <text x="127" y="236" text-anchor="middle" font-size="13" fill="#6b7a8a">交换新数据</text>
  <line x1="220" y1="165" x2="254" y2="165" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="262,165 254,160.5 254,169.5" fill="#1f4e79"/>
  <rect x="265" y="75" width="190" height="180" rx="8" fill="#fdf0e6" stroke="#c05621"/>
  <rect x="285" y="92" width="70" height="28" rx="14" fill="#c05621"/>
  <text x="320" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">级别 2</text>
  <text x="360" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#c05621">结构动态性</text>
  <text x="360" y="183" text-anchor="middle" font-size="14" fill="#22303f">增删组件实例</text>
  <text x="360" y="208" text-anchor="middle" font-size="14" fill="#22303f">增删连接件实例</text>
  <text x="360" y="236" text-anchor="middle" font-size="13" fill="#c05621">研究与应用主流</text>
  <line x1="455" y1="165" x2="489" y2="165" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="497,165 489,160.5 489,169.5" fill="#c05621"/>
  <rect x="500" y="75" width="185" height="180" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="2"/>
  <rect x="520" y="92" width="70" height="28" rx="14" fill="#8aa15c"/>
  <text x="555" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">级别 3</text>
  <text x="592" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6130">架构动态性</text>
  <text x="592" y="183" text-anchor="middle" font-size="14" fill="#22303f">基本构造重定义</text>
  <text x="592" y="208" text-anchor="middle" font-size="14" fill="#22303f">如新增组件类型</text>
  <text x="592" y="236" text-anchor="middle" font-size="13" fill="#4a6130">当前支持较少</text>
  <rect x="55" y="282" width="610" height="52" rx="7" fill="#f5f7f9" stroke="#b8c7d6"/>
  <text x="360" y="304" text-anchor="middle" font-size="14" fill="#22303f">动态能力逐级增强：数据交互 → 实例结构 → 架构构造</text>
  <text x="360" y="325" text-anchor="middle" font-size="13" fill="#6b7a8a">Cuesta 认为只有级别 3 的架构才是真正的动态架构</text>
</svg>
