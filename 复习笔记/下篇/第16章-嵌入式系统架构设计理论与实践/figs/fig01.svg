    <rect x="20" y="360" width="90" height="40" rx="5" fill="#f3f6ee" stroke="#8aa15c"/><text x="65" y="385">GPIO</text>
    <rect x="130" y="360" width="90" height="40" rx="5" fill="#f3f6ee" stroke="#8aa15c"/><text x="175" y="385">USB</text>
    <rect x="240" y="360" width="90" height="40" rx="5" fill="#f3f6ee" stroke="#8aa15c"/><text x="285" y="385">UART</text>
