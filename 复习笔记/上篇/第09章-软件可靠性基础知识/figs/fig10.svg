<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">检错设计：四个重点考虑要素</text>
  <g>
    <rect x="30" y="60" width="150" height="180" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="105" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">① 检测对象</text>
    <g font-size="11.5" fill="#22303f" text-anchor="middle">
      <text x="105" y="115">检测点：放在容易</text>
      <text x="105" y="134">出错、出错影响大</text>
      <text x="105" y="153">的地方</text>
      <text x="105" y="172">检测内容：选有代</text>
      <text x="105" y="191">表性、易判断的指</text>
      <text x="105" y="210">标</text>
    </g>
    <rect x="200" y="60" width="150" height="180" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="275" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">② 检测延时</text>
    <g font-size="11.5" fill="#22303f" text-anchor="middle">
      <text x="275" y="115">故障发生到被自</text>
      <text x="275" y="134">检出来的延时</text>
      <text x="275" y="153">延时长到影响及</text>
      <text x="275" y="172">时报警时，需更换</text>
      <text x="275" y="191">检测对象或方式</text>
    </g>
    <rect x="370" y="60" width="150" height="180" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="445" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">③ 实现方式</text>
    <g font-size="11.5" fill="#22303f" text-anchor="middle">
      <text x="445" y="115">判断返回结果是</text>
      <text x="445" y="134">否超出正常范围</text>
      <text x="445" y="153">计算模块运行时间</text>
      <text x="445" y="172">是否超过预期</text>
      <text x="445" y="191">置状态标志位</text>
    </g>
    <rect x="540" y="60" width="150" height="180" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="615" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">④ 处理方式</text>
    <g font-size="11.5" fill="#22303f" text-anchor="middle">
      <text x="615" y="115">多数采用：查出</text>
      <text x="615" y="134">故障→停止运行</text>
      <text x="615" y="153">→报警</text>
      <text x="615" y="172">也可不停或部分</text>
      <text x="615" y="191">停止，视故障是否</text>
      <text x="615" y="210">需实时处理而定</text>
    </g>
  </g>
  <rect x="60" y="280" width="160" height="44" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="140" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">查出故障</text>
  <rect x="280" y="280" width="160" height="44" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">停止或降级运行</text>
  <rect x="500" y="280" width="160" height="44" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="580" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">报警并人工干预</text>
  <line x1="220" y1="302" x2="269" y2="302" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="277,302 269,297.5 269,306.5" fill="#1f4e79"/>
  <line x1="440" y1="302" x2="489" y2="302" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="497,302 489,297.5 489,306.5" fill="#1f4e79"/>
  <text x="360" y="365" text-anchor="middle" font-size="12.5" fill="#22303f">检错代价低于容错与冗余，但不能自动解决故障，适用于无须在线容错或不能冗余的部分</text>
</svg>
