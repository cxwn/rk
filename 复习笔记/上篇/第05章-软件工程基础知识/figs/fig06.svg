<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="285" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">需求变更管理过程</text>
  <g text-anchor="middle">
    <rect x="18" y="85" width="126" height="74" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="81" y="116" font-size="16" fill="#22303f">识别出问题</text><text x="81" y="140" font-size="13" fill="#6b7a8a">提出变更提议</text>
    <rect x="160" y="85" width="126" height="74" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
    <text x="223" y="112" font-size="16" fill="#c05621">问题分析</text><text x="223" y="137" font-size="16" fill="#c05621">变更描述</text>
    <rect x="302" y="85" width="126" height="74" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
    <text x="365" y="112" font-size="16" fill="#c05621">变更分析</text><text x="365" y="137" font-size="16" fill="#c05621">成本计算</text>
    <rect x="444" y="85" width="126" height="74" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="507" y="116" font-size="16" fill="#22303f">变更实现</text><text x="507" y="140" font-size="13" fill="#6b7a8a">按影响范围执行</text>
    <rect x="586" y="85" width="126" height="74" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
    <text x="649" y="116" font-size="16" fill="#4a6130">修改后的需求</text><text x="649" y="140" font-size="13" fill="#6b7a8a">更新基线及制品</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="144" y1="122" x2="149" y2="122"/><line x1="286" y1="122" x2="291" y2="122"/>
    <line x1="428" y1="122" x2="433" y2="122"/><line x1="570" y1="122" x2="575" y2="122"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="157,122 149,117.5 149,126.5"/>
    <polygon points="299,122 291,117.5 291,126.5"/>
    <polygon points="441,122 433,117.5 433,126.5"/>
    <polygon points="583,122 575,117.5 575,126.5"/>
  </g>
  <text x="223" y="190" text-anchor="middle" font-size="13" fill="#c05621">检查有效性，明确提议</text>
  <text x="365" y="211" text-anchor="middle" font-size="13" fill="#c05621">评估全部影响并决策</text>
  <rect x="90" y="230" width="540" height="34" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="360" y="252" text-anchor="middle" font-size="14" fill="#4a6130">变更控制是渠道和过滤器，不是为变更设置障碍</text>
