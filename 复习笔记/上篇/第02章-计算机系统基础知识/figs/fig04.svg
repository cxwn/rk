<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 六阶段流程 -->
  <g>
    <rect x="15" y="60" width="100" height="86" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="65" y="92" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">需求分析</text>
    <text x="65" y="118" font-size="10" fill="#22303f" text-anchor="middle">数据需求</text>
    <text x="65" y="134" font-size="10" fill="#22303f" text-anchor="middle">业务处理需求</text>
    <rect x="130" y="60" width="100" height="86" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="180" y="88" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">概念结构</text>
    <text x="180" y="106" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">设计</text>
    <text x="180" y="130" font-size="10" fill="#22303f" text-anchor="middle">E-R 方法建模</text>
    <rect x="245" y="60" width="100" height="86" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="295" y="88" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">逻辑结构</text>
    <text x="295" y="106" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">设计</text>
    <text x="295" y="130" font-size="10" fill="#22303f" text-anchor="middle">E-R→数据模型</text>
    <rect x="360" y="60" width="100" height="86" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="410" y="88" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">物理结构</text>
    <text x="410" y="106" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="middle">设计</text>
    <text x="410" y="130" font-size="10" fill="#22303f" text-anchor="middle">存储与存取</text>
    <rect x="475" y="60" width="100" height="86" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="525" y="88" font-size="13" font-weight="bold" fill="#c05621" text-anchor="middle">应用程序</text>
    <text x="525" y="106" font-size="13" font-weight="bold" fill="#c05621" text-anchor="middle">设计</text>
    <text x="525" y="130" font-size="10" fill="#22303f" text-anchor="middle">DBMS 二次开发</text>
    <rect x="590" y="60" width="100" height="86" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
    <text x="640" y="92" font-size="13" font-weight="bold" fill="#4a6130" text-anchor="middle">运行维护</text>
    <text x="640" y="118" font-size="10" fill="#22303f" text-anchor="middle">优化、重组</text>
    <text x="640" y="134" font-size="10" fill="#22303f" text-anchor="middle">与重构</text>
  </g>
  <!-- 相邻箭头 -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="118" y1="103" x2="122" y2="103"/>
    <polygon points="127,103 119,98.5 119,107.5" fill="#1f4e79"/>
    <line x1="233" y1="103" x2="237" y2="103"/>
    <polygon points="242,103 234,98.5 234,107.5" fill="#1f4e79"/>
    <line x1="348" y1="103" x2="352" y2="103"/>
    <polygon points="357,103 349,98.5 349,107.5" fill="#1f4e79"/>
    <line x1="463" y1="103" x2="467" y2="103"/>
    <polygon points="472,103 464,98.5 464,107.5" fill="#1f4e79"/>
    <line x1="578" y1="103" x2="582" y2="103"/>
    <polygon points="587,103 579,98.5 579,107.5" fill="#1f4e79"/>
  </g>
  <text x="360" y="186" font-size="12" fill="#22303f" text-anchor="middle">概念模型与具体 DBMS 无关；逻辑结构确定数据模型与完整性约束；物理结构面向存储效率</text>
  <text x="360" y="212" font-size="11" fill="#6b7a8a" text-anchor="middle">设计方法：直观设计法 / 规范设计法（3NF、E-R）/ 计算机辅助设计法 / 自动化设计法</text>
  <text x="360" y="240" font-size="11" fill="#6b7a8a" text-anchor="middle">（据教材图 2-5 重绘）</text>
</svg>
