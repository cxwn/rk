<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
  </defs>
  <!-- 六级阶梯卡片：从左下到右上 -->
  <g>
    <rect x="10" y="270" width="110" height="110" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="65" y="296" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">工程师</text>
    <text x="65" y="318" font-size="11" fill="#22303f" text-anchor="middle">1～3 年</text>
    <text x="65" y="342" font-size="11" fill="#22303f" text-anchor="middle">在指导下</text>
    <text x="65" y="360" font-size="11" fill="#22303f" text-anchor="middle">完成开发</text>
    <rect x="130" y="228" width="110" height="110" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="185" y="254" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">高级工程师</text>
    <text x="185" y="276" font-size="11" fill="#22303f" text-anchor="middle">3～5 年</text>
    <text x="185" y="300" font-size="11" fill="#22303f" text-anchor="middle">独立完成开发</text>
    <text x="185" y="318" font-size="11" fill="#6b7a8a" text-anchor="middle">How → Why</text>
    <rect x="250" y="186" width="110" height="110" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="305" y="212" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">技术专家</text>
    <text x="305" y="234" font-size="11" fill="#22303f" text-anchor="middle">4～8 年</text>
    <text x="305" y="258" font-size="11" fill="#22303f" text-anchor="middle">某个领域专家</text>
    <text x="305" y="276" font-size="11" fill="#6b7a8a" text-anchor="middle">拓展技术宽度</text>
    <rect x="370" y="144" width="110" height="110" rx="5" fill="#fdf0e6" stroke="#c05621"/>
    <text x="425" y="170" font-size="14" font-weight="bold" fill="#c05621" text-anchor="middle">初级架构师</text>
    <text x="425" y="192" font-size="11" fill="#22303f" text-anchor="middle">5～8 年</text>
