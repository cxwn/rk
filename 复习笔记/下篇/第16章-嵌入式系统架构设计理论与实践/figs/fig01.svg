  <polygon points="247,69 239,64.5 239,73.5" fill="#1f4e79"/>
  <polyline points="185,126 220,126 220,94 239,94" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="247,94 239,89.5 239,98.5" fill="#1f4e79"/>
  <rect x="535" y="55" width="150" height="44" rx="6" fill="#fdf0e6" stroke="#c05621"/>
