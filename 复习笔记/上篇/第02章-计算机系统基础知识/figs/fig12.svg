<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 中心 5G 网络 -->
  <ellipse cx="360" cy="150" rx="118" ry="56" fill="#1f4e79"/>
  <text x="360" y="144" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5G 网络</text>
  <text x="360" y="168" font-size="11" fill="#ffffff" text-anchor="middle">同一物理网络</text>
  <!-- eMBB -->
  <rect x="40" y="40" width="190" height="76" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="135" y="66" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">eMBB 移动宽带</text>
  <text x="135" y="90" font-size="10" fill="#22303f" text-anchor="middle">4K/8K、全息、AR/VR</text>
  <text x="135" y="106" font-size="10" fill="#6b7a8a" text-anchor="middle">高带宽、高速率</text>
  <!-- mMTC -->
  <rect x="40" y="200" width="190" height="76" rx="7" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="135" y="226" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">mMTC 海量物联网</text>
  <text x="135" y="250" font-size="10" fill="#22303f" text-anchor="middle">传感器密集、多静止</text>
  <text x="135" y="266" font-size="10" fill="#6b7a8a" text-anchor="middle">时延/移动性要求不高</text>
  <!-- uRLLC -->
  <rect x="490" y="120" width="200" height="76" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="590" y="146" font-size="14" font-weight="bold" fill="#c05621" text-anchor="middle">uRLLC 关键任务物联网</text>
  <text x="590" y="170" font-size="10" fill="#22303f" text-anchor="middle">无人驾驶、远程医疗</text>
  <text x="590" y="186" font-size="10" fill="#6b7a8a" text-anchor="middle">超低时延、超高可靠</text>
  <!-- 中心 -> 三切片（箭头止于切片边缘外侧） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="252" y1="122" x2="239" y2="86"/>
    <polygon points="233,78 234.5,87 242.5,84" fill="#1f4e79"/>
    <line x1="252" y1="178" x2="239" y2="214"/>
    <polygon points="233,222 234.5,213 242.5,216" fill="#1f4e79"/>
    <line x1="481" y1="155" x2="482" y2="155"/>
    <polygon points="487,155 479,150.5 479,159.5" fill="#1f4e79"/>
  </g>
  <text x="360" y="306" font-size="12" fill="#6b7a8a" text-anchor="middle">网络切片：单个物理网络切分出多个逻辑网络，按场景定制，避免重复建网、降低成本</text>
</svg>
