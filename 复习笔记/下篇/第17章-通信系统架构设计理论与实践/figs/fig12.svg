<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">基于 5G 网络的智能电网架构（教材图 17-24 重绘）</text>
  <!-- 应用层 -->
  <rect x="70" y="50" width="180" height="34" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="160" y="71" text-anchor="middle" font-size="12" fill="#1f4e79">输电业务</text>
  <rect x="270" y="50" width="180" height="34" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="360" y="71" text-anchor="middle" font-size="12" fill="#1f4e79">配电业务</text>
  <rect x="470" y="50" width="180" height="34" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="560" y="71" text-anchor="middle" font-size="12" fill="#1f4e79">综合能源管理</text>
  <!-- IoT 平台 -->
  <rect x="40" y="112" width="640" height="74" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="360" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6130">物联网（IoT）平台</text>
  <rect x="60" y="140" width="140" height="32" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#4a6130">数据采集</text>
  <rect x="220" y="140" width="140" height="32" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#4a6130">AI 训练/推理</text>
  <rect x="380" y="140" width="140" height="32" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#4a6130">电网监控</text>
  <rect x="540" y="140" width="120" height="32" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#4a6130">边缘计算</text>
  <!-- 5G 网络 -->
  <rect x="40" y="225" width="640" height="36" rx="6" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5G 网络（高带宽 · 大连接 · 低时延 · 高可靠）</text>
  <!-- 底层三域 -->
  <rect x="40" y="300" width="200" height="60" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="140" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">电源侧</text>
  <text x="140" y="342" text-anchor="middle" font-size="10" fill="#22303f">智能感知：新能源/传统电源</text>
  <rect x="260" y="300" width="200" height="60" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="360" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">电网侧</text>
  <text x="360" y="342" text-anchor="middle" font-size="10" fill="#22303f">输变电 / 配用电设备</text>
  <rect x="480" y="300" width="200" height="60" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="580" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">用户侧</text>
  <text x="580" y="342" text-anchor="middle" font-size="10" fill="#22303f">电表/电动汽车/储能</text>
  <!-- 连接线 -->
  <line x1="140" y1="300" x2="140" y2="272" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="140,264 135.5,272 144.5,272" fill="#c05621"/>
  <line x1="360" y1="300" x2="360" y2="272" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="360,264 355.5,272 364.5,272" fill="#c05621"/>
  <line x1="580" y1="300" x2="580" y2="272" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="580,264 575.5,272 584.5,272" fill="#c05621"/>
  <line x1="360" y1="225" x2="360" y2="197" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,189 355.5,197 364.5,197" fill="#1f4e79"/>
  <line x1="160" y1="112" x2="160" y2="95" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="160,87 155.5,95 164.5,95" fill="#8aa15c"/>
  <line x1="360" y1="112" x2="360" y2="95" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="360,87 355.5,95 364.5,95" fill="#8aa15c"/>
  <line x1="560" y1="112" x2="560" y2="95" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="560,87 555.5,95 564.5,95" fill="#8aa15c"/>
  <text x="360" y="390" text-anchor="middle" font-size="11" fill="#22303f">跳闸事件传输时延要求 &lt;8ms：采用 MEC 边缘计算 + uRLLC 切片满足；IoT 平台支撑采集与智能分析</text>
</svg>
