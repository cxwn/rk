  <line x1="360" y1="122" x2="360" y2="134" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,142 355.5,134 364.5,134" fill="#1f4e79"/>
  <rect x="300" y="145" width="120" height="34" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
