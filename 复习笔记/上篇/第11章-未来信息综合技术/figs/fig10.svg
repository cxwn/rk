  <text x="570" y="145" text-anchor="middle" font-size="11" fill="#22303f">感知 · 诊断 · 预测</text>
  <text x="570" y="172" text-anchor="middle" font-size="11" fill="#22303f">仿真预演 · 优化决策</text>
  <text x="570" y="193" text-anchor="middle" font-size="11" fill="#6b7a8a">模型相互学习、进化自身</text>
