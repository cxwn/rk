  <line x1="140" y1="290" x2="140" y2="352" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="140,362 135.5,354 144.5,354" fill="#1f4e79"/>
  <text x="95" y="330" font-size="12" fill="#6b7a8a">处理数据</text>
  <line x1="240" y1="365" x2="240" y2="303" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="240,293 235.5,301 244.5,301" fill="#4a6130"/>
  <text x="270" y="330" text-anchor="middle" font-size="12" fill="#6b7a8a">响应／信息</text>
  <text x="185" y="452" text-anchor="middle" font-size="12" fill="#6b7a8a">MIS 信息与外部信息共同支持决策</text>
  <rect x="375" y="52" width="320" height="425" rx="10" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="535" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">两库结构：两库＋对话</text>
  <rect x="460" y="100" width="150" height="45" rx="7" fill="#fdf0e6" stroke="#c05621"/>
  <text x="535" y="128" text-anchor="middle" font-size="15" fill="#c05621">用户</text>
  <rect x="460" y="185" width="150" height="50" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="535" y="215" text-anchor="middle" font-size="15" fill="#1f4e79">对话子系统</text>
  <rect x="392" y="340" width="135" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="459.5" y="373" text-anchor="middle" font-size="14" fill="#4a6130">数据库子系统</text>
  <rect x="543" y="340" width="135" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="610.5" y="373" text-anchor="middle" font-size="14" fill="#4a6130">模型库子系统</text>
  <line x1="535" y1="145" x2="535" y2="172" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="535,182 530.5,174 539.5,174" fill="#1f4e79"/>
  <polyline points="485,235 485,275 460,275 460,327" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="460,337 455.5,329 464.5,329" fill="#1f4e79"/>
  <polyline points="585,235 585,275 610,275 610,327" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="610,337 605.5,329 614.5,329" fill="#1f4e79"/>
  <line x1="527" y1="367" x2="532" y2="367" stroke="#4a6130" stroke-width="1.5"/>
  <polygon points="540,367 532,362.5 532,371.5" fill="#4a6130"/>
  <text x="535" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">“两库”不等于总共两个部件</text>
  <text x="535" y="460" text-anchor="middle" font-size="12" fill="#6b7a8a">数据与模型是主要资源，对话连接用户</text>
</svg>
