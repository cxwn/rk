<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Lambda 与 Kappa：按场景做设计选择</text>
  <rect x="20" y="45" width="330" height="235" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="185" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Lambda：双链路求能力</text>
  <text x="45" y="106" font-size="12" font-weight="bold" fill="#1f4e79">优先选择信号</text>
  <text x="45" y="133" font-size="11" fill="#22303f">• 十年级海量历史探索分析</text>
  <text x="45" y="157" font-size="11" fill="#22303f">• 离线训练与实时验证逻辑不同</text>
  <text x="45" y="181" font-size="11" fill="#22303f">• 强依赖 Hadoop / 批处理生态</text>
  <text x="45" y="205" font-size="11" fill="#22303f">• 团队能承担两套部署测试运维</text>
  <rect x="45" y="225" width="280" height="36" rx="5" fill="#ffffff" stroke="#1f4e79"/>
  <text x="185" y="248" text-anchor="middle" font-size="11" fill="#c05621">代价：两套代码、合并视图、迁移成本高</text>
  <rect x="370" y="45" width="330" height="235" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="535" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">Kappa：单流链路求统一</text>
  <text x="395" y="106" font-size="12" font-weight="bold" fill="#c05621">优先选择信号</text>
  <text x="395" y="133" font-size="11" fill="#22303f">• 增量时序数据、天然时间窗口</text>
  <text x="395" y="157" font-size="11" fill="#22303f">• 实时与回溯可共用一套算法</text>
  <text x="395" y="181" font-size="11" fill="#22303f">• 偏好 Flink，算法修改较频繁</text>
  <text x="395" y="205" font-size="11" fill="#22303f">• 历史规模与重放资源可控</text>
  <rect x="395" y="225" width="280" height="36" rx="5" fill="#ffffff" stroke="#c05621"/>
  <text x="535" y="248" text-anchor="middle" font-size="11" fill="#c05621">代价：日志保留、海量回溯、多流关联</text>
  <text x="360" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">教材规定的四类主要选择因素</text>
  <rect x="20" y="322" width="155" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="97" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6130">业务与技术要求</text>
  <text x="97" y="365" text-anchor="middle" font-size="10" fill="#22303f">数据处理与技术依赖</text>
  <rect x="195" y="322" width="155" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="272" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6130">复杂度</text>
  <text x="272" y="365" text-anchor="middle" font-size="10" fill="#22303f">能否统一批流代码</text>
  <rect x="370" y="322" width="155" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="447" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6130">开发维护成本</text>
  <text x="447" y="365" text-anchor="middle" font-size="10" fill="#22303f">人员、部署、测试</text>
  <rect x="545" y="322" width="155" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="622" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6130">历史数据能力</text>
  <text x="622" y="365" text-anchor="middle" font-size="10" fill="#22303f">规模、频率、回溯</text>
  <text x="360" y="397" text-anchor="middle" font-size="10" fill="#6b7a8a">注意：教材认为计算开销有差别，但不作为主要选择因素</text>
</svg>