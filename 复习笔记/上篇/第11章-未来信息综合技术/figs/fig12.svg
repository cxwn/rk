<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">云计算三种服务方式与四种部署模式</text>
  <text x="30" y="56" font-size="13" font-weight="bold" fill="#1f4e79">三种服务方式：底层资源逐层封装，使用越来越方便</text>
  <rect x="30" y="74" width="210" height="184" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="135" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">IaaS</text>
  <text x="135" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#22303f">基础设施即服务</text>
  <text x="135" y="151" text-anchor="middle" font-size="11" fill="#22303f">内存 / I/O / 存储 / 计算</text>
  <text x="135" y="173" text-anchor="middle" font-size="11" fill="#22303f">整合成虚拟资源池</text>
  <text x="135" y="204" text-anchor="middle" font-size="11" fill="#22303f">用户搭建系统与应用</text>
  <text x="135" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">类比：租毛坯房</text>
  <line x1="240" y1="142" x2="244" y2="142" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="252,142 244,137.5 244,146.5" fill="#1f4e79"/>
  <rect x="255" y="74" width="210" height="184" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#c05621">PaaS</text>
  <text x="360" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#22303f">平台即服务</text>
  <text x="360" y="151" text-anchor="middle" font-size="11" fill="#22303f">分布式开发环境</text>
  <text x="360" y="173" text-anchor="middle" font-size="11" fill="#22303f">服务器平台与 Web API</text>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#22303f">用户定制开发应用</text>
  <text x="360" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">类比：租精装房</text>
  <text x="360" y="247" text-anchor="middle" font-size="10" fill="#6b7a8a">自己布置软装</text>
  <line x1="465" y1="142" x2="469" y2="142" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="477,142 469,137.5 469,146.5" fill="#1f4e79"/>
  <rect x="480" y="74" width="210" height="184" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="585" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a6130">SaaS</text>
  <text x="585" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#22303f">软件即服务</text>
  <text x="585" y="151" text-anchor="middle" font-size="11" fill="#22303f">统一部署的应用软件</text>
  <text x="585" y="173" text-anchor="middle" font-size="11" fill="#22303f">浏览器访问、按需订购</text>
  <text x="585" y="204" text-anchor="middle" font-size="11" fill="#22303f">简单配置即可上线</text>
  <text x="585" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">类比：直接住酒店</text>
  <rect x="60" y="280" width="600" height="48" rx="6" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">灵活性：SaaS → PaaS → IaaS 依次增强</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#22303f">方便性：IaaS → PaaS → SaaS 依次增强；PaaS 为上层 SaaS 提供 API</text>
  <text x="30" y="354" font-size="13" font-weight="bold" fill="#1f4e79">NIST 四种部署模式</text>
  <rect x="30" y="370" width="155" height="76" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="107.5" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">公有云</text>
  <text x="107.5" y="424" text-anchor="middle" font-size="11" fill="#22303f">基础设施向公众公开</text>
  <rect x="200" y="370" width="155" height="76" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="277.5" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">社区云</text>
  <text x="277.5" y="419" text-anchor="middle" font-size="10" fill="#22303f">共同关注的社区组织</text>
  <text x="277.5" y="437" text-anchor="middle" font-size="10" fill="#22303f">专有使用</text>
  <rect x="370" y="370" width="155" height="76" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="447.5" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">私有云</text>
  <text x="447.5" y="424" text-anchor="middle" font-size="11" fill="#22303f">分配给单个组织</text>
  <rect x="540" y="370" width="150" height="76" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="615" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">混合云</text>
  <text x="615" y="419" text-anchor="middle" font-size="10" fill="#22303f">公有云、私有云</text>
  <text x="615" y="437" text-anchor="middle" font-size="10" fill="#22303f">与社区云的组合</text>
</svg>
