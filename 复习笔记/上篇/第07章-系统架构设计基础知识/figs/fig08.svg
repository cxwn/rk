<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">主程序/子程序</text>
  <rect x="90" y="40" width="140" height="40" rx="6" fill="#1f4e79"/>
  <text x="160" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">主程序</text>
  <polyline points="130,80 130,96 90,96 90,119" fill="none" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="90,127 85.5,119 94.5,119" fill="#1f4e79"/>
  <polyline points="190,80 190,96 250,96 250,119" fill="none" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="250,127 245.5,119 254.5,119" fill="#1f4e79"/>
  <rect x="30" y="130" width="120" height="38" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="90" y="154" text-anchor="middle" font-size="13" fill="#1f4e79">子程序 A</text>
