<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">SAAM：输入与五步评估过程（据图8-1重绘）</text>
  <rect x="30" y="50" width="660" height="80" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="55" y="77" font-size="14" font-weight="bold" fill="#1f4e79">主要输入</text>
  <g font-size="14" text-anchor="middle">
    <rect x="145" y="64" width="150" height="45" rx="6" fill="#ffffff"/><text x="220" y="92">问题描述</text>
    <rect x="315" y="64" width="150" height="45" rx="6" fill="#ffffff"/><text x="390" y="92">需求声明</text>
    <rect x="485" y="64" width="150" height="45" rx="6" fill="#ffffff"/><text x="560" y="92">架构描述</text>
  </g>
  <line x1="360" y1="130" x2="360" y2="159" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,167 355.5,159 364.5,159" fill="#1f4e79"/>
  <rect x="10" y="170" width="700" height="155" rx="10" fill="#f7fafc" stroke="#6b7a8a"/>
  <text x="360" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">场景驱动，逐步从单个场景走向总体权衡</text>
  <g text-anchor="middle">
    <g fill="#eaf1f8" stroke="#1f4e79">
      <rect x="20" y="210" width="128" height="72" rx="7"/><rect x="158" y="210" width="128" height="72" rx="7"/>
      <rect x="296" y="210" width="128" height="72" rx="7"/><rect x="434" y="210" width="128" height="72" rx="7"/>
      <rect x="572" y="210" width="128" height="72" rx="7"/>
    </g>
    <g font-size="14" font-weight="bold" fill="#1f4e79">
      <text x="84" y="239">1 场景开发</text><text x="222" y="239">2 架构描述</text><text x="360" y="239">3 单个场景评估</text>
      <text x="498" y="239">4 场景交互评估</text><text x="636" y="239">5 总体评估</text>
    </g>
    <g font-size="11" fill="#6b7a8a">
      <text x="84" y="263">干系人协商</text><text x="222" y="263">功能·结构·分配</text><text x="360" y="263">直接 / 间接场景</text>
      <text x="498" y="263">共同影响的构件</text><text x="636" y="263">单架构或多架构比较</text>
    </g>
  </g>
  <g stroke="#1f4e79" stroke-width="1.4" fill="none">
    <line x1="148" y1="246" x2="150" y2="246"/><line x1="286" y1="246" x2="288" y2="246"/>
    <line x1="424" y1="246" x2="426" y2="246"/><line x1="562" y1="246" x2="564" y2="246"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="155,246 150,242.5 150,249.5"/><polygon points="293,246 288,242.5 288,249.5"/>
    <polygon points="431,246 426,242.5 426,249.5"/><polygon points="569,246 564,242.5 564,249.5"/>
  </g>
  <rect x="60" y="340" width="600" height="38" rx="6" fill="#fdf0e6"/>
  <text x="360" y="364" text-anchor="middle" font-size="13" fill="#c05621">评估逻辑：单场景逐项分析（AND）；场景交互与总体权衡（OR / 比较）</text>
