<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">Istio 服务网格：数据平面 + 控制平面</text>
  <!-- 数据平面大框 -->
  <rect x="30" y="50" width="400" height="230" rx="10" fill="#fbfcfd" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="230" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">数据平面 Data plane</text>
  <!-- Service A / Proxy A -->
  <rect x="50" y="90" width="130" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="115" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">Service A</text>
  <rect x="50" y="170" width="130" height="50" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="115" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">Proxy（Envoy）</text>
  <!-- Service B / Proxy B -->
  <rect x="280" y="90" width="130" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="345" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">Service B</text>
  <rect x="280" y="170" width="130" height="50" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="345" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">Proxy（Envoy）</text>
  <!-- A->ProxyA B->ProxyB -->
  <line x1="115" y1="144" x2="115" y2="159" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="115,167 110.5,159 119.5,159" fill="#8aa15c"/>
  <line x1="345" y1="144" x2="345" y2="159" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="345,167 340.5,159 349.5,159" fill="#8aa15c"/>
  <!-- ProxyA->ProxyB mesh traffic -->
  <text x="230" y="184" text-anchor="middle" font-size="10" fill="#6b7a8a">Mesh traffic</text>
  <line x1="184" y1="195" x2="269" y2="195" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="277,195 269,190.5 269,199.5" fill="#c05621"/>
  <!-- Ingress / Egress -->
  <text x="36" y="160" text-anchor="middle" font-size="9" fill="#6b7a8a">Ingress</text>
  <text x="36" y="172" text-anchor="middle" font-size="9" fill="#6b7a8a">Traffic</text>
  <line x1="8" y1="195" x2="39" y2="195" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="47,195 39,190.5 39,199.5" fill="#6b7a8a"/>
  <text x="424" y="160" text-anchor="middle" font-size="9" fill="#6b7a8a">Egress</text>
  <text x="424" y="172" text-anchor="middle" font-size="9" fill="#6b7a8a">Traffic</text>
  <line x1="414" y1="195" x2="441" y2="195" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="449,195 441,190.5 441,199.5" fill="#6b7a8a"/>
  <!-- 数据平面说明 -->
  <text x="230" y="250" text-anchor="middle" font-size="10.5" fill="#6b7a8a">请求被 Sidecar 代理截获：服务发现、熔断、限流</text>
  <text x="230" y="268" text-anchor="middle" font-size="10.5" fill="#6b7a8a">业务零改造获得流量治理、可观测、安全能力</text>
  <!-- 控制平面大框 -->
  <rect x="470" y="50" width="220" height="230" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="580" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">控制平面（Istiod）</text>
  <rect x="490" y="90" width="180" height="44" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="580" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">Pilot</text>
  <text x="580" y="124" text-anchor="middle" font-size="10" fill="#22303f">服务发现、流量管理</text>
  <rect x="490" y="146" width="180" height="44" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="580" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">Citadel</text>
  <text x="580" y="180" text-anchor="middle" font-size="10" fill="#22303f">终端用户认证、流量加密</text>
  <rect x="490" y="202" width="180" height="44" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="580" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">Mixer / Galley</text>
  <text x="580" y="236" text-anchor="middle" font-size="10" fill="#22303f">访问控制、可观测、配置</text>
  <!-- 控制平面 -> 数据平面 配置下发（虚线） -->
  <line x1="466" y1="118" x2="441" y2="118" stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
  <polygon points="433,118 441,113.5 441,122.5" fill="#1f4e79"/>
  <!-- 底部说明 -->
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#22303f">控制平面经 xDS 协议向 Proxy 下发服务发现、配置与证书；数据平面与控制平面标准化是趋势</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#6b7a8a">安全：POD Identity、mTLS 链路加密、RPC 上 RBAC 的 ACL、基于 Identity 的微隔离</text>
</svg>
