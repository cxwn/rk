<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">两层、三层、B/S 与多层 C/S 架构对比</text>
  <text x="28" y="82" font-size="14" font-weight="bold" fill="#c05621">两层 C/S</text>
  <rect x="190" y="52" width="150" height="52" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="265" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">前台客户端</text>
  <text x="265" y="94" text-anchor="middle" font-size="11" fill="#22303f">界面 + 业务逻辑</text>
  <rect x="460" y="52" width="150" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="535" y="83" text-anchor="middle" font-size="13" fill="#1f4e79">数据库服务</text>
  <line x1="340" y1="78" x2="449" y2="78" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="457,78 449,73.5 449,82.5" fill="#1f4e79"/>
  <text x="28" y="164" font-size="14" font-weight="bold" fill="#1f4e79">三层 C/S</text>
  <rect x="150" y="134" width="120" height="52" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="210" y="165" text-anchor="middle" font-size="13" fill="#22303f">前台界面</text>
  <rect x="330" y="134" width="140" height="52" rx="6" fill="#f3f6ee" stroke="#4a6130"/>
  <text x="400" y="165" text-anchor="middle" font-size="13" fill="#4a6130">后台业务服务</text>
  <rect x="550" y="134" width="140" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="620" y="165" text-anchor="middle" font-size="13" fill="#1f4e79">数据库</text>
  <line x1="270" y1="160" x2="319" y2="160" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="327,160 319,155.5 319,164.5" fill="#1f4e79"/>
  <line x1="470" y1="160" x2="539" y2="160" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="547,160 539,155.5 539,164.5" fill="#1f4e79"/>
  <text x="28" y="246" font-size="14" font-weight="bold" fill="#4a6130">B/S</text>
  <rect x="150" y="216" width="120" height="52" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="210" y="247" text-anchor="middle" font-size="13" fill="#22303f">Web 浏览器</text>
  <rect x="330" y="216" width="140" height="52" rx="6" fill="#f3f6ee" stroke="#4a6130"/>
  <text x="400" y="247" text-anchor="middle" font-size="13" fill="#4a6130">Web 服务器</text>
  <rect x="550" y="216" width="140" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="620" y="247" text-anchor="middle" font-size="13" fill="#1f4e79">数据库</text>
  <line x1="270" y1="242" x2="319" y2="242" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="327,242 319,237.5 319,246.5" fill="#1f4e79"/>
  <text x="295" y="232" text-anchor="middle" font-size="10" fill="#6b7a8a">HTTP</text>
  <line x1="470" y1="242" x2="539" y2="242" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="547,242 539,237.5 539,246.5" fill="#1f4e79"/>
  <text x="28" y="330" font-size="14" font-weight="bold" fill="#1f4e79">多层 C/S</text>
  <rect x="90" y="300" width="110" height="52" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="145" y="331" text-anchor="middle" font-size="12" fill="#22303f">浏览器</text>
  <rect x="250" y="300" width="110" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="305" y="323" text-anchor="middle" font-size="12" fill="#1f4e79">Web 服务器</text>
  <rect x="410" y="300" width="110" height="52" rx="6" fill="#f3f6ee" stroke="#4a6130"/>
  <text x="465" y="323" text-anchor="middle" font-size="12" fill="#4a6130">中间件/应用层</text>
  <text x="465" y="342" text-anchor="middle" font-size="10" fill="#22303f">业务 · 转发 · 隔离</text>
  <rect x="570" y="300" width="110" height="52" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="625" y="331" text-anchor="middle" font-size="12" fill="#1f4e79">数据库</text>
  <line x1="200" y1="326" x2="239" y2="326" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="247,326 239,321.5 239,330.5" fill="#1f4e79"/>
  <line x1="360" y1="326" x2="399" y2="326" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="407,326 399,321.5 399,330.5" fill="#1f4e79"/>
  <line x1="520" y1="326" x2="559" y2="326" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="567,326 559,321.5 559,330.5" fill="#1f4e79"/>
  <rect x="70" y="382" width="580" height="46" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="360" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">B/S = 采用通用浏览器客户端的三层 C/S</text>
  <text x="360" y="419" text-anchor="middle" font-size="11" fill="#22303f">多层中间件提升伸缩与并发、处理业务、隔离数据库访问</text>
</svg>
