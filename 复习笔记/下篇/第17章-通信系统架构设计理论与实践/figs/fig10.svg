<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 325" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">三层层次化网络模型：各层职责与设计要点</text>
  <!-- 核心层 -->
  <rect x="60" y="50" width="600" height="64" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="110" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">核心层</text>
  <text x="170" y="74" font-size="11" fill="#22303f">高速转发、最优路径；冗余保高可用，覆盖范围不宜过大</text>
  <text x="170" y="96" font-size="11" fill="#22303f">避免包过滤/策略路由等高开销功能；选高端路由/交换机</text>
  <line x1="360" y1="114" x2="360" y2="129" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,137 355.5,129 364.5,129" fill="#1f4e79"/>
  <!-- 汇聚层 -->
  <rect x="60" y="140" width="600" height="64" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="110" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">汇聚层</text>
  <text x="170" y="164" font-size="11" fill="#22303f">执行安全、流量负载、路由策略；部署防火墙/负载均衡</text>
  <text x="170" y="186" font-size="11" fill="#22303f">对核心屏蔽接入细节（路由汇总），对接入仅宣告默认路由</text>
  <line x1="360" y1="204" x2="360" y2="219" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="360,227 355.5,219 364.5,219" fill="#c05621"/>
  <!-- 接入层 -->
  <rect x="60" y="230" width="600" height="64" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="110" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">接入层</text>
  <text x="170" y="254" font-size="11" fill="#22303f">用户接入与带宽保障；地址认证、用户认证、计费管理</text>
  <text x="170" y="276" font-size="11" fill="#22303f">收集用户 IP/MAC、访问日志；选低端交换机连接用户</text>
  <text x="360" y="314" text-anchor="middle" font-size="11" fill="#4a6130">助记：先从接入层设计→逐层向上做容量规划；控制层次、模块化、禁止跨层私接</text>
</svg>
