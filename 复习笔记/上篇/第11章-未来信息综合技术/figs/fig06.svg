  <polygon points="360,289 355.5,281 364.5,281" fill="#6b7a8a"/>
  <line x1="498" y1="250" x2="498" y2="281" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="498,289 493.5,281 502.5,281" fill="#6b7a8a"/>
  <line x1="636" y1="250" x2="636" y2="281" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="636,289 631.5,281 640.5,281" fill="#6b7a8a"/>
  <rect x="20" y="292" width="128" height="136" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
