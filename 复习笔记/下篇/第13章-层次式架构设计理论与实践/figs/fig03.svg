<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="22" font-weight="bold" fill="#22303f">MVP与MVVM：都把View和Model隔开（重绘图13-3、13-4）</text>
  <rect x="28" y="54" width="664" height="188" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="54" y="84" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#1f4e79">MVP：Presenter集中协调</text>
  <rect x="64" y="112" width="142" height="68" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="135" y="141" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" font-weight="bold" fill="#1f4e79">View</text>
  <text x="135" y="165" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#22303f">实现IView接口</text>
  <rect x="290" y="112" width="142" height="68" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="361" y="141" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" font-weight="bold" fill="#c05621">Presenter</text>
  <text x="361" y="165" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#22303f">UI逻辑，便于单测</text>
  <rect x="516" y="112" width="142" height="68" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="587" y="153" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" font-weight="bold" fill="#4a6130">Model</text>
  <line x1="206" y1="136" x2="278" y2="136" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="286,136 278,131.5 278,140.5" fill="#1f4e79"/>
  <line x1="290" y1="160" x2="218" y2="160" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="210,160 218,155.5 218,164.5" fill="#1f4e79"/>
  <line x1="432" y1="136" x2="504" y2="136" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="512,136 504,131.5 504,140.5" fill="#1f4e79"/>
  <line x1="516" y1="160" x2="444" y2="160" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="436,160 444,155.5 444,164.5" fill="#1f4e79"/>
  <text x="360" y="215" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">所有交互经Presenter；View不直接读取Model</text>
  <rect x="28" y="266" width="664" height="204" rx="10" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="54" y="296" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="19" font-weight="bold" fill="#4a6130">MVVM：ViewModel + DataBinding</text>
  <rect x="64" y="326" width="142" height="68" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="135" y="355" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" font-weight="bold" fill="#1f4e79">View</text>
  <text x="135" y="379" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#22303f">声明式视图模板</text>
  <rect x="290" y="326" width="142" height="68" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="361" y="355" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" font-weight="bold" fill="#c05621">ViewModel</text>
  <text x="361" y="379" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#22303f">状态 · 转换 · 命令</text>
  <rect x="516" y="326" width="142" height="68" rx="8" fill="#ffffff" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="587" y="367" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="18" font-weight="bold" fill="#4a6130">Model</text>
  <line x1="206" y1="348" x2="278" y2="348" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="286,348 278,343.5 278,352.5" fill="#c05621"/>
  <line x1="290" y1="374" x2="218" y2="374" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="210,374 218,369.5 218,378.5" fill="#c05621"/>
  <line x1="432" y1="348" x2="504" y2="348" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="512,348 504,343.5 504,352.5" fill="#c05621"/>
  <line x1="516" y1="374" x2="444" y2="374" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="436,374 444,369.5 444,378.5" fill="#c05621"/>
  <text x="360" y="425" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="14" fill="#22303f">双向绑定自动同步；适合数据驱动、更新频繁场景</text>
  <text x="360" y="451" text-anchor="middle" font-family="Microsoft YaHei, 微软雅黑, sans-serif" font-size="13" fill="#c05621">代价：问题来源可能藏在数据或绑定逻辑中，定位更困难</text>
</svg>
