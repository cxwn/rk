  <line x1="195" y1="349" x2="195" y2="368" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <line x1="195" y1="368" x2="105" y2="368" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <line x1="105" y1="368" x2="105" y2="387" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="105,392 100.5,384 109.5,384" fill="#8aa15c"/>
  <line x1="265" y1="349" x2="265" y2="387" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="265,392 260.5,384 269.5,384" fill="#8aa15c"/>
  <text x="185" y="465" text-anchor="middle" font-size="10" fill="#4a6130">两条独立服务链可并行调用、互不影响</text>
  <rect x="380" y="275" width="310" height="210" rx="8" fill="#f4f6f8" stroke="#6b7a8a" stroke-width="1.5"/>
  <text x="535" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">异步消息传递模式</text>
  <rect x="400" y="320" width="80" height="38" rx="4" fill="#ffffff" stroke="#6b7a8a"/>
  <rect x="510" y="315" width="150" height="48" rx="4" fill="#fdf0e6" stroke="#c05621"/>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#22303f">请求者</text>
  <text x="585" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">消息队列</text>
  <text x="585" y="353" text-anchor="middle" font-size="9" fill="#6b7a8a">写入后立即响应</text>
  <line x1="480" y1="339" x2="502" y2="339" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="507,339 499,334.5 499,343.5" fill="#c05621"/>
  <rect x="510" y="410" width="150" height="42" rx="4" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="585" y="436" text-anchor="middle" font-size="11" fill="#22303f">消费者异步处理</text>
  <line x1="585" y1="363" x2="585" y2="402" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="585,407 580.5,399 589.5,399" fill="#6b7a8a"/>
  <text x="535" y="474" text-anchor="middle" font-size="10" fill="#6b7a8a">削峰解耦、加快响应，但增加系统复杂性</text>
