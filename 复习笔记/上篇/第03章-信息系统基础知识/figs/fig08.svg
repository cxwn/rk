<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="510" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303f">数据仓库与数据挖掘</text>
  <g text-anchor="middle" font-size="14">
    <rect x="40" y="65" width="130" height="60" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="105" y="101">TPS／业务数据</text>
    <rect x="295" y="65" width="130" height="60" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="360" y="101">外部信息</text>
    <rect x="550" y="65" width="130" height="60" rx="7" fill="#eaf1f8" stroke="#1f4e79"/><text x="615" y="101">活动反馈信息</text>
  </g>
  <polyline points="105,125 105,155 270,155 270,177" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="270,187 265.5,179 274.5,179" fill="#1f4e79"/>
  <line x1="360" y1="125" x2="360" y2="177" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="360,187 355.5,179 364.5,179" fill="#1f4e79"/>
  <polyline points="615,125 615,155 450,155 450,177" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="450,187 445.5,179 454.5,179" fill="#1f4e79"/>
  <rect x="210" y="190" width="300" height="60" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="360" y="215" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6130">数据仓库（独立于作业层）</text>
  <text x="360" y="238" text-anchor="middle" font-size="12" fill="#22303f">面向分析查询，保持数据一致、准确、可用</text>
  <text x="360" y="278" text-anchor="middle" font-size="13" fill="#6b7a8a">提炼 → 清洗确认 → 一致化 → 载入</text>
  <line x1="360" y1="250" x2="360" y2="302" stroke="#4a6130" stroke-width="1.5"/>
  <polygon points="360,312 355.5,304 364.5,304" fill="#4a6130"/>
  <rect x="45" y="315" width="630" height="50" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">数据挖掘／智能体：查询、趋势、异常、模式与规则</text>
  <g stroke="#c05621" stroke-width="1.5" fill="none">
    <line x1="120" y1="365" x2="120" y2="387"/><line x1="295" y1="365" x2="295" y2="387"/>
    <line x1="470" y1="365" x2="470" y2="387"/><line x1="645" y1="365" x2="645" y2="387"/>
  </g>
  <g fill="#c05621">
    <polygon points="120,397 115.5,389 124.5,389"/><polygon points="295,397 290.5,389 299.5,389"/>
    <polygon points="470,397 465.5,389 474.5,389"/><polygon points="645,397 640.5,389 644.5,389"/>
  </g>
  <g text-anchor="middle">
    <rect x="50" y="400" width="140" height="82" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="120" y="427" font-size="16" font-weight="bold" fill="#1f4e79">联合</text><text x="120" y="452" font-size="12" fill="#22303f">事件经常一起发生</text><text x="120" y="471" font-size="12" fill="#6b7a8a">看共现</text>
    <rect x="225" y="400" width="140" height="82" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="295" y="427" font-size="16" font-weight="bold" fill="#1f4e79">定序</text><text x="295" y="452" font-size="12" fill="#22303f">识别先后次序</text><text x="295" y="471" font-size="12" fill="#6b7a8a">看顺序</text>
    <rect x="400" y="400" width="140" height="82" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="470" y="427" font-size="16" font-weight="bold" fill="#4a6130">分类</text><text x="470" y="452" font-size="12" fill="#22303f">按已知标准归类</text><text x="470" y="471" font-size="12" fill="#6b7a8a">看类别</text>
    <rect x="575" y="400" width="140" height="82" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="645" y="427" font-size="16" font-weight="bold" fill="#4a6130">聚类</text><text x="645" y="452" font-size="12" fill="#22303f">按相似性发现群组</text><text x="645" y="471" font-size="12" fill="#6b7a8a">找群组</text>
  </g>
</svg>
