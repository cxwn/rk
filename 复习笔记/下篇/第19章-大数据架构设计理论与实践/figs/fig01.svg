  <line x1="360" y1="240" x2="360" y2="252" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,260 355.5,252 364.5,252" fill="#1f4e79"/>
  <rect x="300" y="263" width="120" height="38" rx="5" fill="#fdf0e6" stroke="#c05621"/>
