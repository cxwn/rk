<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">论文 120 分钟时间分配</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#6b7a8a">先保完整，再求精彩；正文约占三分之二</text>

  <g font-size="16" font-weight="bold" text-anchor="middle">
    <rect x="35" y="85" width="110" height="120" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="90" y="116" fill="#1f4e79">① 试题选择</text>
    <text x="90" y="157" font-size="25" fill="#1f4e79">3 分钟</text>
    <text x="90" y="185" font-size="12" font-weight="normal" fill="#22303f">选题画圈填考号</text>
    <rect x="170" y="85" width="110" height="120" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="225" y="116" fill="#4a6130">② 论文构思</text>
    <text x="225" y="157" font-size="25" fill="#4a6130">12 分钟</text>
    <text x="225" y="185" font-size="12" font-weight="normal" fill="#22303f">论点提纲配字数</text>
    <rect x="305" y="85" width="110" height="120" rx="8" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="116" fill="#c05621">③ 写摘要</text>
    <text x="360" y="157" font-size="25" fill="#c05621">15 分钟</text>
    <text x="360" y="185" font-size="12" font-weight="normal" fill="#22303f">四要素压缩全文</text>
    <rect x="440" y="85" width="110" height="120" rx="8" fill="#1f4e79" stroke="#1f4e79"/>
    <text x="495" y="116" fill="#ffffff">④ 正文撰写</text>
    <text x="495" y="157" font-size="25" fill="#ffffff">80 分钟</text>
    <text x="495" y="185" font-size="12" font-weight="normal" fill="#ffffff">项目理论应用</text>
    <rect x="575" y="85" width="110" height="120" rx="8" fill="#eaf1f8" stroke="#6b7a8a"/>
    <text x="630" y="116" fill="#1f4e79">⑤ 检查修改</text>
    <text x="630" y="157" font-size="25" fill="#1f4e79">10 分钟</text>
    <text x="630" y="185" font-size="12" font-weight="normal" fill="#22303f">查缺纠错保完整</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="145" y1="145" x2="159" y2="145"/><line x1="280" y1="145" x2="294" y2="145"/>
    <line x1="415" y1="145" x2="429" y2="145"/><line x1="550" y1="145" x2="564" y2="145"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="167,145 159,140.5 159,149.5"/><polygon points="302,145 294,140.5 294,149.5"/>
    <polygon points="437,145 429,140.5 429,149.5"/><polygon points="572,145 564,140.5 564,149.5"/>
  </g>

  <text x="50" y="244" font-size="14" font-weight="bold" fill="#22303f">按比例看时间预算</text>
  <rect x="50" y="260" width="15.5" height="58" fill="#6b7a8a"/>
  <rect x="65.5" y="260" width="62" height="58" fill="#8aa15c"/>
  <rect x="127.5" y="260" width="77.5" height="58" fill="#c05621"/>
  <rect x="205" y="260" width="413.3" height="58" fill="#1f4e79"/>
  <rect x="618.3" y="260" width="51.7" height="58" fill="#9aacbb"/>
  <rect x="50" y="260" width="620" height="58" fill="none" stroke="#ffffff" stroke-width="1"/>
  <text x="411.5" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">正文 80 分钟</text>
  <text x="360" y="350" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">3 ＋ 12 ＋ 15 ＋ 80 ＋ 10 ＝ 120 分钟</text>
  <text x="360" y="378" text-anchor="middle" font-size="13" fill="#6b7a8a">时间方案是通用框架，可微调，但必须预留检查与收尾时间</text>
</svg>
