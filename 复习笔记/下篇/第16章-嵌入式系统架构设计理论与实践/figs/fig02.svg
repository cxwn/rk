  <rect x="455" y="137" width="155" height="105" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="478" y="163" font-size="14" font-weight="bold" fill="#c05621">构件</text>
  <rect x="485" y="177" width="95" height="42" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
