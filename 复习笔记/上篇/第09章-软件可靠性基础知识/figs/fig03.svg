<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" width="720" height="435" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="435" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">可靠度、失效强度与 MTTF / MTTR / MTBF</text>
  <rect x="40" y="55" width="305" height="64" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="192" y="83" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">R(t) = 1 − F(t)</text>
  <text x="192" y="106" text-anchor="middle" font-size="12" fill="#22303f">可靠度＝规定条件下、时间内不失效的概率</text>
  <rect x="375" y="55" width="305" height="64" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="527" y="83" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">f(t) = F′(t)</text>
  <text x="527" y="106" text-anchor="middle" font-size="12" fill="#22303f">失效强度＝单位时间出现失效的概率</text>
  <rect x="40" y="135" width="305" height="64" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="192" y="163" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">MTTF = ∫0^∞ R(t) dt</text>
  <text x="192" y="186" text-anchor="middle" font-size="12" fill="#22303f">平均失效前时间：持续运行时间的期望</text>
  <rect x="375" y="135" width="305" height="64" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="527" y="163" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">MTBF = MTTF + MTTR</text>
  <text x="527" y="186" text-anchor="middle" font-size="12" fill="#22303f">平均故障间隔时间（指数分布时成立）</text>
  <text x="360" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">运行—失效—修复周期</text>
  <text x="300" y="263" text-anchor="middle" font-size="12.5" fill="#22303f">MTBF：两次相邻失效之间</text>
  <g stroke="#6b7a8a" stroke-width="1.2" fill="none">
    <line x1="200" y1="272" x2="200" y2="280"/>
    <line x1="200" y1="272" x2="400" y2="272"/>
    <line x1="400" y1="272" x2="400" y2="280"/>
  </g>
  <rect x="60" y="292" width="140" height="16" fill="#8aa15c"/>
  <rect x="200" y="292" width="50" height="16" fill="#c05621"/>
  <rect x="250" y="292" width="150" height="16" fill="#8aa15c"/>
  <rect x="400" y="292" width="50" height="16" fill="#c05621"/>
  <rect x="450" y="292" width="190" height="16" fill="#8aa15c"/>
  <line x1="640" y1="300" x2="662" y2="300" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="670,300 662,295.5 662,304.5" fill="#1f4e79"/>
  <text x="200" y="286" text-anchor="middle" font-size="11" fill="#c05621">失效 1</text>
  <text x="400" y="286" text-anchor="middle" font-size="11" fill="#c05621">失效 2</text>
  <text x="250" y="325" text-anchor="middle" font-size="11" fill="#6b7a8a">恢复</text>
  <text x="450" y="325" text-anchor="middle" font-size="11" fill="#6b7a8a">恢复</text>
  <line x1="60" y1="335" x2="200" y2="335" stroke="#4a6130" stroke-width="1.2"/>
  <text x="130" y="355" text-anchor="middle" font-size="12" fill="#4a6130">MTTF：平均失效前时间</text>
  <text x="300" y="378" text-anchor="middle" font-size="12" fill="#c05621">MTTR：平均恢复前时间（检测＋修复，越短越好）</text>
  <rect x="520" y="330" width="14" height="10" fill="#8aa15c"/>
  <text x="540" y="339" font-size="11" fill="#22303f">运行</text>
  <rect x="580" y="330" width="14" height="10" fill="#c05621"/>
  <text x="600" y="339" font-size="11" fill="#22303f">修复</text>
  <text x="360" y="415" text-anchor="middle" font-size="12.5" fill="#22303f">MTTF 对不可修复系统即平均寿命；MTTR 含确认失效、记录任务与重新投入使用的时间</text>
</svg>
