  <polygon points="360,205 355.5,197 364.5,197" fill="#1f4e79"/>
  <line x1="360" y1="246" x2="360" y2="269" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,277 355.5,269 364.5,269" fill="#1f4e79"/>
  <rect x="140" y="280" width="440" height="38" rx="5" fill="#6b7a8a"/>
