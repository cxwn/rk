<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">基于对称密钥的数字签名（可信仲裁人 BB）</text>
  <rect x="60" y="45" width="100" height="40" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="110" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">发送方 A</text>
  <rect x="310" y="45" width="100" height="40" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">仲裁人 BB</text>
  <rect x="560" y="45" width="100" height="40" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="610" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">接收方 B</text>
  <line x1="110" y1="85" x2="110" y2="180" stroke="#6b7a8a" stroke-width="1" fill="none"/>
  <line x1="360" y1="85" x2="360" y2="180" stroke="#6b7a8a" stroke-width="1" fill="none"/>
  <line x1="610" y1="85" x2="610" y2="180" stroke="#6b7a8a" stroke-width="1" fill="none"/>
  <text x="235" y="106" text-anchor="middle" font-size="11" fill="#22303f">① A‖KA(B,RA,t,P)</text>
  <line x1="110" y1="115" x2="349" y2="115" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="357,115 349,110.5 349,119.5" fill="#1f4e79"/>
  <text x="485" y="146" text-anchor="middle" font-size="11" fill="#22303f">② KB(A,RA,t,P,KBB(A,t,P))</text>
  <line x1="360" y1="155" x2="599" y2="155" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="607,155 599,150.5 599,159.5" fill="#1f4e79"/>
  <text x="360" y="200" text-anchor="middle" font-size="11.5" fill="#6b7a8a">KA、KB 为 A、B 各自与 BB 共享的密钥；KBB 只有仲裁人 BB 掌握，t 为时间戳</text>
  <text x="360" y="222" text-anchor="middle" font-size="11.5" fill="#6b7a8a">B 保存证据 KBB(A,t,P)：A 不能抵赖、B 不能篡改（仲裁时 BB 可当场解密验证）</text>
</svg>
