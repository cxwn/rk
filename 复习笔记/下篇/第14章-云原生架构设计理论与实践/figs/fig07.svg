  <rect x="365" y="74" width="90" height="52" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="410" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#22303f">APP</text>
  <text x="410" y="114" text-anchor="middle" font-size="9.5" fill="#22303f">Bin/Library</text>
  <rect x="255" y="148" width="205" height="34" rx="5" fill="#e4e9ee" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="357" y="170" text-anchor="middle" font-size="11" fill="#22303f">Operating System</text>
