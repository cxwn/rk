<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7a8a"/>
    </marker>
  </defs>
  <!-- 业务系统层 -->
  <g font-size="13" fill="#22303f">
    <rect x="25" y="20" width="150" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="100" y="44" text-anchor="middle" font-weight="bold">CRM 系统</text>
    <text x="100" y="64" text-anchor="middle" font-size="11">业务流程</text>
    <rect x="200" y="20" width="150" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="275" y="44" text-anchor="middle" font-weight="bold">MIS 系统</text>
    <text x="275" y="64" text-anchor="middle" font-size="11">业务流程</text>
    <rect x="375" y="20" width="150" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="450" y="44" text-anchor="middle" font-weight="bold">资金管理系统</text>
    <text x="450" y="64" text-anchor="middle" font-size="11">业务流程</text>
    <rect x="550" y="20" width="150" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="625" y="44" text-anchor="middle" font-weight="bold">资产风险系统</text>
    <text x="625" y="64" text-anchor="middle" font-size="11">业务流程</text>
  </g>
  <!-- 业务构件层 -->
  <rect x="25" y="108" width="675" height="56" rx="5" fill="#fdf0e6" stroke="#c05621"/>
  <text x="362" y="130" font-size="12" fill="#c05621" text-anchor="middle">业务构件层</text>
  <g font-size="12" fill="#22303f">
    <rect x="60" y="136" width="120" height="22" rx="3" fill="#ffffff" stroke="#c05621"/>
    <text x="120" y="152" text-anchor="middle">业务构件</text>
    <rect x="220" y="136" width="120" height="22" rx="3" fill="#ffffff" stroke="#c05621"/>
    <text x="280" y="152" text-anchor="middle">业务构件</text>
    <rect x="380" y="136" width="120" height="22" rx="3" fill="#ffffff" stroke="#c05621"/>
    <text x="440" y="152" text-anchor="middle">业务构件</text>
    <rect x="540" y="136" width="120" height="22" rx="3" fill="#ffffff" stroke="#c05621"/>
    <text x="600" y="152" text-anchor="middle">业务构件</text>
  </g>
  <!-- SOA 中间件层 -->
  <rect x="25" y="196" width="675" height="48" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="362" y="226" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">面向构件的 SOA 中间件 EOS（J2EE Server / Websphere）</text>
  <!-- ESB 层 -->
  <rect x="25" y="276" width="675" height="56" rx="5" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="362" y="300" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">ESB 企业服务总线（WebSphere Message Broker）</text>
  <text x="362" y="322" font-size="12" fill="#22303f" text-anchor="middle">传输服务 / 事件服务 / 中转服务 / 服务路由目录库</text>
  <!-- 既有系统层 -->
  <g font-size="13" fill="#22303f">
    <rect x="25" y="364" width="150" height="40" rx="5" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="100" y="389" text-anchor="middle">主机系统</text>
    <rect x="200" y="364" width="150" height="40" rx="5" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="275" y="389" text-anchor="middle">网上银行系统</text>
    <rect x="375" y="364" width="150" height="40" rx="5" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="450" y="389" text-anchor="middle">基金交易系统</text>
    <rect x="550" y="364" width="150" height="40" rx="5" fill="#ffffff" stroke="#6b7a8a"/>
    <text x="625" y="389" text-anchor="middle">外汇交易系统</text>
  </g>
  <!-- 层间连接（两条独立竖向箭头链，互不汇聚） -->
  <g stroke="#6b7a8a" stroke-width="1.4">
    <line x1="100" y1="79" x2="100.0" y2="94.0"/>
    <polygon points="100.0,102.0 95.5,94.0 104.5,94.0" fill="#6b7a8a"/>
    <line x1="100" y1="167" x2="100.0" y2="182.0"/>
    <polygon points="100.0,190.0 95.5,182.0 104.5,182.0" fill="#6b7a8a"/>
    <line x1="100" y1="247" x2="100.0" y2="262.0"/>
    <polygon points="100.0,270.0 95.5,262.0 104.5,262.0" fill="#6b7a8a"/>
    <line x1="100" y1="335" x2="100.0" y2="350.0"/>
    <polygon points="100.0,358.0 95.5,350.0 104.5,350.0" fill="#6b7a8a"/>
    <line x1="450" y1="79" x2="450.0" y2="94.0"/>
    <polygon points="450.0,102.0 445.5,94.0 454.5,94.0" fill="#6b7a8a"/>
    <line x1="450" y1="167" x2="450.0" y2="182.0"/>
    <polygon points="450.0,190.0 445.5,182.0 454.5,182.0" fill="#6b7a8a"/>
    <line x1="450" y1="247" x2="450.0" y2="262.0"/>
    <polygon points="450.0,270.0 445.5,262.0 454.5,262.0" fill="#6b7a8a"/>
    <line x1="450" y1="335" x2="450.0" y2="350.0"/>
    <polygon points="450.0,358.0 445.5,350.0 454.5,350.0" fill="#6b7a8a"/>
  </g>
</svg>
