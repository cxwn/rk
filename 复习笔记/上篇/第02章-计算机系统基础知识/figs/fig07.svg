<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 上半：基本工作原理 -->
  <text x="360" y="26" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">基本工作原理</text>
  <g font-size="13" fill="#22303f">
    <rect x="10" y="50" width="120" height="56" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="70" y="84" text-anchor="middle">操作者</text>
    <rect x="150" y="50" width="120" height="56" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="210" y="84" text-anchor="middle">人-机接口</text>
    <rect x="290" y="50" width="120" height="56" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="350" y="76" text-anchor="middle" font-weight="bold" fill="#c05621">嵌入式</text>
    <text x="350" y="94" text-anchor="middle" font-weight="bold" fill="#c05621">计算机</text>
    <rect x="430" y="50" width="120" height="56" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="490" y="76" text-anchor="middle">数字/模拟</text>
    <text x="490" y="94" text-anchor="middle">接口</text>
    <rect x="570" y="50" width="120" height="56" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
    <text x="630" y="84" text-anchor="middle">受控对象</text>
  </g>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="133" y1="78" x2="139" y2="78"/>
    <polygon points="147,78 139,73.5 139,82.5" fill="#1f4e79"/>
    <line x1="273" y1="78" x2="279" y2="78"/>
    <polygon points="287,78 279,73.5 279,82.5" fill="#1f4e79"/>
    <line x1="413" y1="78" x2="419" y2="78"/>
    <polygon points="427,78 419,73.5 419,82.5" fill="#1f4e79"/>
    <line x1="553" y1="78" x2="559" y2="78"/>
    <polygon points="567,78 559,73.5 559,82.5" fill="#1f4e79"/>
  </g>
  <text x="360" y="136" font-size="11" fill="#6b7a8a" text-anchor="middle">采集输入信息/命令 → 加工计算 → 输出结果控制受控对象</text>
  <!-- 下半：开发环境 -->
  <text x="360" y="186" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">开发环境：宿主机开发 → 目标机运行/固化</text>
  <rect x="100" y="210" width="170" height="80" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="185" y="242" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">宿主机</text>
  <text x="185" y="266" font-size="11" fill="#22303f" text-anchor="middle">PC/工作站 + 专用工具</text>
  <rect x="450" y="210" width="170" height="80" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.4"/>
  <text x="535" y="242" font-size="15" font-weight="bold" fill="#4a6130" text-anchor="middle">目标机</text>
  <text x="535" y="266" font-size="11" fill="#22303f" text-anchor="middle">嵌入式设备运行环境</text>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="273" y1="250" x2="439" y2="250"/>
    <polygon points="447,250 439,245.5 439,254.5" fill="#1f4e79"/>
  </g>
  <text x="360" y="236" font-size="11" fill="#22303f" text-anchor="middle">串口 / 网络 / JTAG</text>
  <text x="360" y="324" font-size="11" fill="#6b7a8a" text-anchor="middle">生成二进制代码后下载到目标机或固化在其存储器上运行</text>
  <text x="360" y="352" font-size="12" fill="#c05621" text-anchor="middle">嵌入式系统最大特点：运行和开发在不同环境中进行</text>
</svg>
