  <text x="360" y="714" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">功能—过程结构：职能通过逻辑相关活动落地（简化）</text>
  <g text-anchor="middle" font-size="12" fill="#22303f">
    <rect x="30" y="740" width="95" height="55" rx="6" fill="#eaf1f8" stroke="#1f4e79"/><text x="77.5" y="773">主计划</text>
    <rect x="143" y="740" width="95" height="55" rx="6" fill="#eaf1f8" stroke="#1f4e79"/><text x="190.5" y="773">采购进货</text>
    <rect x="256" y="740" width="95" height="55" rx="6" fill="#eaf1f8" stroke="#1f4e79"/><text x="303.5" y="773">库存管理</text>
    <rect x="369" y="740" width="95" height="55" rx="6" fill="#fdf0e6" stroke="#c05621"/><text x="416.5" y="773">制造计划</text>
    <rect x="482" y="740" width="95" height="55" rx="6" fill="#fdf0e6" stroke="#c05621"/><text x="529.5" y="762">工作令</text><text x="529.5" y="783">监督执行</text>
