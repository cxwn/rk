  <line x1="280" y1="140" x2="285" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="285" y1="140" x2="285" y2="157" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="285,162 280.5,154 289.5,154" fill="#1f4e79"/>
  <text x="185" y="228" text-anchor="middle" font-size="10" fill="#6b7a8a">调用多个服务并合并结果，可再发布为高层服务</text>
  <rect x="380" y="55" width="310" height="190" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="535" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">链式模式</text>
