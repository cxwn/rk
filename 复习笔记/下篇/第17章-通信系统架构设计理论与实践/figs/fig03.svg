<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">5GS 与 DN 互连（教材图 17-11 重绘）</text>
  <rect x="110" y="60" width="360" height="150" rx="10" fill="#f7fafc" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="290" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">5G Network（5G 系统）</text>
  <rect x="20" y="110" width="70" height="40" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="55" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">UE</text>
  <text x="55" y="146" text-anchor="middle" font-size="10" fill="#4a6130">用户设备</text>
  <rect x="140" y="110" width="90" height="40" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="185" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">5G-AN</text>
  <text x="185" y="148" text-anchor="middle" font-size="10" fill="#1f4e79">接入网</text>
  <rect x="300" y="110" width="90" height="40" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="345" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">UPF</text>
  <text x="345" y="148" text-anchor="middle" font-size="10" fill="#c05621">用户面功能</text>
  <rect x="140" y="165" width="120" height="30" rx="5" fill="#ffffff" stroke="#6b7a8a" stroke-width="1"/>
  <text x="200" y="184" text-anchor="middle" font-size="10" fill="#22303f">SMF（会话管理）</text>
  <text x="405" y="184" text-anchor="middle" font-size="10" fill="#6b7a8a">AMF/PCF/NRF 等</text>
  <rect x="540" y="100" width="140" height="60" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="610" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">DN 数据网络</text>
  <text x="610" y="146" text-anchor="middle" font-size="10" fill="#22303f">Internet/IMS/专网</text>
  <line x1="90" y1="130" x2="129" y2="130" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="137,130 129,125.5 129,134.5" fill="#1f4e79"/>
  <line x1="230" y1="130" x2="289" y2="130" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="297,130 289,125.5 289,134.5" fill="#1f4e79"/>
  <line x1="390" y1="130" x2="529" y2="130" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="537,130 529,125.5 529,134.5" fill="#c05621"/>
  <text x="460" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">N6 接口</text>
  <line x1="260" y1="180" x2="345" y2="180" stroke="#6b7a8a" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <line x1="345" y1="180" x2="345" y2="161" stroke="#6b7a8a" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <polygon points="345,153 340.5,161 349.5,161" fill="#6b7a8a"/>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="#22303f">UPF 是 DN 的接入点，5GS 与 DN 之间是路由关系；UL＝UE→DN 上行，DL＝DN→UE 下行</text>
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#22303f">透明模式：UE 用运营商地址、不触发 DN-AAA；非透明模式：UE 用 Intranet/ISP 地址、SMF 触发认证</text>
</svg>
