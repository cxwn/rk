  <polygon points="197,165 189,160.5 189,169.5" fill="#1f4e79"/>
  <text x="162" y="152" font-size="12" fill="#1f4e79" font-weight="bold">①</text>
  <line x1="255" y1="140" x2="255" y2="101" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="255,93 250.5,101 259.5,101" fill="#c05621"/>
  <text x="265" y="122" font-size="12" fill="#c05621" font-weight="bold">②</text>
