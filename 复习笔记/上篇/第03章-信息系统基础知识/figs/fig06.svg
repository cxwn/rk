  <text x="195" y="412" text-anchor="middle" font-size="13" fill="#6b7a8a">下层数据量大，上层数据量小</text>
  <text x="195" y="438" text-anchor="middle" font-size="13" fill="#6b7a8a">职能条与管理层次纵横交织</text>
  <rect x="385" y="52" width="310" height="402" rx="10" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="540" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">功能／层次矩阵（简化）</text>
  <g stroke="#6b7a8a" stroke-width="1" fill="#ffffff">
    <rect x="400" y="105" width="100" height="52"/><rect x="500" y="105" width="60" height="52"/><rect x="560" y="105" width="60" height="52"/><rect x="620" y="105" width="60" height="52"/>
    <rect x="400" y="157" width="100" height="52"/><rect x="500" y="157" width="60" height="52"/><rect x="560" y="157" width="60" height="52"/><rect x="620" y="157" width="60" height="52"/>
    <rect x="400" y="209" width="100" height="52"/><rect x="500" y="209" width="60" height="52"/><rect x="560" y="209" width="60" height="52"/><rect x="620" y="209" width="60" height="52"/>
    <rect x="400" y="261" width="100" height="52"/><rect x="500" y="261" width="60" height="52"/><rect x="560" y="261" width="60" height="52"/><rect x="620" y="261" width="60" height="52"/>
    <rect x="400" y="313" width="100" height="52"/><rect x="500" y="313" width="60" height="52"/><rect x="560" y="313" width="60" height="52"/><rect x="620" y="313" width="60" height="52"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#22303f">
