<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">云-边-端协同计算架构</text>
  <rect x="100" y="46" width="520" height="68" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">云侧：高性能计算与知识存储</text>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#22303f">集中训练模型 · 汇聚协同经验 · 提供全局知识与策略</text>
  <line x1="250" y1="114" x2="250" y2="179" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="250,187 245.5,179 254.5,179" fill="#1f4e79"/>
  <line x1="470" y1="190" x2="470" y2="125" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="470,117 465.5,125 474.5,125" fill="#4a6130"/>
  <text x="360" y="145" text-anchor="middle" font-size="11" fill="#1f4e79">模型 / 知识 / 策略下发</text>
  <text x="360" y="171" text-anchor="middle" font-size="11" fill="#4a6130">数据 / 经验 / 状态上传</text>
  <rect x="70" y="190" width="580" height="86" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="217" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">边缘侧：数据处理、协同共享与任务承接</text>
  <text x="360" y="241" text-anchor="middle" font-size="12" fill="#22303f">就近处理实时数据 · 执行模型推理 · 协同多个机器人</text>
  <text x="360" y="263" text-anchor="middle" font-size="11" fill="#6b7a8a">降低云端传输压力与端侧计算负担</text>
  <line x1="250" y1="276" x2="250" y2="335" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="250,343 245.5,335 254.5,335" fill="#1f4e79"/>
  <line x1="470" y1="346" x2="470" y2="287" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="470,279 465.5,287 474.5,287" fill="#4a6130"/>
  <text x="360" y="307" text-anchor="middle" font-size="11" fill="#1f4e79">任务协同 / 应用部署</text>
  <text x="360" y="331" text-anchor="middle" font-size="11" fill="#4a6130">实时数据 / 协同经验</text>
  <rect x="40" y="346" width="640" height="106" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="360" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6130">机器人端：只完成实时操作，保留必要感知与控制能力</text>
  <rect x="90" y="388" width="140" height="44" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="160" y="416" text-anchor="middle" font-size="12" fill="#22303f">机器人 A</text>
  <rect x="290" y="388" width="140" height="44" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#22303f">机器人 B</text>
  <rect x="490" y="388" width="140" height="44" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="560" y="416" text-anchor="middle" font-size="12" fill="#22303f">机器人 C</text>
  <text x="360" y="480" text-anchor="middle" font-size="11" fill="#6b7a8a">动态任务迁移：按实时性、算力与负载，在云、边、端之间合理分配任务。</text>
</svg>
