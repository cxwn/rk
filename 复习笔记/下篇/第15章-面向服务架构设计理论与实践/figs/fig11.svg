  <rect x="45" y="91" width="75" height="34" rx="4" fill="#ffffff" stroke="#1f4e79"/>
  <rect x="155" y="91" width="150" height="34" rx="4" fill="#ffffff" stroke="#1f4e79"/>
  <text x="82" y="113" text-anchor="middle" font-size="11" fill="#22303f">客户端</text>
