  <text x="360" y="324" text-anchor="middle" font-size="10" fill="#6b7a8a">削峰有效，消费不足仍积压</text>
  <rect x="485" y="45" width="220" height="300" rx="8" fill="#f7fafc" stroke="#6b7a8a"/>
  <text x="595" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">③ 读写分离 + 分区</text>
