  <text x="360" y="94" text-anchor="middle" font-size="12" fill="#eaf1f8">MPU / MCU / DSP / SoC</text>
  <rect x="35" y="48" width="150" height="42" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
