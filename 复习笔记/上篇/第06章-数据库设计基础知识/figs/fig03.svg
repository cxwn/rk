  <line x1="520" y1="160" x2="520" y2="225" stroke="#c05621" stroke-width="1.5"/>
  <line x1="520" y1="225" x2="470" y2="225" stroke="#c05621" stroke-width="1.5"/>
  <line x1="470" y1="225" x2="470" y2="249" stroke="#c05621" stroke-width="1.5"/>
  <polygon points="470,257 465.5,249 474.5,249" fill="#c05621"/>
