  <text x="535" y="204" text-anchor="middle" font-size="10" fill="#6b7a8a">调用完成前持续阻塞，链不宜过长</text>
  <text x="535" y="226" text-anchor="middle" font-size="10" fill="#6b7a8a">响应逐级返回上游</text>
  <rect x="30" y="275" width="310" height="210" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
