<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7a8a"/>
    </marker>
  </defs>
  <!-- 客户需求 -->
  <g font-size="13" fill="#22303f">
    <rect x="70" y="20" width="120" height="42" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="130" y="46" text-anchor="middle">客户需求</text>
    <rect x="300" y="20" width="120" height="42" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="360" y="46" text-anchor="middle">客户需求</text>
    <rect x="530" y="20" width="120" height="42" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
    <text x="590" y="46" text-anchor="middle">客户需求</text>
  </g>
  <!-- 用户接口层 -->
  <rect x="40" y="98" width="640" height="46" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="360" y="127" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">用户接口层</text>
  <!-- 服务组件 -->
  <g>
    <rect x="60" y="216" width="140" height="96" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
    <text x="130" y="240" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">服务组件</text>
    <rect x="80" y="252" width="100" height="22" rx="3" fill="#ffffff" stroke="#8aa15c"/>
    <text x="130" y="268" font-size="11" fill="#22303f" text-anchor="middle">模块</text>
    <rect x="80" y="280" width="100" height="22" rx="3" fill="#ffffff" stroke="#8aa15c"/>
    <text x="130" y="296" font-size="11" fill="#22303f" text-anchor="middle">模块</text>
    <rect x="290" y="216" width="140" height="96" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
    <text x="360" y="240" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">服务组件</text>
    <rect x="310" y="252" width="100" height="22" rx="3" fill="#ffffff" stroke="#8aa15c"/>
    <text x="360" y="268" font-size="11" fill="#22303f" text-anchor="middle">模块</text>
    <rect x="310" y="280" width="100" height="22" rx="3" fill="#ffffff" stroke="#8aa15c"/>
    <text x="360" y="296" font-size="11" fill="#22303f" text-anchor="middle">模块</text>
    <rect x="520" y="216" width="140" height="96" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
    <text x="590" y="240" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">服务组件</text>
    <rect x="540" y="252" width="100" height="22" rx="3" fill="#ffffff" stroke="#8aa15c"/>
    <text x="590" y="268" font-size="11" fill="#22303f" text-anchor="middle">模块</text>
    <rect x="540" y="280" width="100" height="22" rx="3" fill="#ffffff" stroke="#8aa15c"/>
    <text x="590" y="296" font-size="11" fill="#22303f" text-anchor="middle">模块</text>
  </g>
  <!-- 需求 -> 用户接口层（顶缘三个独立连接点） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="130" y1="65" x2="130.0" y2="84.0"/>
    <polygon points="130.0,92.0 125.5,84.0 134.5,84.0" fill="#1f4e79"/>
    <line x1="360" y1="65" x2="360.0" y2="84.0"/>
    <polygon points="360.0,92.0 355.5,84.0 364.5,84.0" fill="#1f4e79"/>
    <line x1="590" y1="65" x2="590.0" y2="84.0"/>
    <polygon points="590.0,92.0 585.5,84.0 594.5,84.0" fill="#1f4e79"/>
  </g>
  <!-- 用户接口层 -> 服务组件（底缘三个独立连接点，直角折线） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="130" y1="147" x2="130.0" y2="202.0"/>
    <polygon points="130.0,210.0 125.5,202.0 134.5,202.0" fill="#1f4e79"/>
    <line x1="360" y1="147" x2="360.0" y2="202.0"/>
    <polygon points="360.0,210.0 355.5,202.0 364.5,202.0" fill="#1f4e79"/>
    <line x1="590" y1="147" x2="590.0" y2="202.0"/>
    <polygon points="590.0,210.0 585.5,202.0 594.5,202.0" fill="#1f4e79"/>
  </g>
  <!-- 服务组件之间的远程通信（虚线，止于组件边缘外侧） -->
  <g stroke="#6b7a8a" stroke-width="1.4" stroke-dasharray="5,3" fill="none">
    <line x1="203" y1="264" x2="276.0" y2="264.0"/>
    <polygon points="284.0,264.0 276.0,268.5 276.0,259.5" fill="#6b7a8a"/>
    <line x1="433" y1="264" x2="506.0" y2="264.0"/>
    <polygon points="514.0,264.0 506.0,268.5 506.0,259.5" fill="#6b7a8a"/>
  </g>
  <text x="360" y="344" font-size="12" fill="#6b7a8a" text-anchor="middle">每个服务都是独立的部署单元，分布式、互相解耦，通过 REST / SOAP 等远程通信协议联系（SOA 的升级）</text>
  <text x="360" y="366" font-size="12" fill="#6b7a8a" text-anchor="middle">实现模式：RESTful API（云服务）/ RESTful 应用（企业内部）/ 集中消息（消息代理需防单点失败）</text>
</svg>
