  <line x1="580" y1="250" x2="580" y2="90" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <line x1="580" y1="90" x2="468" y2="90" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
