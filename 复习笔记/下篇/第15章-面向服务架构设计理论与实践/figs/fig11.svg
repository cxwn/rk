  <text x="582" y="132" text-anchor="middle" font-size="11" fill="#22303f">服务 B</text>
  <text x="654" y="132" text-anchor="middle" font-size="11" fill="#22303f">服务 C</text>
  <line x1="454" y1="127" x2="466" y2="127" stroke="#c05621" stroke-width="1.5" fill="none"/>
