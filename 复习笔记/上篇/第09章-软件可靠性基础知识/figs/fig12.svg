<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" width="720" height="425" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="425" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">定义运行剖面：马尔可夫链建模</text>
  <text x="40" y="60" font-size="12.5" fill="#22303f">状态＝用户使用方式；弧＝激励导致的转换；弧上概率＝典型用户施加该激励的可能性</text>
  <rect x="30" y="110" width="104" height="46" rx="23" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="82" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">起飞</text>
  <rect x="170" y="110" width="104" height="46" rx="23" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="222" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">正常飞行</text>
  <rect x="310" y="110" width="104" height="46" rx="23" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="362" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">降落</text>
  <rect x="450" y="110" width="104" height="46" rx="23" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="502" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">地面运动</text>
  <rect x="590" y="110" width="104" height="46" rx="23" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="642" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">地面等待</text>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="134" y1="133" x2="159" y2="133"/>
    <line x1="274" y1="133" x2="299" y2="133"/>
    <line x1="414" y1="133" x2="439" y2="133"/>
    <line x1="554" y1="133" x2="579" y2="133"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="167,133 159,128.5 159,137.5"/>
    <polygon points="307,133 299,128.5 299,137.5"/>
    <polygon points="447,133 439,128.5 439,137.5"/>
    <polygon points="587,133 579,128.5 579,137.5"/>
  </g>
  <g font-size="11" fill="#6b7a8a" text-anchor="middle">
    <text x="152" y="122">0.9</text>
    <text x="292" y="122">0.8</text>
    <text x="432" y="122">1.0</text>
    <text x="572" y="122">0.7</text>
  </g>
  <text x="360" y="185" text-anchor="middle" font-size="12" fill="#c05621">起飞、降落：运行剖面占比小却故障占比大，高安全软件应单独构造运行剖面（概率仅示意）</text>
  <rect x="40" y="215" width="310" height="95" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="195" y="241" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">用户级分层</text>
  <text x="195" y="267" text-anchor="middle" font-size="12" fill="#22303f">按“谁或什么能激励系统”分层</text>
  <text x="195" y="289" text-anchor="middle" font-size="12" fill="#22303f">考虑各类用户及其使用方式</text>
  <rect x="370" y="215" width="310" height="95" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="525" y="241" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">用法级分层</text>
  <text x="525" y="267" text-anchor="middle" font-size="12" fill="#22303f">按“测试状态下系统能做什么”分层</text>
  <text x="525" y="289" text-anchor="middle" font-size="12" fill="#22303f">考虑系统能够提供的所有功能</text>
  <rect x="40" y="335" width="640" height="70" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="360" y="359" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">弧上概率的估计来源（优先级从高到低）</text>
  <text x="360" y="385" text-anchor="middle" font-size="12" fill="#22303f">① 实际用户数据（原型、上一版本）＞ ② 用户与专家预期数据 ＞ ③ 各弧等概率（最差）</text>
</svg>
