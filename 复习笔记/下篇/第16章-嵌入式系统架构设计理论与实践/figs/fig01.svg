  <line x1="360" y1="106" x2="360" y2="139" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,147 355.5,139 364.5,139" fill="#1f4e79"/>
  <rect x="180" y="150" width="360" height="38" rx="5" fill="#1f4e79"/>
  <text x="360" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">高性能总线（仲裁器）</text>
  <rect x="300" y="208" width="120" height="38" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
