<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">系统架构评估的三类方法</text>
  <rect x="35" y="70" width="200" height="240" rx="10" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <rect x="260" y="70" width="200" height="240" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <rect x="485" y="70" width="200" height="240" rx="10" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="135" y="105" text-anchor="middle" font-size="18" font-weight="bold" fill="#c05621">问卷 / 检查表</text>
  <text x="360" y="105" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">基于场景</text>
  <text x="585" y="105" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a6130">基于度量</text>
  <g font-size="14">
    <text x="55" y="145">• 设计问题与检查项</text><text x="55" y="176">• 汇集相关人员经验</text><text x="55" y="207">• 实施简单、直观</text>
    <text x="55" y="253" fill="#c05621">局限：较依赖主观推断</text>
    <text x="280" y="145">• 描述使用或修改活动</text><text x="280" y="176">• 分析架构支持程度</text><text x="280" y="207">• 判断质量需求满足度</text>
    <text x="280" y="253" fill="#1f4e79">代表：SAAM、ATAM</text>
    <text x="505" y="138">1. 建质量属性—度量映射</text><text x="505" y="176">2. 从架构文档取度量</text><text x="505" y="214">3. 映射推导质量属性</text>
    <text x="505" y="253" fill="#4a6130">关键：映射原则与数据</text>
  </g>
  <rect x="35" y="335" width="650" height="35" rx="6" fill="#eaf1f8"/>
  <text x="360" y="358" text-anchor="middle" font-size="14" fill="#1f4e79">评估目的：为架构策略选择提供描述性、预测性和指令性依据</text>
</svg>
