<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Kappa 两种常见变形（教材图 19-11、19-12 重绘）</text>
  <rect x="20" y="45" width="680" height="175" rx="8" fill="#f7fafc" stroke="#6b7a8a"/>
  <text x="360" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">① Kappa+：HDFS / Hudi 直接支撑历史 backfill</text>
  <rect x="40" y="90" width="120" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="100" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6130">Kafka 日志</text>
  <text x="100" y="130" text-anchor="middle" font-size="10" fill="#22303f">实时数据入口</text>
  <line x1="160" y1="115" x2="202" y2="115" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="210,115 202,110.5 202,119.5" fill="#1f4e79"/>
  <rect x="215" y="90" width="145" height="50" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="287" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f4e79">HDFS / Hudi</text>
  <text x="287" y="130" text-anchor="middle" font-size="10" fill="#22303f">时间分区仓库数据</text>
  <line x1="360" y1="115" x2="402" y2="115" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="410,115 402,110.5 402,119.5" fill="#1f4e79"/>
  <rect x="415" y="90" width="110" height="50" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="470" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">Spark</text>
  <text x="470" y="130" text-anchor="middle" font-size="10" fill="#22303f">实时 + 历史</text>
  <line x1="525" y1="115" x2="567" y2="115" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="575,115 567,110.5 567,119.5" fill="#1f4e79"/>
  <rect x="580" y="90" width="100" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="630" y="120" text-anchor="middle" font-size="11" fill="#4a6130">用户查询</text>
  <text x="360" y="169" text-anchor="middle" font-size="11" fill="#22303f">窗口任务按时间分区依次计算，分区内可并发，完成后推进 watermark</text>
  <text x="360" y="195" text-anchor="middle" font-size="10" fill="#4a6130">收益：无须为 backfill 长期保存全部 MQ 日志或把仓库数据拷回消息队列</text>
  <rect x="20" y="240" width="680" height="175" rx="8" fill="#f7fafc" stroke="#6b7a8a"/>
  <text x="360" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">② 混合分析：Flink 流算后接 ElasticSearch 补展示层</text>
  <rect x="30" y="285" width="100" height="50" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="80" y="315" text-anchor="middle" font-size="11" fill="#22303f">数据源</text>
  <line x1="130" y1="310" x2="157" y2="310" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="165,310 157,305.5 157,314.5" fill="#1f4e79"/>
  <rect x="170" y="285" width="100" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="220" y="315" text-anchor="middle" font-size="11" fill="#4a6130">Kafka</text>
  <line x1="270" y1="310" x2="297" y2="310" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="305,310 297,305.5 297,314.5" fill="#1f4e79"/>
  <rect x="310" y="285" width="100" height="50" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="360" y="315" text-anchor="middle" font-size="11" fill="#c05621">Flink</text>
  <line x1="410" y1="310" x2="437" y2="310" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="445,310 437,305.5 437,314.5" fill="#1f4e79"/>
  <rect x="450" y="285" width="115" height="50" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="507" y="315" text-anchor="middle" font-size="11" fill="#1f4e79">ElasticSearch</text>
  <line x1="565" y1="310" x2="587" y2="310" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="595,310 587,305.5 587,314.5" fill="#1f4e79"/>
  <rect x="600" y="285" width="90" height="50" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="645" y="306" text-anchor="middle" font-size="10" fill="#4a6130">热点检索</text>
  <text x="645" y="325" text-anchor="middle" font-size="10" fill="#4a6130">实时分析</text>
  <text x="360" y="365" text-anchor="middle" font-size="11" fill="#22303f">定位：Kappa 与 Lambda 之间的折中，增强热点数据的索引与展示能力</text>
  <text x="360" y="393" text-anchor="middle" font-size="10" fill="#c05621">限制：ES 只适合合理量级的热点数据，不能替代全部历史批处理分析</text>
</svg>