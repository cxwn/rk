  <text x="70" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#22303f">APP</text>
  <text x="70" y="110" text-anchor="middle" font-size="10" fill="#22303f">Bin/Library</text>
  <rect x="125" y="56" width="100" height="76" rx="5" fill="#f4f6f8" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="175" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#22303f">APP</text>
  <text x="175" y="110" text-anchor="middle" font-size="10" fill="#22303f">Bin/Library</text>
