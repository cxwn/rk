  <line x1="585" y1="199" x2="597" y2="199" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="605,199 597,194.5 597,203.5" fill="#8aa15c"/>
  <line x1="540" y1="218" x2="540" y2="254" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="540,262 535.5,254 544.5,254" fill="#1f4e79"/>
  <line x1="650" y1="218" x2="650" y2="254" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="650,262 645.5,254 654.5,254" fill="#1f4e79"/>
  <rect x="495" y="265" width="90" height="36" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="540" y="288" text-anchor="middle" font-size="10" fill="#22303f">Hash 分区</text>
  <rect x="605" y="265" width="90" height="36" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="650" y="288" text-anchor="middle" font-size="10" fill="#22303f">复制副本</text>
  <text x="595" y="325" text-anchor="middle" font-size="10" fill="#c05621">reshard、迁移与路由复杂</text>
  <text x="360" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">结论：队列、分区、复制能缓压，却把分布式协调与运维复杂性推给应用</text>
</svg>