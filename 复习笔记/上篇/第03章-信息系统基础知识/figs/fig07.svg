  <rect x="95" y="230" width="180" height="60" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="185" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">管理者</text>
  <text x="185" y="276" text-anchor="middle" font-size="12" fill="#22303f">知识、经验与判断</text>
  <rect x="85" y="365" width="200" height="55" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="185" y="398" text-anchor="middle" font-size="15" fill="#4a6130">决策支持系统（DSS）</text>
  <line x1="140" y1="157" x2="140" y2="217" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="140,227 135.5,219 144.5,219" fill="#1f4e79"/>
  <text x="105" y="197" text-anchor="middle" font-size="12" fill="#6b7a8a">决策问题</text>
  <line x1="240" y1="230" x2="240" y2="170" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="240,160 235.5,168 244.5,168" fill="#c05621"/>
