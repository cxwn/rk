<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">DNS 欺骗</text>
  <rect x="40" y="120" width="160" height="60" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="120" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f4e79">查询主机</text>
  <text x="120" y="168" text-anchor="middle" font-size="11.5" fill="#22303f">www.angel.com</text>
  <rect x="270" y="40" width="180" height="60" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">xxx.com 子域 DNS</text>
  <text x="360" y="88" text-anchor="middle" font-size="10.5" fill="#22303f">www.xxx.com=202.109.2.2</text>
  <rect x="530" y="40" width="160" height="60" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="610" y="64" text-anchor="middle" font-size="12" fill="#22303f">真实网站</text>
  <text x="610" y="88" text-anchor="middle" font-size="11" fill="#6b7a8a">www.xxx.com</text>
  <rect x="270" y="200" width="180" height="60" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c05621">攻击者 www.heike.com</text>
  <text x="360" y="248" text-anchor="middle" font-size="11" fill="#c05621">冒充 DNS 应答</text>
  <rect x="530" y="200" width="160" height="60" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="610" y="224" text-anchor="middle" font-size="12" fill="#c05621">虚假站点</text>
  <text x="610" y="248" text-anchor="middle" font-size="11" fill="#c05621">IP: 200.1.1.1</text>
  <text x="185" y="56" text-anchor="middle" font-size="11" fill="#22303f">① 查询 www.xxx.com</text>
  <polyline points="120,120 120,70 259,70" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="267,70 259,65.5 259,74.5" fill="#1f4e79"/>
  <text x="488" y="56" text-anchor="middle" font-size="10.5" fill="#6b7a8a">真实 IP</text>
  <line x1="450" y1="70" x2="519" y2="70" stroke="#6b7a8a" stroke-width="1.2" fill="none"/>
  <polygon points="527,70 519,65.5 519,74.5" fill="#6b7a8a"/>
  <text x="190" y="220" text-anchor="middle" font-size="11" fill="#c05621">② 假应答 200.1.1.1</text>
  <polyline points="270,230 120,230 120,191" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="120,183 115.5,191 124.5,191" fill="#c05621"/>
  <text x="405" y="140" text-anchor="middle" font-size="11" fill="#1f4e79">③ 访问被引向虚假站点 200.1.1.1</text>
  <polyline points="200,150 610,150 610,189" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="610,197 605.5,189 614.5,189" fill="#1f4e79"/>
  <text x="360" y="296" text-anchor="middle" font-size="11.5" fill="#6b7a8a">检测：被动监听（一个请求多个不同应答）、虚假报文探测（向非 DNS 发请求）、交叉检查（反向查询核对）</text>
</svg>
