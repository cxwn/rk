<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">机器人三代演进与机器人 4.0 五大核心技术</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#6b7a8a">三代演进：环境感知与自主决策能力逐步增强</text>
  <rect x="30" y="66" width="200" height="112" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="130" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">第一代</text>
  <text x="130" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#22303f">示教再现型</text>
  <text x="130" y="135" text-anchor="middle" font-size="11" fill="#22303f">示教存储程序和信息</text>
  <text x="130" y="154" text-anchor="middle" font-size="11" fill="#22303f">重复动作 · 无环境感知</text>
  <text x="130" y="171" text-anchor="middle" font-size="10" fill="#6b7a8a">例：汽车点焊机器人</text>
  <line x1="230" y1="122" x2="249" y2="122" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="257,122 249,117.5 249,126.5" fill="#1f4e79"/>
  <rect x="260" y="66" width="200" height="112" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="360" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6130">第二代</text>
  <text x="360" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#22303f">感觉型</text>
  <text x="360" y="135" text-anchor="middle" font-size="11" fill="#22303f">力觉 · 触觉 · 视觉 · 听觉</text>
  <text x="360" y="154" text-anchor="middle" font-size="11" fill="#22303f">能感受和识别工件</text>
  <text x="360" y="171" text-anchor="middle" font-size="10" fill="#6b7a8a">20 世纪 70 年代后期起</text>
  <line x1="460" y1="122" x2="479" y2="122" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="487,122 479,117.5 479,126.5" fill="#1f4e79"/>
  <rect x="490" y="66" width="200" height="112" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="590" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05621">第三代</text>
  <text x="590" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#22303f">智能型</text>
  <text x="590" y="135" text-anchor="middle" font-size="11" fill="#22303f">多种传感器 · 复杂逻辑推理</text>
  <text x="590" y="154" text-anchor="middle" font-size="11" fill="#22303f">自主判断、决策与行动</text>
  <text x="590" y="171" text-anchor="middle" font-size="10" fill="#6b7a8a">20 世纪 90 年代以来</text>
  <line x1="590" y1="178" x2="590" y2="195" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="590,203 585.5,195 594.5,195" fill="#c05621"/>
  <rect x="30" y="206" width="660" height="44" rx="6" fill="#1f4e79"/>
  <text x="360" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">机器人 4.0：云端大脑分布部署 · 边缘计算赋能 · 理解决策 · 少量数据学习</text>
  <line x1="84" y1="250" x2="84" y2="281" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="84,289 79.5,281 88.5,281" fill="#6b7a8a"/>
  <line x1="222" y1="250" x2="222" y2="281" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <polygon points="222,289 217.5,281 226.5,281" fill="#6b7a8a"/>
