<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">软件架构可持续演化 18 原则分组</text>
  <rect x="30" y="60" width="320" height="125" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="190" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">成本、进度与风险</text>
  <text x="55" y="122" font-size="14" fill="#22303f">1 演化成本控制 ECC</text>
  <text x="55" y="148" font-size="14" fill="#22303f">2 进度可控　3 风险可控</text>
  <text x="55" y="172" font-size="12" fill="#6b7a8a">先判断演化是否值得、能否如期完成</text>
  <rect x="370" y="60" width="320" height="125" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="530" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">主体、结构与目标</text>
  <text x="395" y="120" font-size="14" fill="#22303f">4 主体维持　5 总体结构优化</text>
  <text x="395" y="146" font-size="14" fill="#22303f">6 平滑演化 IWR　7 目标一致</text>
  <text x="395" y="172" font-size="12" fill="#6b7a8a">主体稳、增量稳，阶段目标服务最终目标</text>
  <rect x="30" y="210" width="320" height="125" rx="8" fill="#fdf0e6" stroke="#c05621"/>
  <text x="190" y="240" text-anchor="middle" font-size="17" font-weight="bold" fill="#c05621">模块影响与复杂性</text>
  <text x="55" y="272" font-size="14" fill="#22303f">8 模块独立演化（修改局部化）</text>
  <text x="55" y="298" font-size="14" fill="#22303f">9 影响可控　10 复杂性可控</text>
  <text x="55" y="322" font-size="12" fill="#6b7a8a">修改范围可预测，复杂度增长受控</text>
  <rect x="370" y="210" width="320" height="125" rx="8" fill="#fdf0e6" stroke="#c05621"/>
  <text x="530" y="240" text-anchor="middle" font-size="17" font-weight="bold" fill="#c05621">重构、重用与设计</text>
  <text x="395" y="272" font-size="14" fill="#22303f">11 有利于重构　12 有利于重用</text>
  <text x="395" y="298" font-size="14" fill="#22303f">13 设计原则遵从性</text>
  <text x="395" y="322" font-size="12" fill="#6b7a8a">高内聚低耦合，不破坏好的设计经验</text>
  <rect x="30" y="360" width="320" height="125" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="190" y="390" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6130">技术、环境与标准</text>
  <text x="55" y="422" font-size="14" fill="#22303f">14 适应新技术（技术独立性）</text>
  <text x="55" y="448" font-size="14" fill="#22303f">15 环境适应性　16 标准依从性</text>
  <text x="55" y="472" font-size="12" fill="#6b7a8a">降低技术依赖，兼容环境并遵循标准</text>
  <rect x="370" y="360" width="320" height="125" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="530" y="390" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6130">质量与新需求</text>
  <text x="395" y="422" font-size="14" fill="#22303f">17 质量向好 QI</text>
  <text x="395" y="448" font-size="14" fill="#22303f">18 适应新需求</text>
  <text x="395" y="472" font-size="12" fill="#6b7a8a">演化后质量更好，适应变化能力不降低</text>
  <text x="360" y="508" text-anchor="middle" font-size="13" fill="#6b7a8a">记忆主线：控成本 → 稳主体 → 限影响 → 易重构 → 适环境 → 提质量</text>
</svg>
