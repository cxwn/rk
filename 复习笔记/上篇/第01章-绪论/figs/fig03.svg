<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
  </defs>
  <!-- 表现层 -->
  <rect x="60" y="24" width="600" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="150" y="62" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">表现层</text>
  <g font-size="12" fill="#22303f">
    <rect x="270" y="42" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="320" y="61" text-anchor="middle">组件</text>
    <rect x="400" y="42" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="450" y="61" text-anchor="middle">组件</text>
    <rect x="530" y="42" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="580" y="61" text-anchor="middle">组件</text>
  </g>
  <text x="150" y="82" font-size="11" fill="#6b7a8a" text-anchor="middle">用户界面与互动</text>
  <!-- 业务层 -->
  <rect x="60" y="112" width="600" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="150" y="150" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">业务层</text>
  <g font-size="12" fill="#22303f">
    <rect x="270" y="130" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="320" y="149" text-anchor="middle">组件</text>
    <rect x="400" y="130" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="450" y="149" text-anchor="middle">组件</text>
    <rect x="530" y="130" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="580" y="149" text-anchor="middle">组件</text>
  </g>
  <text x="150" y="170" font-size="11" fill="#6b7a8a" text-anchor="middle">实现业务逻辑</text>
  <!-- 持久层 -->
  <rect x="60" y="200" width="600" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="150" y="238" font-size="16" font-weight="bold" fill="#1f4e79" text-anchor="middle">持久层</text>
  <g font-size="12" fill="#22303f">
    <rect x="270" y="218" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="320" y="237" text-anchor="middle">组件</text>
    <rect x="400" y="218" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="450" y="237" text-anchor="middle">组件</text>
    <rect x="530" y="218" width="100" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="580" y="237" text-anchor="middle">组件</text>
  </g>
  <text x="150" y="258" font-size="11" fill="#6b7a8a" text-anchor="middle">提供数据（SQL）</text>
  <!-- 数据库层 -->
  <rect x="60" y="288" width="600" height="64" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="150" y="326" font-size="16" font-weight="bold" fill="#4a6130" text-anchor="middle">数据库</text>
  <text x="450" y="326" font-size="13" fill="#22303f" text-anchor="middle">保存数据</text>
  <!-- 层间箭头：逐层调用，独立三段 -->
  <g stroke="#1f4e79" stroke-width="1.6">
    <line x1="360" y1="91" x2="360.0" y2="98.0"/>
    <polygon points="360.0,106.0 355.5,98.0 364.5,98.0" fill="#1f4e79"/>
    <line x1="360" y1="179" x2="360.0" y2="186.0"/>
    <polygon points="360.0,194.0 355.5,186.0 364.5,186.0" fill="#1f4e79"/>
    <line x1="360" y1="267" x2="360.0" y2="274.0"/>
    <polygon points="360.0,282.0 355.5,274.0 364.5,274.0" fill="#1f4e79"/>
  </g>
  <!-- 底部说明 -->
  <text x="360" y="382" font-size="12" fill="#c05621" text-anchor="middle">用户请求依次通过各层处理，不能跳过其中任何一层（层间通过接口通信）</text>
</svg>
