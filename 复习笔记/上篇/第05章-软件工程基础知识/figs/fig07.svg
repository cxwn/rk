<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 355" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="355" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">DFD 四种基本元素：以“办理借阅”为例</text>
  <g text-anchor="middle">
    <rect x="30" y="125" width="130" height="80" rx="18" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
    <text x="95" y="158" font-size="18" font-weight="bold" fill="#c05621">读者</text><text x="95" y="183" font-size="13" fill="#22303f">外部项</text>
    <rect x="270" y="125" width="160" height="80" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="350" y="158" font-size="18" font-weight="bold" fill="#1f4e79">办理借阅</text><text x="350" y="183" font-size="13" fill="#22303f">处理 / 加工</text>
    <rect x="540" y="125" width="150" height="80" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
    <line x1="540" y1="133" x2="690" y2="133" stroke="#4a6130" stroke-width="1"/>
    <text x="615" y="158" font-size="18" font-weight="bold" fill="#4a6130">借阅记录</text><text x="615" y="183" font-size="13" fill="#22303f">数据存储</text>
  </g>
  <line x1="160" y1="165" x2="259" y2="165" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="267,165 259,160.5 259,169.5" fill="#1f4e79"/>
  <rect x="177" y="137" width="86" height="22" fill="#ffffff"/>
  <text x="220" y="153" text-anchor="middle" font-size="14" fill="#22303f">借阅请求</text>
  <line x1="430" y1="155" x2="529" y2="155" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="537,155 529,150.5 529,159.5" fill="#1f4e79"/>
  <rect x="444" y="126" width="86" height="22" fill="#ffffff"/>
  <text x="487" y="142" text-anchor="middle" font-size="14" fill="#22303f">写入记录</text>
  <path d="M615 205 V250 H350 V216" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="350,208 345.5,216 354.5,216" fill="#4a6130"/>
  <rect x="421" y="226" width="128" height="22" fill="#ffffff"/>
  <text x="485" y="242" text-anchor="middle" font-size="14" fill="#4a6130">读取可借状态</text>
  <line x1="75" y1="294" x2="139" y2="294" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="147,294 139,289.5 139,298.5" fill="#1f4e79"/>
  <text x="160" y="300" font-size="14" fill="#22303f">数据流：带名称的箭头，至少一端连接处理</text>
  <text x="360" y="337" text-anchor="middle" font-size="14" fill="#6b7a8a">外部项提供或使用数据｜处理转换数据｜数据存储保存数据</text>
</svg>
