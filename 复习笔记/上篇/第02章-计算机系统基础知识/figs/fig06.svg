<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 应用软件层 -->
  <rect x="60" y="30" width="600" height="60" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="360" y="66" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">应用软件（多种应用）</text>
  <!-- 中间件层 -->
  <rect x="60" y="126" width="600" height="60" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="360" y="152" font-size="15" font-weight="bold" fill="#c05621" text-anchor="middle">中间件（分布式系统服务）</text>
  <text x="360" y="172" font-size="11" fill="#22303f" text-anchor="middle">标准化编程接口与协议，属于可复用基础软件</text>
  <!-- 操作系统/网络/数据库层 -->
  <rect x="60" y="222" width="600" height="60" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="258" font-size="15" font-weight="bold" fill="#4a6130" text-anchor="middle">操作系统 ｜ 网络、数据库</text>
  <!-- 承上启下箭头（两条独立竖线，双向语义） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="240" y1="93" x2="240" y2="118"/>
    <polygon points="240,123 235.5,115 244.5,115" fill="#1f4e79"/>
    <line x1="480" y1="93" x2="480" y2="118"/>
    <polygon points="480,123 475.5,115 484.5,115" fill="#1f4e79"/>
    <line x1="240" y1="189" x2="240" y2="214"/>
    <polygon points="240,219 235.5,211 244.5,211" fill="#1f4e79"/>
    <line x1="480" y1="189" x2="480" y2="214"/>
    <polygon points="480,219 475.5,211 484.5,211" fill="#1f4e79"/>
  </g>
  <text x="360" y="314" font-size="12" fill="#6b7a8a" text-anchor="middle">承上启下：使应用开发独立于计算机硬件和操作系统，并能在不同系统上运行相同应用功能</text>
</svg>
