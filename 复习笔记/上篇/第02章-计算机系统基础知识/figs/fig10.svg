<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 星状 -->
  <g stroke="#1f4e79" stroke-width="1.3">
    <line x1="160" y1="100" x2="220" y2="100"/>
    <line x1="160" y1="100" x2="190" y2="148"/>
    <line x1="160" y1="100" x2="130" y2="148"/>
    <line x1="160" y1="100" x2="100" y2="100"/>
    <line x1="160" y1="100" x2="130" y2="52"/>
    <line x1="160" y1="100" x2="190" y2="52"/>
  </g>
  <circle cx="160" cy="100" r="9" fill="#c05621"/>
  <g fill="#1f4e79">
    <circle cx="220" cy="100" r="8"/>
    <circle cx="190" cy="148" r="8"/>
    <circle cx="130" cy="148" r="8"/>
    <circle cx="100" cy="100" r="8"/>
    <circle cx="130" cy="52" r="8"/>
    <circle cx="190" cy="52" r="8"/>
  </g>
  <text x="160" y="196" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">星状结构</text>
  <text x="160" y="216" font-size="10" fill="#6b7a8a" text-anchor="middle">中心结点故障则全网瘫痪</text>
  <!-- 树状 -->
  <g stroke="#1f4e79" stroke-width="1.3">
    <line x1="520" y1="40" x2="455" y2="100"/>
    <line x1="520" y1="40" x2="585" y2="100"/>
    <line x1="455" y1="100" x2="420" y2="155"/>
    <line x1="455" y1="100" x2="490" y2="155"/>
    <line x1="585" y1="100" x2="550" y2="155"/>
    <line x1="585" y1="100" x2="620" y2="155"/>
  </g>
  <circle cx="520" cy="40" r="9" fill="#c05621"/>
  <g fill="#3a6b99">
    <circle cx="455" cy="100" r="8"/>
    <circle cx="585" cy="100" r="8"/>
  </g>
  <g fill="#1f4e79">
    <circle cx="420" cy="155" r="8"/>
    <circle cx="490" cy="155" r="8"/>
    <circle cx="550" cy="155" r="8"/>
    <circle cx="620" cy="155" r="8"/>
  </g>
  <text x="520" y="196" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">树状结构</text>
  <text x="520" y="216" font-size="10" fill="#6b7a8a" text-anchor="middle">除叶结点及链路外，故障影响全网</text>
  <!-- 总线 -->
  <line x1="50" y1="300" x2="270" y2="300" stroke="#c05621" stroke-width="4"/>
  <g stroke="#1f4e79" stroke-width="1.3">
    <line x1="80" y1="300" x2="80" y2="352"/>
    <line x1="130" y1="300" x2="130" y2="352"/>
    <line x1="180" y1="300" x2="180" y2="352"/>
    <line x1="230" y1="300" x2="230" y2="352"/>
  </g>
  <g fill="#1f4e79">
    <circle cx="80" cy="360" r="8"/>
    <circle cx="130" cy="360" r="8"/>
    <circle cx="180" cy="360" r="8"/>
    <circle cx="230" cy="360" r="8"/>
  </g>
  <text x="160" y="400" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">总线结构</text>
  <text x="160" y="420" font-size="10" fill="#6b7a8a" text-anchor="middle">总线故障影响总线上每个结点</text>
  <!-- 环形 -->
  <g stroke="#1f4e79" stroke-width="1.3" fill="none">
    <line x1="580" y1="300" x2="550" y2="348"/>
    <line x1="550" y1="348" x2="490" y2="348"/>
    <line x1="490" y1="348" x2="460" y2="300"/>
    <line x1="460" y1="300" x2="490" y2="252"/>
    <line x1="490" y1="252" x2="550" y2="252"/>
    <line x1="550" y1="252" x2="580" y2="300"/>
  </g>
  <g fill="#1f4e79">
    <circle cx="580" cy="300" r="8"/>
    <circle cx="550" cy="348" r="8"/>
    <circle cx="490" cy="348" r="8"/>
    <circle cx="460" cy="300" r="8"/>
    <circle cx="490" cy="252" r="8"/>
    <circle cx="550" cy="252" r="8"/>
  </g>
  <text x="520" y="400" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">环形结构</text>
  <text x="520" y="420" font-size="10" fill="#6b7a8a" text-anchor="middle">单向流动，任一结点故障导致瘫痪</text>
  <!-- 网状 -->
  <g stroke="#6b7a8a" stroke-width="1.1">
    <line x1="260" y1="480" x2="460" y2="480"/>
    <line x1="260" y1="580" x2="460" y2="580"/>
    <line x1="260" y1="480" x2="260" y2="580"/>
    <line x1="460" y1="480" x2="460" y2="580"/>
    <line x1="260" y1="480" x2="460" y2="580"/>
    <line x1="460" y1="480" x2="260" y2="580"/>
    <line x1="360" y1="530" x2="260" y2="480"/>
    <line x1="360" y1="530" x2="460" y2="480"/>
    <line x1="360" y1="530" x2="260" y2="580"/>
    <line x1="360" y1="530" x2="460" y2="580"/>
  </g>
  <g fill="#1f4e79">
    <circle cx="260" cy="480" r="8"/>
    <circle cx="460" cy="480" r="8"/>
    <circle cx="260" cy="580" r="8"/>
    <circle cx="460" cy="580" r="8"/>
    <circle cx="360" cy="530" r="8" fill="#c05621"/>
  </g>
  <text x="360" y="624" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">网状结构</text>
  <text x="360" y="644" font-size="10" fill="#6b7a8a" text-anchor="middle">任一结点故障不影响其他结点通信，但布线烦琐、成本高</text>
</svg>
