<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">SOA 实施路线：方案选择 → 服务建模 → 流程建模 → 持续治理</text>
  <rect x="20" y="65" width="155" height="200" rx="8" fill="#f4f6f8" stroke="#6b7a8a" stroke-width="1.5"/>
  <text x="97" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">① 选择方案</text>
  <text x="97" y="132" text-anchor="middle" font-size="11" fill="#22303f">全局规划</text>
  <text x="97" y="160" text-anchor="middle" font-size="11" fill="#22303f">符合自身需求</text>
  <text x="97" y="188" text-anchor="middle" font-size="11" fill="#22303f">平台与标准</text>
  <text x="97" y="216" text-anchor="middle" font-size="11" fill="#22303f">实施与供应商</text>
  <text x="97" y="246" text-anchor="middle" font-size="10" fill="#6b7a8a">先盘点资产与投入</text>
  <rect x="195" y="65" width="155" height="200" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="272" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">② 建立服务模型</text>
  <text x="272" y="132" text-anchor="middle" font-size="11" fill="#22303f">自顶向下：业务</text>
  <text x="272" y="160" text-anchor="middle" font-size="11" fill="#22303f">目标分析：KPI</text>
  <text x="272" y="188" text-anchor="middle" font-size="11" fill="#22303f">自底向上：资产</text>
  <text x="272" y="216" text-anchor="middle" font-size="11" fill="#22303f">变化分析与归类</text>
  <text x="272" y="246" text-anchor="middle" font-size="10" fill="#1f4e79">形成层次化服务目录</text>
  <rect x="370" y="65" width="155" height="200" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="447" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">③ 建立业务流程</text>
  <text x="447" y="132" text-anchor="middle" font-size="11" fill="#22303f">业务对象</text>
  <text x="447" y="153" text-anchor="middle" font-size="10" fill="#6b7a8a">实体 / 过程 / 事件</text>
  <text x="447" y="184" text-anchor="middle" font-size="11" fill="#22303f">语义相关服务接口</text>
  <text x="447" y="212" text-anchor="middle" font-size="11" fill="#22303f">子流程与控制流</text>
  <text x="447" y="246" text-anchor="middle" font-size="10" fill="#4a6130">复用流程元素</text>
  <rect x="545" y="65" width="155" height="200" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="622" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">④ 运行与优化</text>
  <text x="622" y="132" text-anchor="middle" font-size="11" fill="#22303f">注册 · 绑定 · 部署</text>
  <text x="622" y="160" text-anchor="middle" font-size="11" fill="#22303f">安全 · 可靠 · 事务</text>
  <text x="622" y="188" text-anchor="middle" font-size="11" fill="#22303f">事件采集与 KPI</text>
  <text x="622" y="216" text-anchor="middle" font-size="11" fill="#22303f">监控反馈重构流程</text>
  <text x="622" y="246" text-anchor="middle" font-size="10" fill="#c05621">治理贯穿生命周期</text>
  <line x1="175" y1="165" x2="187" y2="165" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="192,165 184,160.5 184,169.5" fill="#1f4e79"/>
  <line x1="350" y1="165" x2="362" y2="165" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="367,165 359,160.5 359,169.5" fill="#1f4e79"/>
  <line x1="525" y1="165" x2="537" y2="165" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="542,165 534,160.5 534,169.5" fill="#1f4e79"/>
  <rect x="75" y="290" width="570" height="32" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="360" y="311" text-anchor="middle" font-size="11" fill="#1f4e79">三种服务发现方法互补使用；接口优先无状态，外部粗粒度、内部可细粒度</text>
</svg>
