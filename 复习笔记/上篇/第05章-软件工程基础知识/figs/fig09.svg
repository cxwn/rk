<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">E-R 图：实体、属性与多对多联系</text>
  <rect x="50" y="130" width="140" height="60" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.8"/>
  <text x="120" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">学生</text>
  <rect x="530" y="130" width="140" height="60" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.8"/>
  <text x="600" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">课程</text>
  <polygon points="360,112 442,160 360,208 278,160" fill="#fdf0e6" stroke="#c05621" stroke-width="1.8"/>
  <text x="360" y="167" text-anchor="middle" font-size="20" font-weight="bold" fill="#c05621">选修</text>
  <ellipse cx="120" cy="65" rx="55" ry="25" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="120" y="71" text-anchor="middle" font-size="17" fill="#4a6130">学号</text>
  <line x1="101" y1="77" x2="139" y2="77" stroke="#4a6130" stroke-width="1.2"/>
  <ellipse cx="600" cy="65" rx="55" ry="25" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="600" y="71" text-anchor="middle" font-size="17" fill="#4a6130">课程号</text>
  <line x1="576" y1="77" x2="624" y2="77" stroke="#4a6130" stroke-width="1.2"/>
  <ellipse cx="360" cy="280" rx="55" ry="25" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="360" y="286" text-anchor="middle" font-size="17" fill="#4a6130">成绩</text>
  <g stroke="#6b7a8a" stroke-width="1.5" fill="none">
    <line x1="190" y1="160" x2="278" y2="160"/><line x1="442" y1="160" x2="530" y2="160"/>
    <line x1="120" y1="90" x2="120" y2="130"/><line x1="600" y1="90" x2="600" y2="130"/>
    <line x1="360" y1="208" x2="360" y2="255"/>
  </g>
  <text x="234" y="147" text-anchor="middle" font-size="17" font-weight="bold" fill="#22303f">M</text>
  <text x="486" y="147" text-anchor="middle" font-size="17" font-weight="bold" fill="#22303f">N</text>
  <text x="375" y="235" font-size="12" fill="#6b7a8a">联系的属性</text>
  <text x="360" y="335" text-anchor="middle" font-size="15" fill="#c05621">“成绩”同时依赖学生与课程，因此属于“选修”联系</text>
</svg>
