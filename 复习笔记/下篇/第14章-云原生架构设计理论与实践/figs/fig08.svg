<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 集群大框 -->
  <rect x="30" y="20" width="660" height="240" rx="10" fill="#fbfcfd" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">Kubernetes 集群（容器编排事实标准）</text>
  <!-- 控制平面 -->
  <rect x="50" y="54" width="400" height="120" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="250" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">控制平面 Control Plane（四组件）</text>
  <rect x="60" y="90" width="88" height="40" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="104" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f4e79">APIServer</text>
  <rect x="158" y="90" width="88" height="40" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="202" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f4e79">Controller</text>
  <rect x="256" y="90" width="88" height="40" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="300" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f4e79">Scheduler</text>
  <rect x="354" y="90" width="88" height="40" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="398" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f4e79">etcd</text>
  <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#6b7a8a">声明式 API · CRD/Operator 可扩展 · CNI/CSI 可移植</text>
  <!-- 工作节点 -->
  <rect x="480" y="54" width="190" height="120" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="575" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">工作节点 Node</text>
  <rect x="495" y="90" width="160" height="32" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="575" y="111" text-anchor="middle" font-size="11" fill="#4a6130">应用 Pod</text>
  <text x="575" y="146" text-anchor="middle" font-size="10.5" fill="#6b7a8a">无状态/有状态/任务负载</text>
  <text x="575" y="164" text-anchor="middle" font-size="10.5" fill="#6b7a8a">kubelet + 容器运行时</text>
  <!-- 控制平面到节点箭头 -->
  <line x1="454" y1="114" x2="469" y2="114" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="477,114 469,109.5 469,118.5" fill="#1f4e79"/>
  <!-- 集群内底部说明 -->
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#22303f">屏蔽 IaaS 差异，支持多云/混合云；CNCF 一致性认证保障不同实现兼容</text>
  <text x="360" y="222" text-anchor="middle" font-size="11" fill="#6b7a8a">上层生态：Istio 服务网格 · Kubeflow 机器学习 · Knative 无服务器框架</text>
  <text x="360" y="246" text-anchor="middle" font-size="11" fill="#6b7a8a">容器三大核心价值：敏捷 · 弹性 · 可移植性</text>
  <!-- 五大核心能力 -->
  <text x="360" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">分布式应用管理五大核心能力</text>
  <rect x="30" y="306" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="92" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">资源调度</text>
  <text x="92" y="354" text-anchor="middle" font-size="10" fill="#22303f">按资源请求选节点</text>
  <rect x="164" y="306" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="226" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">应用部署与管理</text>
  <text x="226" y="354" text-anchor="middle" font-size="10" fill="#22303f">发布、回滚、配置</text>
  <rect x="298" y="306" width="124" height="64" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">自动修复</text>
  <text x="360" y="354" text-anchor="middle" font-size="10" fill="#22303f">故障迁移与自愈</text>
  <rect x="432" y="306" width="124" height="64" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="494" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">服务发现与</text>
  <text x="494" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">负载均衡</text>
  <text x="494" y="362" text-anchor="middle" font-size="10" fill="#22303f">Service + DNS</text>
  <rect x="566" y="306" width="124" height="64" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="628" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">弹性伸缩</text>
  <text x="628" y="354" text-anchor="middle" font-size="10" fill="#22303f">按负载自动扩缩容</text>
</svg>
