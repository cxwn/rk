<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 顶部输入 -->
  <rect x="190" y="18" width="340" height="44" rx="6" fill="#1f4e79"/>
  <text x="360" y="45" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">系统生命周期：系统需求 ＋ 软件级别</text>
  <!-- 计划过程 -->
  <rect x="30" y="118" width="190" height="180" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="125" y="146" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">软件计划过程</text>
  <text x="125" y="180" font-size="11" fill="#22303f" text-anchor="middle">策划协调全部活动</text>
  <text x="125" y="202" font-size="11" fill="#22303f" text-anchor="middle">制订软件计划与标准</text>
  <text x="125" y="240" font-size="11" fill="#6b7a8a" text-anchor="middle">指导开发过程与</text>
  <text x="125" y="260" font-size="11" fill="#6b7a8a" text-anchor="middle">综合过程</text>
  <!-- 开发过程 -->
  <rect x="265" y="118" width="190" height="180" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="360" y="144" font-size="14" font-weight="bold" fill="#c05621" text-anchor="middle">软件开发过程</text>
  <g font-size="11" fill="#22303f">
    <rect x="285" y="156" width="150" height="28" rx="4" fill="#ffffff" stroke="#c05621"/>
    <text x="360" y="175" text-anchor="middle">软件需求（高层需求）</text>
    <rect x="285" y="190" width="150" height="28" rx="4" fill="#ffffff" stroke="#c05621"/>
    <text x="360" y="209" text-anchor="middle">软件设计（低层需求）</text>
    <rect x="285" y="224" width="150" height="28" rx="4" fill="#ffffff" stroke="#c05621"/>
    <text x="360" y="243" text-anchor="middle">软件编码（源代码）</text>
    <rect x="285" y="258" width="150" height="28" rx="4" fill="#ffffff" stroke="#c05621"/>
    <text x="360" y="277" text-anchor="middle">集成（目标机）</text>
  </g>
  <!-- 综合过程 -->
  <rect x="500" y="118" width="190" height="180" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="595" y="144" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">软件综合过程</text>
  <g font-size="11" fill="#22303f">
    <rect x="520" y="156" width="150" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="595" y="175" text-anchor="middle">软件验证</text>
    <rect x="520" y="190" width="150" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="595" y="209" text-anchor="middle">软件配置管理</text>
    <rect x="520" y="224" width="150" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="595" y="243" text-anchor="middle">软件质量保证</text>
    <rect x="520" y="258" width="150" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="595" y="277" text-anchor="middle">审定联络</text>
  </g>
  <!-- 顶部 -> 三过程（顶框底缘三个独立连接点，直角折线） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <polyline points="270,65 270,90 125,90 125,110"/>
    <polygon points="125,115 120.5,107 129.5,107" fill="#1f4e79"/>
    <line x1="360" y1="65" x2="360" y2="110"/>
    <polygon points="360,115 355.5,107 364.5,107" fill="#1f4e79"/>
    <polyline points="450,65 450,90 595,90 595,110"/>
    <polygon points="595,115 590.5,107 599.5,107" fill="#1f4e79"/>
    <!-- 计划 -> 开发 -> 综合 -->
    <line x1="223" y1="208" x2="257" y2="208"/>
    <polygon points="262,208 254,203.5 254,212.5" fill="#1f4e79"/>
    <line x1="458" y1="208" x2="492" y2="208"/>
    <polygon points="497,208 489,203.5 489,212.5" fill="#1f4e79"/>
  </g>
  <text x="360" y="336" font-size="12" fill="#22303f" text-anchor="middle">DO-178B 三要素：目标（66 个，A～E 级分布）· 过程（三大过程）· 数据（软件生命周期数据）</text>
  <text x="360" y="362" font-size="11" fill="#6b7a8a" text-anchor="middle">（据教材图 2-16 简化重绘）</text>
</svg>
