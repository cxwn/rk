<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect x="40" y="120" width="100" height="50" rx="4" fill="#1f4e79"/>
  <text x="90" y="150" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">用户</text>
  <rect x="200" y="60" width="300" height="200" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="210" y="82" font-size="13" fill="#1f4e79" font-weight="bold">应用程序服务器</text>
  <rect x="220" y="94" width="260" height="62" rx="3" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="230" y="116" font-size="12" fill="#22303f" font-weight="bold">转换程序 TP</text>
  <text x="230" y="138" font-size="11" fill="#22303f">UDI→CDI1，更新CDI2(订单)/CDI3(账单)</text>
  <rect x="220" y="180" width="260" height="56" rx="3" fill="#ffffff" stroke="#8aa15c" stroke-width="1"/>
  <text x="230" y="202" font-size="12" fill="#4a6130" font-weight="bold">验证过程 IVP</text>
  <text x="230" y="224" font-size="11" fill="#22303f">检查 CDI2、CDI3 是否符合完整性约束</text>
  <rect x="560" y="120" width="130" height="50" rx="4" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="625" y="150" text-anchor="middle" font-size="13" fill="#22303f" font-weight="bold">数据库服务器</text>
  <line x1="140" y1="145" x2="209" y2="145" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="217,145 209,140.5 209,149.5" fill="#1f4e79"/>
  <text x="40" y="112" font-size="11" fill="#6b7a8a">提交订单(UDI)</text>
  <line x1="350" y1="156" x2="350" y2="169" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="350,177 345.5,169 354.5,169" fill="#4a6130"/>
  <text x="360" y="172" font-size="11" fill="#6b7a8a">提交CDI2/CDI3</text>
  <line x1="500" y1="145" x2="549" y2="145" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="557,145 549,140.5 549,149.5" fill="#1f4e79"/>
  <text x="510" y="135" font-size="11" fill="#6b7a8a">写入</text>
  <text x="200" y="286" font-size="12" fill="#6b7a8a">职责隔离：TP 子过程授权给不同用户；主体只能经 TP 访问 CDI，全程可审计</text>
</svg>
