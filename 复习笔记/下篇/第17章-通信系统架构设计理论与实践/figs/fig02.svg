<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">广域网六种架构（蓝点＝核心路由设备，绿点＝局域网）</text>
  <!-- 格1 单核心 -->
  <rect x="20" y="40" width="220" height="200" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="130" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">① 单核心</text>
  <line x1="130" y1="118" x2="130" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="60" y1="140" x2="200" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="60" y1="140" x2="60" y2="158" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="130" y1="140" x2="130" y2="158" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="200" y1="140" x2="200" y2="158" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <circle cx="130" cy="110" r="8" fill="#1f4e79"/>
  <circle cx="60" cy="165" r="7" fill="#8aa15c"/>
  <circle cx="130" cy="165" r="7" fill="#8aa15c"/>
  <circle cx="200" cy="165" r="7" fill="#8aa15c"/>
  <text x="130" y="204" text-anchor="middle" font-size="11" fill="#22303f">结构简单、访问效率高、接入方便</text>
  <text x="130" y="222" text-anchor="middle" font-size="11" fill="#c05621">核心单点故障、扩展能力欠佳</text>
  <!-- 格2 双核心 -->
  <rect x="250" y="40" width="220" height="200" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="360" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">② 双核心</text>
  <line x1="328" y1="110" x2="392" y2="110" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="320" y1="118" x2="320" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="400" y1="118" x2="400" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="290" y1="140" x2="430" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="290" y1="140" x2="290" y2="158" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="360" y1="140" x2="360" y2="158" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="430" y1="140" x2="430" y2="158" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <circle cx="320" cy="110" r="8" fill="#1f4e79"/>
  <circle cx="400" cy="110" r="8" fill="#1f4e79"/>
  <circle cx="290" cy="165" r="7" fill="#8aa15c"/>
  <circle cx="360" cy="165" r="7" fill="#8aa15c"/>
  <circle cx="430" cy="165" r="7" fill="#8aa15c"/>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#22303f">多路径、路由热切换、可靠性高</text>
  <text x="360" y="222" text-anchor="middle" font-size="11" fill="#c05621">投资高、冗余设计难、易成环路</text>
  <!-- 格3 环型 -->
  <rect x="480" y="40" width="220" height="200" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="590" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">③ 环型</text>
  <line x1="538" y1="95" x2="642" y2="95" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="538" y1="145" x2="642" y2="145" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="530" y1="103" x2="530" y2="137" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="650" y1="103" x2="650" y2="137" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="590" y1="145" x2="590" y2="178" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <circle cx="530" cy="95" r="8" fill="#1f4e79"/>
  <circle cx="650" cy="95" r="8" fill="#1f4e79"/>
  <circle cx="530" cy="145" r="8" fill="#1f4e79"/>
  <circle cx="650" cy="145" r="8" fill="#1f4e79"/>
  <circle cx="590" cy="185" r="7" fill="#8aa15c"/>
  <text x="590" y="204" text-anchor="middle" font-size="11" fill="#22303f">多路径、无缝热切换、环路控制</text>
  <text x="590" y="222" text-anchor="middle" font-size="11" fill="#c05621">占用端口多、投资高于双核心</text>
  <!-- 格4 半冗余 -->
  <rect x="20" y="250" width="220" height="200" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="130" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">④ 半冗余</text>
  <line x1="78" y1="312" x2="182" y2="312" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="77" y1="316" x2="123" y2="348" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="183" y1="316" x2="137" y2="348" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="70" y1="320" x2="70" y2="384" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="190" y1="320" x2="190" y2="384" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="123" y1="356" x2="77" y2="388" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="137" y1="356" x2="183" y2="388" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="78" y1="392" x2="182" y2="392" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <circle cx="70" cy="312" r="8" fill="#1f4e79"/>
  <circle cx="190" cy="312" r="8" fill="#1f4e79"/>
  <circle cx="130" cy="352" r="8" fill="#1f4e79"/>
  <circle cx="70" cy="392" r="8" fill="#1f4e79"/>
  <circle cx="190" cy="392" r="8" fill="#1f4e79"/>
  <text x="130" y="414" text-anchor="middle" font-size="11" fill="#22303f">任意节点≥2 条链路；全互连即全冗余</text>
  <text x="130" y="432" text-anchor="middle" font-size="11" fill="#c05621">灵活、适合 OSPF；结构零散难排障</text>
  <!-- 格5 对等子域 -->
  <rect x="250" y="250" width="220" height="200" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="360" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">⑤ 对等子域</text>
  <rect x="270" y="292" width="110" height="100" rx="8" fill="none" stroke="#6b7a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="390" y="292" width="110" height="100" rx="8" fill="none" stroke="#6b7a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="325" y="306" text-anchor="middle" font-size="10" fill="#6b7a8a">子域 A</text>
  <text x="445" y="306" text-anchor="middle" font-size="10" fill="#6b7a8a">子域 B</text>
  <line x1="302" y1="320" x2="358" y2="320" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="300" y1="326" x2="325" y2="354" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="360" y1="326" x2="335" y2="354" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="422" y1="320" x2="468" y2="320" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="420" y1="326" x2="440" y2="354" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="470" y1="326" x2="450" y2="354" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <line x1="373" y1="320" x2="407" y2="320" stroke="#c05621" stroke-width="2" fill="none"/>
  <circle cx="295" cy="320" r="8" fill="#1f4e79"/>
  <circle cx="365" cy="320" r="8" fill="#1f4e79"/>
  <circle cx="330" cy="360" r="8" fill="#1f4e79"/>
  <circle cx="415" cy="320" r="8" fill="#1f4e79"/>
  <circle cx="475" cy="320" r="8" fill="#1f4e79"/>
  <circle cx="445" cy="360" r="8" fill="#1f4e79"/>
  <text x="360" y="414" text-anchor="middle" font-size="11" fill="#22303f">两子域内各半冗余，域间链路互联</text>
  <text x="360" y="432" text-anchor="middle" font-size="11" fill="#c05621">域间带宽应高于域内；边界性能要求高</text>
  <!-- 格6 层次子域 -->
  <rect x="480" y="250" width="220" height="200" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="590" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">⑥ 层次子域</text>
  <rect x="510" y="290" width="160" height="54" rx="8" fill="none" stroke="#6b7a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="590" y="304" text-anchor="middle" font-size="10" fill="#6b7a8a">高层子域</text>
  <line x1="558" y1="317" x2="622" y2="317" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <circle cx="550" cy="317" r="8" fill="#1f4e79"/>
  <circle cx="630" cy="317" r="8" fill="#1f4e79"/>
  <line x1="550" y1="325" x2="550" y2="364" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="550,372 545.5,364 554.5,364" fill="#c05621"/>
  <line x1="630" y1="325" x2="630" y2="364" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="630,372 625.5,364 634.5,364" fill="#c05621"/>
  <rect x="495" y="375" width="105" height="55" rx="8" fill="none" stroke="#6b7a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="547" y="390" text-anchor="middle" font-size="10" fill="#6b7a8a">低层子域</text>
  <line x1="528" y1="405" x2="562" y2="405" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <circle cx="520" cy="405" r="8" fill="#1f4e79"/>
  <circle cx="570" cy="405" r="8" fill="#1f4e79"/>
  <rect x="600" y="375" width="105" height="55" rx="8" fill="none" stroke="#6b7a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="652" y="390" text-anchor="middle" font-size="10" fill="#6b7a8a">低层子域</text>
  <line x1="633" y1="405" x2="667" y2="405" stroke="#1f4e79" stroke-width="1.2" fill="none"/>
  <circle cx="625" cy="405" r="8" fill="#1f4e79"/>
  <circle cx="675" cy="405" r="8" fill="#1f4e79"/>
  <text x="590" y="446" text-anchor="middle" font-size="11" fill="#c05621">低层互访须经高层；扩展性好</text>
</svg>
