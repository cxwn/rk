<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="14" fill="#1f4e79" font-weight="bold">BLP 机密性：不上读（No Read Up）、不下写（No Write Down）</text>
  <rect x="60" y="150" width="160" height="50" rx="4" fill="#1f4e79"/>
  <text x="140" y="180" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">主体（机密级）</text>
  <rect x="480" y="60" width="190" height="44" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="575" y="87" text-anchor="middle" font-size="13" fill="#22303f">客体：绝密 Top Secret</text>
  <rect x="480" y="153" width="190" height="44" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="575" y="180" text-anchor="middle" font-size="13" fill="#22303f">客体：机密 Secret</text>
  <rect x="480" y="246" width="190" height="44" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="575" y="273" text-anchor="middle" font-size="13" fill="#22303f">客体：秘密 Sensitive</text>
  <polyline points="140,150 140,82 469,82" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="477,82 469,77.5 469,86.5" fill="#c05621"/>
  <text x="250" y="72" font-size="13" fill="#c05621">可写、不可读（向上写）</text>
  <line x1="220" y1="175" x2="469" y2="175" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="477,175 469,170.5 469,179.5" fill="#4a6130"/>
  <text x="280" y="165" font-size="13" fill="#4a6130">同级：可读可写</text>
  <polyline points="140,200 140,268 469,268" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="477,268 469,263.5 469,272.5" fill="#c05621"/>
  <text x="250" y="258" font-size="13" fill="#c05621">可读、不可写（向下读）</text>
</svg>
