  <rect x="170" y="260" width="380" height="70" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.7"/>
  <text x="360" y="289" text-anchor="middle" font-size="18" font-weight="bold" fill="#c05621">概念模式（模式）</text>
  <text x="360" y="315" text-anchor="middle" font-size="13" fill="#22303f">全部数据的逻辑结构、联系与约束</text>
  <line x1="360" y1="330" x2="360" y2="379" stroke="#8aa15c" stroke-width="1.6"/>
  <polygon points="360,387 355.5,379 364.5,379" fill="#8aa15c"/>
  <text x="375" y="360" font-size="12" fill="#4a6130">概念/内模式映像 → 物理数据独立性</text>
