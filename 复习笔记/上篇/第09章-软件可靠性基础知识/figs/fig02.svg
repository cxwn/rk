<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">“规定时间”的三种概念</text>
  <text x="40" y="64" font-size="13.5" fill="#22303f">举例：财务软件 9:00 开机运行，17:00 下班退出，CPU 实际执行程序指令不足 2 小时</text>
  <g font-size="11" fill="#6b7a8a" text-anchor="middle">
    <text x="120" y="100">0 时</text>
    <text x="187.5" y="100">3 时</text>
    <text x="255" y="100">6 时</text>
    <text x="322.5" y="100">9 时</text>
    <text x="390" y="100">12 时</text>
    <text x="457.5" y="100">15 时</text>
    <text x="525" y="100">18 时</text>
    <text x="592.5" y="100">21 时</text>
    <text x="660" y="100">24 时</text>
  </g>
  <g stroke="#6b7a8a" stroke-width="1">
    <line x1="120" y1="106" x2="120" y2="114"/>
    <line x1="187.5" y1="106" x2="187.5" y2="114"/>
    <line x1="255" y1="106" x2="255" y2="114"/>
    <line x1="322.5" y1="106" x2="322.5" y2="114"/>
    <line x1="390" y1="106" x2="390" y2="114"/>
    <line x1="457.5" y1="106" x2="457.5" y2="114"/>
    <line x1="525" y1="106" x2="525" y2="114"/>
    <line x1="592.5" y1="106" x2="592.5" y2="114"/>
    <line x1="660" y1="106" x2="660" y2="114"/>
  </g>
  <text x="40" y="152" font-size="15" font-weight="bold" fill="#1f4e79">自然时间</text>
  <rect x="120" y="130" width="540" height="30" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="390" y="150" text-anchor="middle" font-size="13" fill="#1f4e79">日历时间：一整天 24 小时</text>
  <text x="40" y="207" font-size="15" font-weight="bold" fill="#4a6130">运行时间</text>
  <rect x="322.5" y="185" width="180" height="30" rx="4" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="412.5" y="205" text-anchor="middle" font-size="13" fill="#4a6130">8 小时</text>
  <text x="515" y="205" font-size="12.5" fill="#22303f">启动到退出：9:00～17:00</text>
  <text x="40" y="262" font-size="15" font-weight="bold" fill="#c05621">执行时间</text>
  <g fill="#fdf0e6" stroke="#c05621" stroke-width="1.5">
    <rect x="333.75" y="240" width="22.5" height="30" rx="3"/>
    <rect x="367.5" y="240" width="33.75" height="30" rx="3"/>
    <rect x="435" y="240" width="45" height="30" rx="3"/>
  </g>
  <text x="515" y="260" font-size="12.5" fill="#22303f">CPU 执行指令累计 &lt; 2 小时</text>
  <rect x="40" y="300" width="640" height="72" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="360" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f4e79">用执行时间度量软件可靠性最准确、效果最好</text>
  <text x="360" y="356" text-anchor="middle" font-size="12.5" fill="#22303f">软件处于相对稳定的工作状态时，可按经验换算比例在三种时间之间折算</text>
</svg>
