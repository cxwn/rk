    <rect x="90" y="376" width="150" height="34" rx="5" fill="#ffffff" stroke="#c05621"/><text x="165" y="399">ASP：处理器相关</text>
    <rect x="285" y="376" width="150" height="34" rx="5" fill="#ffffff" stroke="#c05621"/><text x="360" y="399">BSP：目标板相关</text>
