<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">大数据 4V 特征与分析五阶段</text>
  <text x="30" y="54" font-size="13" font-weight="bold" fill="#1f4e79">IBM：3V + 第 4 个 V（Value）</text>
  <rect x="30" y="70" width="150" height="118" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="105" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Volume</text>
  <text x="105" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">大规模</text>
  <text x="105" y="154" text-anchor="middle" font-size="11" fill="#22303f">数据规模巨大</text>
  <text x="105" y="174" text-anchor="middle" font-size="10" fill="#6b7a8a">持续增长</text>
  <rect x="200" y="70" width="150" height="118" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="275" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">Velocity</text>
  <text x="275" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">高速度</text>
  <text x="275" y="154" text-anchor="middle" font-size="11" fill="#22303f">数据产生速度快</text>
  <text x="275" y="174" text-anchor="middle" font-size="10" fill="#6b7a8a">处理性能要求高</text>
  <rect x="370" y="70" width="150" height="118" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="445" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a6130">Variety</text>
  <text x="445" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">多样化</text>
  <text x="445" y="154" text-anchor="middle" font-size="11" fill="#22303f">数据种类丰富</text>
  <text x="445" y="174" text-anchor="middle" font-size="10" fill="#6b7a8a">多来源、多格式</text>
  <rect x="540" y="70" width="150" height="118" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="615" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Value</text>
  <text x="615" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#22303f">潜藏价值</text>
  <text x="615" y="154" text-anchor="middle" font-size="11" fill="#22303f">分析挖掘价值</text>
  <text x="615" y="174" text-anchor="middle" font-size="10" fill="#6b7a8a">第 4 个 V</text>
  <text x="30" y="216" font-size="11" fill="#6b7a8a">注意：SAS 在传统 3V 基础上另增「可变性」与「复杂性」，不要与 IBM 的第 4 个 V 混淆。</text>
  <text x="30" y="248" font-size="13" font-weight="bold" fill="#1f4e79">大数据分析五阶段</text>
  <rect x="30" y="270" width="120" height="98" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="90" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">1. 数据获取</text>
  <text x="90" y="319" text-anchor="middle" font-size="12" fill="#22303f">记录</text>
  <text x="90" y="346" text-anchor="middle" font-size="10" fill="#6b7a8a">先拿到数据</text>
  <line x1="150" y1="319" x2="154" y2="319" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="162,319 154,314.5 154,323.5" fill="#1f4e79"/>
  <rect x="165" y="270" width="120" height="98" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="225" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">2. 信息抽取</text>
  <text x="225" y="319" text-anchor="middle" font-size="11" fill="#22303f">清洗 / 注记</text>
  <text x="225" y="346" text-anchor="middle" font-size="10" fill="#6b7a8a">洗净并说明</text>
  <line x1="285" y1="319" x2="289" y2="319" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="297,319 289,314.5 289,323.5" fill="#1f4e79"/>
  <rect x="300" y="270" width="120" height="98" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="360" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">3. 数据集成</text>
  <text x="360" y="319" text-anchor="middle" font-size="11" fill="#22303f">聚集 / 表现</text>
  <text x="360" y="346" text-anchor="middle" font-size="10" fill="#6b7a8a">统一组织数据</text>
  <line x1="420" y1="319" x2="424" y2="319" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="432,319 424,314.5 424,323.5" fill="#1f4e79"/>
  <rect x="435" y="270" width="120" height="98" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="495" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">4. 数据分析</text>
  <text x="495" y="319" text-anchor="middle" font-size="12" fill="#22303f">建模</text>
  <text x="495" y="346" text-anchor="middle" font-size="10" fill="#6b7a8a">发现规律</text>
  <line x1="555" y1="319" x2="559" y2="319" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="567,319 559,314.5 559,323.5" fill="#1f4e79"/>
  <rect x="570" y="270" width="120" height="98" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="630" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">5. 数据解释</text>
  <text x="630" y="319" text-anchor="middle" font-size="11" fill="#22303f">出处 + 可视化</text>
  <text x="630" y="346" text-anchor="middle" font-size="10" fill="#6b7a8a">理解验证结果</text>
  <rect x="90" y="396" width="540" height="42" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="423" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">助记：取 → 洗 → 集 → 析 → 释</text>
</svg>
