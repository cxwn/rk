  <text x="200" y="149" text-anchor="middle" font-size="13" fill="#6b7a8a">外部视图：用户的局部数据</text>
  <rect x="420" y="100" width="200" height="60" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="520" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">外模式 B</text>
  <text x="520" y="149" text-anchor="middle" font-size="13" fill="#6b7a8a">外模式可以有多个</text>
  <line x1="200" y1="160" x2="200" y2="225" stroke="#c05621" stroke-width="1.5"/>
  <line x1="200" y1="225" x2="250" y2="225" stroke="#c05621" stroke-width="1.5"/>
  <line x1="250" y1="225" x2="250" y2="249" stroke="#c05621" stroke-width="1.5"/>
  <polygon points="250,257 245.5,249 254.5,249" fill="#c05621"/>
