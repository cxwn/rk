<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">物理结构对比与逻辑结构综合</text>
  <rect x="35" y="48" width="310" height="174" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="190" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">集中式：资源集中配置</text>
  <rect x="115" y="94" width="150" height="44" rx="5" fill="#ffffff" stroke="#c05621" stroke-width="1.2"/>
  <text x="190" y="121" text-anchor="middle" font-size="13" fill="#22303f">主机 · 软件 · 数据</text>
  <text x="190" y="160" text-anchor="middle" font-size="12" fill="#22303f">便于管理、利用率较高</text>
  <text x="190" y="183" text-anchor="middle" font-size="12" fill="#22303f">扩展维护困难，主机存在单点风险</text>
  <text x="190" y="207" text-anchor="middle" font-size="11" fill="#6b7a8a">多终端共享主机仍属集中式</text>
  <rect x="375" y="48" width="310" height="174" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="530" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">分布式：网络连接资源</text>
  <rect x="395" y="96" width="78" height="40" rx="5" fill="#ffffff" stroke="#1f4e79"/>
  <rect x="491" y="96" width="78" height="40" rx="5" fill="#ffffff" stroke="#1f4e79"/>
  <rect x="587" y="96" width="78" height="40" rx="5" fill="#ffffff" stroke="#1f4e79"/>
  <text x="434" y="121" text-anchor="middle" font-size="12" fill="#22303f">结点 A</text>
  <text x="530" y="121" text-anchor="middle" font-size="12" fill="#22303f">结点 B</text>
  <text x="626" y="121" text-anchor="middle" font-size="12" fill="#22303f">结点 C</text>
  <line x1="473" y1="116" x2="488" y2="116" stroke="#1f4e79" stroke-width="1.3" fill="none"/>
  <line x1="569" y1="116" x2="584" y2="116" stroke="#1f4e79" stroke-width="1.3" fill="none"/>
  <text x="530" y="160" text-anchor="middle" font-size="12" fill="#22303f">按需配置、扩展方便、局部故障影响较小</text>
  <text x="530" y="183" text-anchor="middle" font-size="12" fill="#22303f">标准协调和整体资源管理更复杂</text>
  <text x="530" y="207" text-anchor="middle" font-size="11" fill="#6b7a8a">可统一管理，也可利用本地资源独立运行</text>
  <rect x="35" y="248" width="650" height="116" rx="8" fill="#fbfdff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">逻辑结构：功能子系统的三种综合</text>
  <rect x="55" y="292" width="185" height="52" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="147" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">横向综合</text>
  <text x="147" y="334" text-anchor="middle" font-size="11" fill="#22303f">同一层次 · 跨职能</text>
  <rect x="267" y="292" width="185" height="52" rx="5" fill="#f3f6ee" stroke="#4a6130"/>
  <text x="359" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">纵向综合</text>
  <text x="359" y="334" text-anchor="middle" font-size="11" fill="#22303f">同一职能 · 跨层次</text>
  <rect x="480" y="292" width="185" height="52" rx="5" fill="#fdf0e6" stroke="#c05621"/>
  <text x="572" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">纵横综合</text>
  <text x="572" y="334" text-anchor="middle" font-size="11" fill="#22303f">信息模型 + 处理模型</text>
  <text x="360" y="382" text-anchor="middle" font-size="11" fill="#6b7a8a">整体优良不等于各子系统简单相加，必须统一规划子系统之间的关系</text>
</svg>
