<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="450" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">软件容错设计：恢复块与 N 版本程序设计</text>
  <text x="190" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">恢复块设计（动态冗余）</text>
  <rect x="40" y="80" width="300" height="170" rx="8" fill="#fbfdfe" stroke="#1f4e79" stroke-width="1.5"/>
  <rect x="60" y="105" width="200" height="34" rx="5" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="160" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">主文本（运行中）</text>
  <rect x="60" y="150" width="200" height="34" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="160" y="172" text-anchor="middle" font-size="13" fill="#1f4e79">备份文本 1</text>
  <rect x="60" y="195" width="200" height="34" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="160" y="217" text-anchor="middle" font-size="13" fill="#1f4e79">备份文本 2</text>
  <text x="272" y="163" font-size="12" fill="#c05621">故障时</text>
  <text x="272" y="183" font-size="12" fill="#c05621">用备份替换</text>
  <text x="190" y="285" text-anchor="middle" font-size="12" fill="#22303f">选择一组操作作为容错设计单元</text>
  <text x="190" y="307" text-anchor="middle" font-size="12" fill="#22303f">每一时刻只有一个文本处于运行状态</text>
  <text x="535" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">N 版本程序设计（多数表决）</text>
  <text x="535" y="88" text-anchor="middle" font-size="12" fill="#22303f">相同初始条件与输入，分别运行 N 个版本</text>
  <rect x="420" y="105" width="90" height="34" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="465" y="127" text-anchor="middle" font-size="13" fill="#1f4e79">版本 1</text>
  <rect x="420" y="150" width="90" height="34" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="465" y="172" text-anchor="middle" font-size="13" fill="#1f4e79">版本 2</text>
  <rect x="420" y="195" width="90" height="34" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="465" y="217" text-anchor="middle" font-size="13" fill="#1f4e79">版本 3</text>
  <rect x="590" y="135" width="90" height="60" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="635" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">多数表决</text>
  <rect x="580" y="230" width="110" height="34" rx="5" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="635" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">输出正确结果</text>
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <polyline points="510,122 550,122 550,150 579,150"/>
    <line x1="510" y1="167" x2="579" y2="167"/>
    <polyline points="510,212 550,212 550,184 579,184"/>
    <line x1="635" y1="195" x2="635" y2="219"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="587,150 579,145.5 579,154.5"/>
    <polygon points="587,167 579,162.5 579,171.5"/>
    <polygon points="587,184 579,179.5 579,188.5"/>
    <polygon points="635,227 630.5,219 639.5,219"/>
  </g>
  <text x="535" y="290" text-anchor="middle" font-size="12" fill="#22303f">前提：需求说明完全精确；</text>
  <text x="535" y="312" text-anchor="middle" font-size="12" fill="#22303f">各版本设计全过程不相关</text>
  <rect x="40" y="335" width="640" height="95" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="60" y="360" font-size="14" font-weight="bold" fill="#4a6130">冗余设计</text>
  <text x="60" y="382" font-size="12" fill="#22303f">在一套完整软件之外，用不同路径、不同算法或不同实现方法做备份，故障时替换以维持运行</text>
  <text x="60" y="402" font-size="12" fill="#22303f">相同两套软件互备意义不大：相同运行环境下，一套出故障的地方另一套也会出故障</text>
  <text x="60" y="422" font-size="12" fill="#22303f">代价：存储空间、内存消耗与运行时间增加，需与可靠性要求折中</text>
</svg>
