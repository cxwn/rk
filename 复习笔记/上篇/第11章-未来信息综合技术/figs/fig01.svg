<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">CPS 三级体系架构：逐级扩展、数据自动流动范围逐级扩大</text>
  <rect x="60" y="44" width="600" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">SoS 级 CPS（系统之系统）</text>
  <text x="360" y="98" text-anchor="middle" font-size="12" fill="#22303f">数据汇聚·大数据平台：数据存储/融合/分布式计算·资产性能管理·运营优化服务</text>
  <rect x="100" y="152" width="520" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">系统级 CPS（多个单元级经工业网络互联）</text>
  <text x="360" y="206" text-anchor="middle" font-size="12" fill="#22303f">互联互通·即插即用·边缘网关·数据互操作·协同控制·监视与诊断</text>
  <rect x="140" y="260" width="440" height="72" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05621">单元级 CPS（不可分割的最小单元）</text>
  <text x="360" y="314" text-anchor="middle" font-size="12" fill="#22303f">可感知·可计算·可交互·可延展·自决策，形成最基本数据闭环</text>
  <line x1="360" y1="252" x2="360" y2="233" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,227 355.5,235 364.5,235" fill="#1f4e79"/>
  <line x1="360" y1="144" x2="360" y2="125" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,119 355.5,127 364.5,127" fill="#1f4e79"/>
  <text x="378" y="246" font-size="11" fill="#6b7a8a">工业网络（现场总线/工业以太网）</text>
  <text x="378" y="138" font-size="11" fill="#6b7a8a">多系统有机组合</text>
  <text x="90" y="352" font-size="11" fill="#6b7a8a">例：智能机床（单元级）→ 冲压生产线（系统级）→ 车间乃至整个工厂（SoS 级）</text>
</svg>
