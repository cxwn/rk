<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 应用层 -->
  <rect x="60" y="24" width="600" height="68" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="90" y="50" font-size="14" font-weight="bold" fill="#1f4e79">应用层</text>
  <text x="90" y="74" font-size="11" fill="#22303f">工业控制应用 ｜ 军事应用 ｜ 物联网应用 ｜ 移动设备应用</text>
  <!-- 中间件层 -->
  <rect x="60" y="116" width="600" height="68" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="90" y="142" font-size="14" font-weight="bold" fill="#c05621">中间件层</text>
  <text x="90" y="166" font-size="11" fill="#22303f">嵌入式数据库、OpenGL、JAVA、虚拟机（VM）、DDS/CORBA、Hadoop</text>
  <!-- 操作系统层 -->
  <rect x="60" y="208" width="600" height="80" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="90" y="234" font-size="14" font-weight="bold" fill="#1f4e79">操作系统层</text>
  <text x="90" y="256" font-size="11" fill="#22303f">嵌入式（实时）操作系统 E(RT)OS：任务管理、存储管理、任务间通信、时钟/中断管理</text>
  <text x="90" y="276" font-size="11" fill="#22303f">可配置组件：文件系统、设备管理、运行时库 RTL、GUI、网络管理、目标机代理 Agent</text>
  <!-- 抽象层 -->
  <rect x="60" y="312" width="600" height="68" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="90" y="338" font-size="14" font-weight="bold" fill="#4a6130">抽象层</text>
  <text x="90" y="362" font-size="11" fill="#22303f">硬件抽象 HAL（提供虚拟硬件资源）＋ 板级支持包 BSP（硬件驱动软件）</text>
  <!-- 硬件层 -->
  <rect x="60" y="404" width="600" height="68" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="90" y="430" font-size="14" font-weight="bold" fill="#1f4e79">硬件层</text>
  <text x="90" y="454" font-size="11" fill="#22303f">微处理器、ROM/SDRAM/Flash、A/D、D/A、I/O、通用设备、总线、电源、时钟</text>
  <!-- 层间箭头（每层间两条独立竖线） -->
  <g stroke="#6b7a8a" stroke-width="1.4" fill="none">
    <line x1="150" y1="95" x2="150" y2="108"/>
    <polygon points="150,113 145.5,105 154.5,105" fill="#6b7a8a"/>
    <line x1="570" y1="95" x2="570" y2="108"/>
    <polygon points="570,113 565.5,105 574.5,105" fill="#6b7a8a"/>
    <line x1="150" y1="187" x2="150" y2="200"/>
    <polygon points="150,205 145.5,197 154.5,197" fill="#6b7a8a"/>
    <line x1="570" y1="187" x2="570" y2="200"/>
    <polygon points="570,205 565.5,197 574.5,197" fill="#6b7a8a"/>
    <line x1="150" y1="291" x2="150" y2="304"/>
    <polygon points="150,309 145.5,301 154.5,301" fill="#6b7a8a"/>
    <line x1="570" y1="291" x2="570" y2="304"/>
    <polygon points="570,309 565.5,301 574.5,301" fill="#6b7a8a"/>
    <line x1="150" y1="383" x2="150" y2="396"/>
    <polygon points="150,401 145.5,393 154.5,393" fill="#6b7a8a"/>
    <line x1="570" y1="383" x2="570" y2="396"/>
    <polygon points="570,401 565.5,393 574.5,393" fill="#6b7a8a"/>
  </g>
</svg>
