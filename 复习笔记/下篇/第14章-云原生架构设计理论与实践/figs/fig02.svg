<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">云原生应用代码组成与非功能特性剥离</text>
  <!-- 左框 应用代码 -->
  <rect x="40" y="50" width="280" height="220" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="180" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">云原生应用代码（三部分）</text>
  <rect x="60" y="86" width="240" height="48" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="180" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">业务代码（唯一核心）</text>
  <text x="180" y="124" text-anchor="middle" font-size="10.5" fill="#22303f">实现业务逻辑，真正带来业务价值</text>
  <rect x="60" y="146" width="240" height="48" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="180" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">三方软件</text>
  <text x="180" y="184" text-anchor="middle" font-size="10.5" fill="#22303f">业务依赖的三方库（业务库、基础库）</text>
  <rect x="60" y="206" width="240" height="48" rx="6" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="180" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">处理非功能特性的代码</text>
  <text x="180" y="244" text-anchor="middle" font-size="10.5" fill="#22303f">高可用、安全、可观测性等</text>
  <!-- 右框 云设施 -->
  <rect x="440" y="86" width="240" height="168" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="560" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">云设施（IaaS / PaaS）</text>
  <text x="560" y="140" text-anchor="middle" font-size="12" fill="#22303f">接管非功能特性：</text>
  <text x="560" y="164" text-anchor="middle" font-size="12" fill="#22303f">弹性、韧性、安全</text>
  <text x="560" y="186" text-anchor="middle" font-size="12" fill="#22303f">可观测性、灰度……</text>
  <text x="560" y="216" text-anchor="middle" font-size="11" fill="#6b7a8a">轻量、敏捷、高度自动化</text>
  <!-- 箭头1 三方软件右缘 -> 云设施 -->
  <line x1="304" y1="170" x2="429" y2="170" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="437,170 429,165.5 429,174.5" fill="#c05621"/>
  <!-- 箭头2 非功能代码 -> 折线 -> 云设施 -->
  <polyline points="304,230 380,230 380,214 429,214" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="437,214 429,209.5 429,218.5" fill="#c05621"/>
  <text x="366" y="160" text-anchor="middle" font-size="11" fill="#c05621">最大化剥离</text>
  <!-- 底部说明 -->
  <text x="360" y="296" text-anchor="middle" font-size="12" fill="#22303f">业务代码保留在应用内、开发者聚焦；并非全部剥离（如易用性不能剥离）</text>
</svg>
