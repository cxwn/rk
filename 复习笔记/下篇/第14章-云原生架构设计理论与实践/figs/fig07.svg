  <text x="357" y="220" text-anchor="middle" font-size="11" fill="#22303f">HardWare</text>
  <!-- 容器列 Container -->
  <rect x="490" y="56" width="100" height="76" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="540" y="68" text-anchor="middle" font-size="8.5" fill="#c05621">Container</text>
  <rect x="495" y="74" width="90" height="52" rx="4" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
  <text x="540" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#22303f">APP</text>
  <text x="540" y="114" text-anchor="middle" font-size="9.5" fill="#22303f">Bin/Library</text>
  <rect x="595" y="56" width="100" height="76" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="645" y="68" text-anchor="middle" font-size="8.5" fill="#c05621">Container</text>
  <rect x="600" y="74" width="90" height="52" rx="4" fill="#ffffff" stroke="#c05621" stroke-width="1"/>
  <text x="645" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#22303f">APP</text>
  <text x="645" y="114" text-anchor="middle" font-size="9.5" fill="#22303f">Bin/Library</text>
  <rect x="490" y="148" width="205" height="34" rx="5" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="592" y="170" text-anchor="middle" font-size="11" fill="#c05621">Container Runtime</text>
  <rect x="490" y="198" width="205" height="34" rx="5" fill="#e4e9ee" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="592" y="220" text-anchor="middle" font-size="11" fill="#22303f">Operating System</text>
  <rect x="490" y="248" width="205" height="34" rx="5" fill="#dfe5ea" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="592" y="270" text-anchor="middle" font-size="11" fill="#22303f">HardWare</text>
  <!-- 底部特点 -->
  <text x="125" y="308" text-anchor="middle" font-size="11" fill="#6b7a8a">环境不一致、迁移困难</text>
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#1f4e79">每 VM 带完整 Guest OS，开销大</text>
  <text x="595" y="308" text-anchor="middle" font-size="11" fill="#c05621">共享 OS 内核、轻量、秒级启动</text>
