<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="520" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">GENESYS 腰型服务架构与构件接口</text>
  <rect x="45" y="50" width="630" height="58" rx="8" fill="#1f4e79"/>
  <text x="360" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">应用专用服务（包含中间件）</text>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#eaf1f8">面向具体应用功能</text>
  <rect x="125" y="130" width="470" height="58" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="360" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">领域专用服务 DSC / DSO</text>
  <text x="360" y="177" text-anchor="middle" font-size="12" fill="#6b7a8a">例如汽车领域 CAN 总线</text>
  <rect x="195" y="210" width="330" height="54" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="360" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6130">领域无关选择服务</text>
  <text x="360" y="254" text-anchor="middle" font-size="12" fill="#4a6130">开放集合，按架构实例选用</text>
  <rect x="265" y="286" width="190" height="60" rx="8" fill="#c05621"/>
  <text x="360" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">核心服务</text>
  <text x="360" y="333" text-anchor="middle" font-size="12" fill="#fdf0e6">强制 · 最小 · 简单 · 确定</text>
  <rect x="80" y="368" width="560" height="48" rx="8" fill="#6b7a8a"/>
  <text x="360" y="398" text-anchor="middle" font-size="14" fill="#ffffff">不同执行平台：芯片级 · 设备级 · 系统级</text>
  <g stroke="#1f4e79" stroke-width="1.4" fill="none"><line x1="360" y1="108" x2="360" y2="122"/><line x1="360" y1="188" x2="360" y2="202"/><line x1="360" y1="264" x2="360" y2="278"/><line x1="360" y1="346" x2="360" y2="360"/></g>
  <g fill="#1f4e79"><polygon points="360,127 355.5,119 364.5,119"/><polygon points="360,207 355.5,199 364.5,199"/><polygon points="360,283 355.5,275 364.5,275"/><polygon points="360,365 355.5,357 364.5,357"/></g>
  <g text-anchor="middle" font-size="12">
    <rect x="25" y="444" width="155" height="52" rx="7" fill="#eaf1f8"/><text x="102" y="466" font-weight="bold" fill="#1f4e79">LIF 链接接口</text><text x="102" y="487" fill="#22303f">构件间消息服务</text>
    <rect x="197" y="444" width="155" height="52" rx="7" fill="#f3f6ee"/><text x="274" y="466" font-weight="bold" fill="#4a6130">LI 局部接口</text><text x="274" y="487" fill="#22303f">I/O 与外部环境</text>
    <rect x="369" y="444" width="155" height="52" rx="7" fill="#fdf0e6"/><text x="446" y="466" font-weight="bold" fill="#c05621">TII 技术无关</text><text x="446" y="487" fill="#22303f">配置与资源管理</text>
    <rect x="541" y="444" width="155" height="52" rx="7" fill="#eaf1f8"/><text x="618" y="466" font-weight="bold" fill="#1f4e79">TDI 技术相关</text><text x="618" y="487" fill="#22303f">内部观察与诊断</text>
  </g>
</svg>