<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303f">ERP 企业运作供需链：三流集成</text>
  <polyline points="60,139 60,85 620,85 620,139" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="60,147 55.5,139 64.5,139" fill="#1f4e79"/>
  <polygon points="620,147 615.5,139 624.5,139" fill="#1f4e79"/>
  <text x="340" y="74" text-anchor="middle" font-size="12" fill="#1f4e79">信息流：双向共享与传递</text>
  <g text-anchor="middle">
    <rect x="20" y="150" width="120" height="70" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="80" y="180" font-size="15" font-weight="bold" fill="#1f4e79">供应市场</text><text x="80" y="203" font-size="12" fill="#22303f">原材料／服务</text>
    <rect x="160" y="150" width="120" height="70" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="220" y="192" font-size="16" font-weight="bold" fill="#4a6130">采购</text>
    <rect x="300" y="150" width="120" height="70" rx="7" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="192" font-size="16" font-weight="bold" fill="#c05621">加工</text>
    <rect x="440" y="150" width="120" height="70" rx="7" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="500" y="192" font-size="16" font-weight="bold" fill="#4a6130">销售</text>
    <rect x="580" y="150" width="120" height="70" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="640" y="180" font-size="15" font-weight="bold" fill="#1f4e79">需求市场</text><text x="640" y="203" font-size="12" fill="#22303f">客户／消费者</text>
  </g>
  <g stroke="#c05621" stroke-width="1.8" fill="none">
    <line x1="140" y1="185" x2="149" y2="185"/><line x1="280" y1="185" x2="289" y2="185"/>
    <line x1="420" y1="185" x2="429" y2="185"/><line x1="560" y1="185" x2="569" y2="185"/>
  </g>
  <g fill="#c05621">
    <polygon points="157,185 149,180.5 149,189.5"/><polygon points="297,185 289,180.5 289,189.5"/>
    <polygon points="437,185 429,180.5 429,189.5"/><polygon points="577,185 569,180.5 569,189.5"/>
  </g>
  <text x="360" y="246" text-anchor="middle" font-size="13" fill="#c05621">物流过程：采购 → 加工 → 销售</text>
  <polyline points="640,220 640,290 80,290 80,233" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="80,223 75.5,231 84.5,231" fill="#4a6130"/>
  <text x="360" y="280" text-anchor="middle" font-size="13" fill="#4a6130">资金流过程：资金由需求侧流向供应侧</text>
  <rect x="100" y="325" width="520" height="42" rx="8" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="360" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">ERP 对物流、资金流、信息流进行全面集成管理</text>
</svg>
