  <g stroke="#1f4e79" stroke-width="1.4" fill="none">
    <line x1="125" y1="767" x2="132" y2="767"/><line x1="238" y1="767" x2="245" y2="767"/>
    <line x1="351" y1="767" x2="358" y2="767"/><line x1="464" y1="767" x2="471" y2="767"/>
    <line x1="577" y1="767" x2="584" y2="767"/>
