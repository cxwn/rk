<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 315" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">访问控制矩阵及其实现技术</text>
  <rect x="60" y="60" width="250" height="34" fill="#eaf1f8"/>
  <rect x="60" y="60" width="250" height="136" fill="none" stroke="#6b7a8a" stroke-width="1.2"/>
  <line x1="130" y1="60" x2="130" y2="196" stroke="#6b7a8a" stroke-width="0.8"/>
  <line x1="190" y1="60" x2="190" y2="196" stroke="#6b7a8a" stroke-width="0.8"/>
  <line x1="250" y1="60" x2="250" y2="196" stroke="#6b7a8a" stroke-width="0.8"/>
  <line x1="60" y1="94" x2="310" y2="94" stroke="#6b7a8a" stroke-width="0.8"/>
  <line x1="60" y1="128" x2="310" y2="128" stroke="#6b7a8a" stroke-width="0.8"/>
  <line x1="60" y1="162" x2="310" y2="162" stroke="#6b7a8a" stroke-width="0.8"/>
  <text x="95" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f4e79">主体/客体</text>
  <text x="160" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f4e79">O1</text>
  <text x="220" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f4e79">O2</text>
  <text x="280" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f4e79">O3</text>
  <text x="95" y="116" text-anchor="middle" font-size="11" fill="#22303f">S1 张三</text>
  <text x="95" y="150" text-anchor="middle" font-size="11" fill="#22303f">S2 李四</text>
  <text x="95" y="184" text-anchor="middle" font-size="10.5" fill="#22303f">S3 管理员</text>
  <text x="160" y="116" text-anchor="middle" font-size="11.5" fill="#22303f">R,W</text>
  <text x="220" y="116" text-anchor="middle" font-size="11.5" fill="#22303f">R</text>
  <text x="280" y="116" text-anchor="middle" font-size="11.5" fill="#6b7a8a">—</text>
  <text x="160" y="150" text-anchor="middle" font-size="11.5" fill="#22303f">R</text>
  <text x="220" y="150" text-anchor="middle" font-size="11.5" fill="#22303f">R,W</text>
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#6b7a8a">—</text>
  <text x="160" y="184" text-anchor="middle" font-size="11.5" fill="#22303f">O</text>
  <text x="220" y="184" text-anchor="middle" font-size="11.5" fill="#22303f">O</text>
  <text x="280" y="184" text-anchor="middle" font-size="11.5" fill="#22303f">O</text>
  <rect x="380" y="70" width="300" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="395" y="92" font-size="12.5" font-weight="bold" fill="#1f4e79">访问控制表 ACL（按列）</text>
  <text x="395" y="114" font-size="11" fill="#22303f">每个客体一张表：查「谁能访问它」方便</text>
  <rect x="380" y="146" width="300" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="395" y="168" font-size="12.5" font-weight="bold" fill="#1f4e79">能力表 CL（按行）</text>
  <text x="395" y="190" font-size="11" fill="#22303f">每个主体一张表：查「它能访问什么」方便</text>
  <rect x="380" y="222" width="300" height="56" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="395" y="244" font-size="12.5" font-weight="bold" fill="#1f4e79">授权关系表（非空元素）</text>
  <text x="395" y="266" font-size="11" fill="#22303f">按主体排序≈能力表；按客体排序≈ACL</text>
  <text x="343" y="88" text-anchor="middle" font-size="11" fill="#6b7a8a">按列</text>
  <line x1="310" y1="98" x2="369" y2="98" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="377,98 369,93.5 369,102.5" fill="#1f4e79"/>
  <text x="343" y="164" text-anchor="middle" font-size="11" fill="#6b7a8a">按行</text>
  <line x1="310" y1="174" x2="369" y2="174" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="377,174 369,169.5 369,178.5" fill="#1f4e79"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#6b7a8a">非空元素</text>
  <polyline points="190,196 190,250 369,250" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="377,250 369,245.5 369,254.5" fill="#1f4e79"/>
  <text x="360" y="296" text-anchor="middle" font-size="11.5" fill="#6b7a8a">R=读、W=写、O=管理；矩阵大且稀疏，实际按列（ACL）、按行（能力表）或非空元素（授权关系表）保存</text>
</svg>
