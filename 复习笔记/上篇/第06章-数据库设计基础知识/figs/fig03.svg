<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="535" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">数据库三级模式、两级映像（重绘图 6-1）</text>
