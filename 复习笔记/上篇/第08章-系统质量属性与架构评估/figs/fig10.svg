<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f4e79">Hoover 事件架构：框架与应用分离（据图8-6简化）</text>
  <rect x="25" y="60" width="440" height="390" rx="10" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <rect x="490" y="60" width="205" height="390" rx="10" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="45" y="89" font-size="16" font-weight="bold" fill="#1f4e79">Event Framework（可复用框架）</text>
  <text x="592" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">Application</text>
  <g text-anchor="middle">
    <g fill="#ffffff" stroke="#1f4e79">
      <rect x="50" y="110" width="160" height="60" rx="6"/><rect x="260" y="110" width="160" height="60" rx="6"/>
      <rect x="50" y="220" width="160" height="60" rx="6"/><rect x="260" y="220" width="160" height="60" rx="6"/>
      <rect x="50" y="335" width="75" height="50" rx="6"/><rect x="135" y="335" width="75" height="50" rx="6"/>
      <rect x="260" y="335" width="160" height="50" rx="6"/>
    </g>
    <g fill="#ffffff" stroke="#c05621">
      <rect x="520" y="110" width="145" height="60" rx="6"/><rect x="520" y="250" width="145" height="65" rx="6"/>
    </g>
    <g font-size="14" fill="#22303f">
      <text x="130" y="136" font-weight="bold">Event Queue</text><text x="130" y="157" font-size="11">FIFO 事件队列</text>
      <text x="340" y="136" font-weight="bold">Event Manager</text><text x="340" y="157" font-size="11">核心：动态绑定</text>
      <text x="130" y="247" font-weight="bold">Handler</text><text x="130" y="268" font-size="11">处理程序基类</text>
      <text x="340" y="242" font-weight="bold">Event Type Registry</text><text x="340" y="264" font-size="11">事件类型—处理程序</text>
      <text x="87" y="365" font-size="12">STOP</text><text x="172" y="365" font-size="12">IDLE</text>
      <text x="340" y="356" font-size="12" font-weight="bold">Event</text><text x="340" y="375" font-size="11">Type, Args</text>
      <text x="592" y="136" font-weight="bold">Main</text><text x="592" y="157" font-size="11">控制主进程与状态</text>
      <text x="592" y="278" font-weight="bold">Application Handler</text><text x="592" y="300" font-size="11">经明确钩子接入</text>
    </g>
  </g>
  <g stroke="#1f4e79" stroke-width="1.4" fill="none">
    <line x1="260" y1="140" x2="221" y2="140"/>
    <line x1="340" y1="170" x2="340" y2="209"/>
    <polyline points="260,155 232,155 232,250 221,250"/>
    <line x1="87" y1="280" x2="87" y2="324"/><line x1="172" y1="280" x2="172" y2="324"/>
  </g>
  <g fill="#1f4e79">
    <polygon points="213,140 221,135.5 221,144.5"/><polygon points="340,217 335.5,209 344.5,209"/>
    <polygon points="213,250 221,245.5 221,254.5"/>
    <polygon points="87,332 82.5,324 91.5,324"/><polygon points="172,332 167.5,324 176.5,324"/>
  </g>
  <g stroke="#c05621" stroke-width="1.4" fill="none">
    <line x1="520" y1="140" x2="431" y2="140"/>
    <polyline points="520,282 477,282 477,250 431,250"/>
    <line x1="592" y1="170" x2="592" y2="239"/>
  </g>
  <g fill="#c05621">
    <polygon points="423,140 431,135.5 431,144.5"/><polygon points="423,250 431,245.5 431,254.5"/>
    <polygon points="592,247 587.5,239 596.5,239"/>
