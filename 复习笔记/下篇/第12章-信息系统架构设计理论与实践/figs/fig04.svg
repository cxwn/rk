<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">MVC：请求、业务处理与页面形成</text>
  <rect x="280" y="48" width="150" height="70" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="355" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6130">视图 View</text>
  <text x="355" y="99" text-anchor="middle" font-size="11" fill="#22303f">形成页面 · 展示结果</text>
  <rect x="30" y="160" width="130" height="70" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="95" y="189" text-anchor="middle" font-size="15" font-weight="bold" fill="#c05621">Web 浏览器</text>
  <text x="95" y="212" text-anchor="middle" font-size="11" fill="#22303f">用户入口</text>
  <rect x="280" y="160" width="150" height="70" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="355" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">控制器 Controller</text>
  <text x="355" y="211" text-anchor="middle" font-size="11" fill="#22303f">接收请求 · 协调模型和视图</text>
  <rect x="550" y="160" width="140" height="70" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="620" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6130">模型 Model</text>
  <text x="620" y="211" text-anchor="middle" font-size="11" fill="#22303f">数据或业务逻辑</text>
  <rect x="550" y="310" width="140" height="58" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="620" y="345" text-anchor="middle" font-size="14" fill="#1f4e79">数据库</text>
  <line x1="160" y1="180" x2="269" y2="180" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="277,180 269,175.5 269,184.5" fill="#1f4e79"/>
  <text x="215" y="170" text-anchor="middle" font-size="10" fill="#6b7a8a">HTTP 请求</text>
  <line x1="430" y1="180" x2="539" y2="180" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="547,180 539,175.5 539,184.5" fill="#1f4e79"/>
  <text x="485" y="170" text-anchor="middle" font-size="10" fill="#6b7a8a">处理请求</text>
  <line x1="550" y1="210" x2="441" y2="210" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="433,210 441,205.5 441,214.5" fill="#4a6130"/>
  <text x="495" y="227" text-anchor="middle" font-size="10" fill="#6b7a8a">处理结果</text>
  <line x1="355" y1="160" x2="355" y2="129" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="355,121 350.5,129 359.5,129" fill="#4a6130"/>
  <text x="370" y="143" font-size="10" fill="#6b7a8a">选择视图</text>
  <line x1="280" y1="83" x2="95" y2="83" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <line x1="95" y1="83" x2="95" y2="149" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="95,157 90.5,149 99.5,149" fill="#c05621"/>
  <text x="183" y="72" text-anchor="middle" font-size="10" fill="#6b7a8a">页面 / HTTP 回复</text>
  <line x1="620" y1="230" x2="620" y2="299" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="620,307 615.5,299 624.5,299" fill="#1f4e79"/>
  <text x="635" y="270" font-size="10" fill="#6b7a8a">持久化</text>
  <rect x="85" y="385" width="550" height="26" rx="5" fill="#fdf0e6" stroke="#c05621"/>
  <text x="360" y="403" text-anchor="middle" font-size="11" fill="#c05621">核心：视图与模型代码分离，控制器负责协调；并非三者互不交互</text>
</svg>
