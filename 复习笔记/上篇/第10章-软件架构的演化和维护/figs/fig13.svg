<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">大型网站演化：第 1～5 阶段</text>
  <rect x="25" y="55" width="145" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="97" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">1 单体架构</text>
  <text x="97" y="106" text-anchor="middle" font-size="12" fill="#6b7a8a">小型网站起步</text>
  <line x1="170" y1="88" x2="184" y2="88" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="192,88 184,83.5 184,92.5" fill="#1f4e79"/>
  <rect x="195" y="55" width="190" height="66" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="290" y="84" text-anchor="middle" font-size="14" fill="#22303f">初期访问量小</text>
  <text x="290" y="106" text-anchor="middle" font-size="12" fill="#6b7a8a">单机即可支撑</text>
  <line x1="385" y1="88" x2="399" y2="88" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="407,88 399,83.5 399,92.5" fill="#c05621"/>
  <rect x="410" y="55" width="285" height="66" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="552" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">应用、数据库、文件同机</text>
  <text x="552" y="106" text-anchor="middle" font-size="12" fill="#6b7a8a">结构简单，资源共享</text>
  <rect x="25" y="140" width="145" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="97" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">2 垂直架构</text>
  <text x="97" y="191" text-anchor="middle" font-size="12" fill="#6b7a8a">应用与数据分离</text>
  <line x1="170" y1="173" x2="184" y2="173" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="192,173 184,168.5 184,177.5" fill="#1f4e79"/>
  <rect x="195" y="140" width="190" height="66" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="290" y="169" text-anchor="middle" font-size="14" fill="#22303f">单机性能下降</text>
  <text x="290" y="191" text-anchor="middle" font-size="12" fill="#6b7a8a">存储空间不足</text>
  <line x1="385" y1="173" x2="399" y2="173" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="407,173 399,168.5 399,177.5" fill="#c05621"/>
  <rect x="410" y="140" width="285" height="66" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="552" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">应用 / 文件 / 数据库分机</text>
  <text x="552" y="191" text-anchor="middle" font-size="12" fill="#6b7a8a">按角色配置处理器、内存与硬盘</text>
  <rect x="25" y="225" width="145" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="97" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">3 使用缓存</text>
  <text x="97" y="276" text-anchor="middle" font-size="12" fill="#6b7a8a">热点数据入内存</text>
  <line x1="170" y1="258" x2="184" y2="258" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="192,258 184,253.5 184,262.5" fill="#1f4e79"/>
  <rect x="195" y="225" width="190" height="66" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="290" y="254" text-anchor="middle" font-size="14" fill="#22303f">数据库访问压力大</text>
  <text x="290" y="276" text-anchor="middle" font-size="12" fill="#6b7a8a">热点数据被反复读取</text>
  <line x1="385" y1="258" x2="399" y2="258" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="407,258 399,253.5 399,262.5" fill="#c05621"/>
  <rect x="410" y="225" width="285" height="66" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="552" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">本地缓存＋远程分布式缓存</text>
  <text x="552" y="276" text-anchor="middle" font-size="12" fill="#6b7a8a">降低数据库读取与写入压力</text>
  <rect x="25" y="310" width="145" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="97" y="339" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">4 服务集群</text>
  <text x="97" y="361" text-anchor="middle" font-size="12" fill="#6b7a8a">提升并发能力</text>
  <line x1="170" y1="343" x2="184" y2="343" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="192,343 184,338.5 184,347.5" fill="#1f4e79"/>
  <rect x="195" y="310" width="190" height="66" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="290" y="339" text-anchor="middle" font-size="14" fill="#22303f">单应用服务器到极限</text>
  <text x="290" y="361" text-anchor="middle" font-size="12" fill="#6b7a8a">高峰期连接数有限</text>
  <line x1="385" y1="343" x2="399" y2="343" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="407,343 399,338.5 399,347.5" fill="#c05621"/>
  <rect x="410" y="310" width="285" height="66" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="552" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">负载均衡＋应用服务器集群</text>
  <text x="552" y="361" text-anchor="middle" font-size="12" fill="#6b7a8a">加机器分担压力，实现可伸缩</text>
  <rect x="25" y="395" width="145" height="66" rx="6" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="97" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">5 读写分离</text>
  <text x="97" y="446" text-anchor="middle" font-size="12" fill="#6b7a8a">数据库主从复制</text>
  <line x1="170" y1="428" x2="184" y2="428" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="192,428 184,423.5 184,432.5" fill="#1f4e79"/>
  <rect x="195" y="395" width="190" height="66" rx="6" fill="#fdf0e6" stroke="#c05621"/>
  <text x="290" y="424" text-anchor="middle" font-size="14" fill="#22303f">未命中读与全部写</text>
  <text x="290" y="446" text-anchor="middle" font-size="12" fill="#6b7a8a">仍使数据库成为瓶颈</text>
  <line x1="385" y1="428" x2="399" y2="428" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="407,428 399,423.5 399,432.5" fill="#c05621"/>
  <rect x="410" y="395" width="285" height="66" rx="6" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="552" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">写主库、读从库、主从复制</text>
  <text x="552" y="446" text-anchor="middle" font-size="12" fill="#6b7a8a">数据访问模块对应用屏蔽差异</text>
  <text x="360" y="486" text-anchor="middle" font-size="13" fill="#6b7a8a">演化动因：从单机资源不足，逐步转向数据库与并发瓶颈</text>
</svg>
