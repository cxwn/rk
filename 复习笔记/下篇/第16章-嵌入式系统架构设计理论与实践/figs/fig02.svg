  <line x1="180" y1="127" x2="180" y2="149" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="180,154 175.5,146 184.5,146" fill="#1f4e79"/>
  <line x1="180" y1="209" x2="180" y2="231" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="180,236 175.5,228 184.5,228" fill="#1f4e79"/>
  <text x="180" y="329" text-anchor="middle" font-size="13" fill="#22303f">封闭：同层或下一层</text>
  <text x="180" y="351" text-anchor="middle" font-size="13" fill="#22303f">开放：同层或任意更低层</text>
  <rect x="375" y="55" width="315" height="250" rx="12" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
