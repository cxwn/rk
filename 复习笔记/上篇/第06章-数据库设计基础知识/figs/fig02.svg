<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">数据模型三要素与典型数据模型</text>
  <rect x="30" y="50" width="200" height="100" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="130" y="83" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">数据结构</text>
  <text x="130" y="110" text-anchor="middle" font-size="14" fill="#22303f">对象类型及联系</text>
  <text x="130" y="133" text-anchor="middle" font-size="13" fill="#6b7a8a">静态特性</text>
  <rect x="260" y="50" width="200" height="100" rx="8" fill="#fdf0e6" stroke="#c05621"/>
  <text x="360" y="83" text-anchor="middle" font-size="17" font-weight="bold" fill="#c05621">数据操作</text>
  <text x="360" y="110" text-anchor="middle" font-size="14" fill="#22303f">增删改查及规则</text>
  <text x="360" y="133" text-anchor="middle" font-size="13" fill="#6b7a8a">动态特性</text>
  <rect x="490" y="50" width="200" height="100" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="590" y="83" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6130">约束条件</text>
  <text x="590" y="110" text-anchor="middle" font-size="14" fill="#22303f">完整性规则集合</text>
  <text x="590" y="133" text-anchor="middle" font-size="13" fill="#6b7a8a">正确、有效、相容</text>
  <rect x="30" y="185" width="200" height="215" rx="8" fill="#fbfdff" stroke="#1f4e79"/>
  <text x="130" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">层次模型：树</text>
  <rect x="85" y="232" width="90" height="34" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="130" y="254" text-anchor="middle" font-size="13" fill="#22303f">根结点</text>
  <line x1="130" y1="266" x2="130" y2="290" stroke="#6b7a8a" stroke-width="1.4"/>
  <line x1="80" y1="290" x2="180" y2="290" stroke="#6b7a8a" stroke-width="1.4"/>
  <line x1="80" y1="290" x2="80" y2="307" stroke="#6b7a8a" stroke-width="1.4"/>
  <line x1="180" y1="290" x2="180" y2="307" stroke="#6b7a8a" stroke-width="1.4"/>
  <rect x="45" y="307" width="70" height="34" rx="4" fill="#ffffff" stroke="#6b7a8a"/>
  <rect x="145" y="307" width="70" height="34" rx="4" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="80" y="329" text-anchor="middle" font-size="12" fill="#22303f">子结点</text>
  <text x="180" y="329" text-anchor="middle" font-size="12" fill="#22303f">子结点</text>
  <text x="130" y="374" text-anchor="middle" font-size="13" fill="#6b7a8a">非根结点仅一个双亲</text>
  <rect x="260" y="185" width="200" height="215" rx="8" fill="#fbfdff" stroke="#1f4e79"/>
  <text x="360" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">网状模型：图</text>
  <line x1="340" y1="266" x2="305" y2="307" stroke="#6b7a8a" stroke-width="1.4"/>
  <line x1="380" y1="266" x2="415" y2="307" stroke="#6b7a8a" stroke-width="1.4"/>
  <line x1="345" y1="324" x2="375" y2="324" stroke="#6b7a8a" stroke-width="1.4"/>
  <rect x="320" y="232" width="80" height="34" rx="4" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="360" y="254" text-anchor="middle" font-size="13" fill="#22303f">结点 A</text>
  <rect x="270" y="307" width="75" height="34" rx="4" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="307" y="329" text-anchor="middle" font-size="13" fill="#22303f">结点 B</text>
  <rect x="375" y="307" width="75" height="34" rx="4" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="412" y="329" text-anchor="middle" font-size="13" fill="#22303f">结点 C</text>
  <text x="360" y="374" text-anchor="middle" font-size="13" fill="#6b7a8a">允许多个双亲</text>
  <rect x="490" y="185" width="200" height="215" rx="8" fill="#fbfdff" stroke="#1f4e79"/>
  <text x="590" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">关系模型：二维表</text>
  <rect x="515" y="235" width="150" height="105" fill="#ffffff" stroke="#1f4e79"/>
  <rect x="515" y="235" width="150" height="35" fill="#1f4e79"/>
  <line x1="590" y1="235" x2="590" y2="340" stroke="#1f4e79"/>
  <line x1="515" y1="270" x2="665" y2="270" stroke="#1f4e79"/>
  <line x1="515" y1="305" x2="665" y2="305" stroke="#1f4e79"/>
  <text x="552" y="258" text-anchor="middle" font-size="12" fill="#ffffff">学号</text>
  <text x="627" y="258" text-anchor="middle" font-size="12" fill="#ffffff">姓名</text>
  <text x="552" y="293" text-anchor="middle" font-size="12" fill="#22303f">S1</text>
  <text x="627" y="293" text-anchor="middle" font-size="12" fill="#22303f">小林</text>
  <text x="552" y="328" text-anchor="middle" font-size="12" fill="#22303f">S2</text>
  <text x="627" y="328" text-anchor="middle" font-size="12" fill="#22303f">小周</text>
  <text x="590" y="374" text-anchor="middle" font-size="13" fill="#6b7a8a">实体与联系都用关系表示</text>
</svg>
