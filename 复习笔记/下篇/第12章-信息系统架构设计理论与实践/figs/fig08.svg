<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">ADM 全生命周期：准备、A～H 与中心需求管理</text>
  <rect x="280" y="42" width="160" height="50" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="360" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">准备阶段</text>
  <rect x="500" y="92" width="160" height="50" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="580" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">A. 架构愿景</text>
  <rect x="550" y="182" width="150" height="50" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.4"/>
  <text x="625" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">B. 业务架构</text>
  <rect x="500" y="282" width="160" height="50" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="580" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">C. 信息系统架构</text>
  <text x="580" y="323" text-anchor="middle" font-size="10" fill="#22303f">数据 + 应用</text>
  <rect x="280" y="372" width="160" height="50" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.4"/>
  <text x="360" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">D. 技术架构</text>
  <rect x="60" y="372" width="160" height="50" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="140" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">E. 机会及解决方案</text>
  <text x="140" y="413" text-anchor="middle" font-size="10" fill="#22303f">工作包 · 过渡架构</text>
  <rect x="20" y="282" width="160" height="50" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="100" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">F. 迁移规划</text>
  <rect x="20" y="182" width="150" height="50" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.4"/>
  <text x="95" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6130">G. 实施治理</text>
  <rect x="60" y="92" width="160" height="50" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.4"/>
  <text x="140" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">H. 架构变更管理</text>
  <rect x="270" y="190" width="180" height="78" rx="9" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">需求管理</text>
  <text x="360" y="244" text-anchor="middle" font-size="11" fill="#ffffff">识别 · 存储 · 优先级 · 变更影响</text>
  <text x="360" y="261" text-anchor="middle" font-size="10" fill="#ffffff">贯穿 ADM 所有阶段</text>
  <line x1="400" y1="92" x2="491" y2="109" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="499,111 490,104 489,115" fill="#1f4e79"/>
  <line x1="610" y1="142" x2="625" y2="171" stroke="#4a6130" stroke-width="1.4" fill="none"/>
  <polygon points="627,179 618,172 629,168" fill="#4a6130"/>
  <line x1="625" y1="232" x2="610" y2="271" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="608,279 605,268 615,272" fill="#1f4e79"/>
  <line x1="540" y1="332" x2="439" y2="382" stroke="#4a6130" stroke-width="1.4" fill="none"/>
  <polygon points="432,386 441,377 444,388" fill="#4a6130"/>
  <line x1="280" y1="397" x2="231" y2="397" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="223,397 231,392.5 231,401.5" fill="#c05621"/>
  <line x1="110" y1="372" x2="95" y2="343" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="92,335 90,346 100,341" fill="#1f4e79"/>
  <line x1="95" y1="282" x2="95" y2="243" stroke="#4a6130" stroke-width="1.4" fill="none"/>
  <polygon points="95,235 90.5,243 99.5,243" fill="#4a6130"/>
  <line x1="110" y1="182" x2="130" y2="153" stroke="#c05621" stroke-width="1.4" fill="none"/>
  <polygon points="134,145 124,151 132,157" fill="#c05621"/>
  <line x1="220" y1="107" x2="269" y2="82" stroke="#1f4e79" stroke-width="1.4" fill="none"/>
  <polygon points="277,79 267,79 271,89" fill="#1f4e79"/>
  <text x="360" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">三级迭代</text>
  <rect x="40" y="465" width="195" height="44" rx="5" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="137" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4e79">整体迭代</text>
  <text x="137" y="501" text-anchor="middle" font-size="10" fill="#22303f">一轮完成进入下一轮</text>
  <rect x="262" y="465" width="195" height="44" rx="5" fill="#f3f6ee" stroke="#4a6130"/>
  <text x="359" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">阶段间迭代</text>
  <text x="359" y="501" text-anchor="middle" font-size="10" fill="#22303f">如 D 返回 B 重新细化</text>
  <rect x="485" y="465" width="195" height="44" rx="5" fill="#fdf0e6" stroke="#c05621"/>
  <text x="582" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">阶段内迭代</text>
  <text x="582" y="501" text-anchor="middle" font-size="10" fill="#22303f">内部活动反复细化</text>
</svg>
