<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">事件系统：基于事件的隐式调用</text>
  <rect x="40" y="90" width="130" height="50" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="105" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">事件源</text>
  <text x="105" y="130" text-anchor="middle" font-size="10" fill="#22303f">Event Source</text>
  <rect x="300" y="90" width="150" height="50" rx="6" fill="#1f4e79"/>
  <text x="375" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">事件管理器</text>
  <text x="375" y="130" text-anchor="middle" font-size="10" fill="#ffffff">Event Manager</text>
  <rect x="560" y="30" width="130" height="40" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="625" y="55" text-anchor="middle" font-size="12" fill="#4a6130">事件处理器 1</text>
  <rect x="560" y="95" width="130" height="40" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="625" y="120" text-anchor="middle" font-size="12" fill="#4a6130">事件处理器 2</text>
  <rect x="560" y="160" width="130" height="40" rx="6" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.2"/>
  <text x="625" y="185" text-anchor="middle" font-size="12" fill="#4a6130">事件处理器 3</text>
  <line x1="170" y1="115" x2="289" y2="115" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="297,115 289,110.5 289,119.5" fill="#1f4e79"/>
  <text x="234" y="102" text-anchor="middle" font-size="10" fill="#6b7a8a">发布事件</text>
  <polyline points="450,100 505,100 505,50 549,50" fill="none" stroke="#4a6130" stroke-width="1.5"/>
  <polygon points="557,50 549,45.5 549,54.5" fill="#4a6130"/>
  <line x1="450" y1="115" x2="549" y2="115" stroke="#4a6130" stroke-width="1.5"/>
  <polygon points="557,115 549,110.5 549,119.5" fill="#4a6130"/>
  <polyline points="450,130 505,130 505,180 549,180" fill="none" stroke="#4a6130" stroke-width="1.5"/>
  <polygon points="557,180 549,175.5 549,184.5" fill="#4a6130"/>
  <text x="452" y="155" font-size="10" fill="#6b7a8a">分发/通知</text>
  <text x="360" y="232" text-anchor="middle" font-size="12" fill="#22303f">过程在事件中注册，事件触发时自动调用所有注册过程</text>
  <text x="360" y="252" text-anchor="middle" font-size="12" fill="#c05621">触发者不知道哪些构件被影响，也不能假定处理顺序</text>
</svg>
