<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f4e79">论文答题纸：摘要与正文分区</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#6b7a8a">每行 25 格｜一字或一个标点占一格｜字数按格估算</text>

  <rect x="40" y="78" width="300" height="370" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="2"/>
  <text x="190" y="106" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">第 1 页</text>
  <rect x="62" y="124" width="256" height="164" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="190" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">摘要区</text>
  <text x="190" y="177" text-anchor="middle" font-size="15" fill="#22303f">16 行 × 25 格＝400 格</text>
  <g stroke="#d5dde5" stroke-width="1">
    <line x1="76" y1="197" x2="304" y2="197"/><line x1="76" y1="215" x2="304" y2="215"/>
    <line x1="76" y1="233" x2="304" y2="233"/><line x1="76" y1="251" x2="304" y2="251"/>
    <line x1="76" y1="269" x2="304" y2="269"/>
    <line x1="102" y1="190" x2="102" y2="276"/><line x1="128" y1="190" x2="128" y2="276"/>
    <line x1="154" y1="190" x2="154" y2="276"/><line x1="180" y1="190" x2="180" y2="276"/>
    <line x1="206" y1="190" x2="206" y2="276"/><line x1="232" y1="190" x2="232" y2="276"/>
    <line x1="258" y1="190" x2="258" y2="276"/><line x1="284" y1="190" x2="284" y2="276"/>
  </g>
  <rect x="62" y="306" width="256" height="116" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="190" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#c05621">正文起始区</text>
  <text x="190" y="360" text-anchor="middle" font-size="15" fill="#22303f">12 行 × 25 格＝300 格</text>
  <g stroke="#d5dde5" stroke-width="1">
    <line x1="76" y1="380" x2="304" y2="380"/><line x1="76" y1="399" x2="304" y2="399"/>
    <line x1="102" y1="372" x2="102" y2="410"/><line x1="128" y1="372" x2="128" y2="410"/>
    <line x1="154" y1="372" x2="154" y2="410"/><line x1="180" y1="372" x2="180" y2="410"/>
    <line x1="206" y1="372" x2="206" y2="410"/><line x1="232" y1="372" x2="232" y2="410"/>
    <line x1="258" y1="372" x2="258" y2="410"/><line x1="284" y1="372" x2="284" y2="410"/>
  </g>

  <rect x="380" y="78" width="300" height="370" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="2"/>
  <text x="530" y="106" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a6130">第 2～4 页（每页同式）</text>
  <rect x="402" y="124" width="256" height="298" fill="#ffffff" stroke="#6b7a8a"/>
  <text x="530" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6130">正文续写区</text>
  <text x="530" y="177" text-anchor="middle" font-size="15" fill="#22303f">36 行 × 25 格＝900 格</text>
  <g stroke="#d5dde5" stroke-width="1">
    <line x1="416" y1="201" x2="644" y2="201"/><line x1="416" y1="223" x2="644" y2="223"/>
    <line x1="416" y1="245" x2="644" y2="245"/><line x1="416" y1="267" x2="644" y2="267"/>
    <line x1="416" y1="289" x2="644" y2="289"/><line x1="416" y1="311" x2="644" y2="311"/>
    <line x1="416" y1="333" x2="644" y2="333"/><line x1="416" y1="355" x2="644" y2="355"/>
    <line x1="416" y1="377" x2="644" y2="377"/><line x1="416" y1="399" x2="644" y2="399"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#c05621">
    <text x="530" y="238" text-anchor="middle">每 12 行提示：300</text>
    <text x="530" y="304" text-anchor="middle">再 12 行提示：600</text>
    <text x="530" y="370" text-anchor="middle">最后 12 行提示：900</text>
  </g>
  <rect x="118" y="462" width="484" height="26" rx="13" fill="#fdf0e6"/>
  <text x="360" y="480" text-anchor="middle" font-size="13" fill="#c05621">教材图20-1、图20-2重绘示意（格线省略，格数与分区保留）</text>
</svg>
