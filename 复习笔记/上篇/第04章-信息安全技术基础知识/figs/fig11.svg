<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">风险评估各要素关系</text>
  <rect x="40" y="40" width="110" height="40" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="95" y="65" text-anchor="middle" font-size="12.5" fill="#22303f">业务战略</text>
  <rect x="240" y="40" width="100" height="40" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="290" y="65" text-anchor="middle" font-size="12.5" fill="#22303f">资产</text>
  <rect x="430" y="40" width="110" height="40" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="485" y="65" text-anchor="middle" font-size="12.5" fill="#22303f">资产价值</text>
  <rect x="600" y="40" width="90" height="40" rx="4" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="645" y="65" text-anchor="middle" font-size="12.5" fill="#4a6130">残余风险</text>
  <rect x="40" y="140" width="110" height="40" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="95" y="165" text-anchor="middle" font-size="12.5" fill="#c05621">威胁</text>
  <rect x="240" y="140" width="100" height="40" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="290" y="165" text-anchor="middle" font-size="12.5" fill="#c05621">脆弱性</text>
  <rect x="430" y="140" width="110" height="40" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="485" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f4e79">风险</text>
  <rect x="600" y="140" width="90" height="40" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="645" y="165" text-anchor="middle" font-size="12.5" fill="#c05621">安全事件</text>
  <rect x="240" y="240" width="110" height="40" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="295" y="265" text-anchor="middle" font-size="12.5" fill="#22303f">安全需求</text>
  <rect x="430" y="240" width="110" height="40" rx="4" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="485" y="265" text-anchor="middle" font-size="12.5" fill="#4a6130">安全措施</text>
  <text x="193" y="52" text-anchor="middle" font-size="11" fill="#6b7a8a">依赖</text>
  <line x1="150" y1="60" x2="229" y2="60" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="237,60 229,55.5 229,64.5" fill="#1f4e79"/>
  <text x="383" y="52" text-anchor="middle" font-size="11" fill="#6b7a8a">拥有</text>
  <line x1="340" y1="60" x2="419" y2="60" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="427,60 419,55.5 419,64.5" fill="#1f4e79"/>
  <text x="493" y="112" font-size="11" fill="#6b7a8a">增加</text>
  <line x1="485" y1="80" x2="485" y2="129" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="485,137 480.5,129 489.5,129" fill="#1f4e79"/>
  <text x="193" y="152" text-anchor="middle" font-size="11" fill="#6b7a8a">利用</text>
  <line x1="150" y1="160" x2="229" y2="160" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="237,160 229,155.5 229,164.5" fill="#c05621"/>
  <text x="298" y="115" font-size="11" fill="#6b7a8a">暴露</text>
  <line x1="290" y1="140" x2="290" y2="91" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="290,83 285.5,91 294.5,91" fill="#c05621"/>
  <text x="383" y="152" text-anchor="middle" font-size="11" fill="#6b7a8a">形成风险</text>
  <line x1="340" y1="160" x2="419" y2="160" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="427,160 419,155.5 419,164.5" fill="#1f4e79"/>
  <text x="298" y="212" font-size="11" fill="#6b7a8a">未被满足</text>
  <line x1="290" y1="180" x2="290" y2="229" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="290,237 285.5,229 294.5,229" fill="#1f4e79"/>
  <text x="388" y="252" text-anchor="middle" font-size="11" fill="#6b7a8a">被满足</text>
  <line x1="350" y1="260" x2="419" y2="260" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="427,260 419,255.5 419,264.5" fill="#1f4e79"/>
  <text x="568" y="152" text-anchor="middle" font-size="11" fill="#6b7a8a">演变</text>
  <line x1="540" y1="160" x2="589" y2="160" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="597,160 589,155.5 589,164.5" fill="#c05621"/>
  <text x="560" y="100" text-anchor="middle" font-size="11" fill="#6b7a8a">残留</text>
  <polyline points="520,140 520,110 645,110 645,91" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="645,83 640.5,91 649.5,91" fill="#1f4e79"/>
  <text x="682" y="112" font-size="11" fill="#6b7a8a">诱发</text>
  <line x1="675" y1="80" x2="675" y2="129" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="675,137 670.5,129 679.5,129" fill="#8aa15c"/>
  <text x="463" y="215" font-size="11" fill="#6b7a8a">降低</text>
  <line x1="455" y1="240" x2="455" y2="191" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <polygon points="455,183 450.5,191 459.5,191" fill="#8aa15c"/>
  <text x="360" y="306" text-anchor="middle" font-size="11.5" fill="#6b7a8a">安全措施：抗击威胁、降低风险、满足安全需求（有成本）；资产价值越大、脆弱性越大，风险越大</text>
  <text x="360" y="328" text-anchor="middle" font-size="11.5" fill="#6b7a8a">残余风险＝措施不当或无效＋有意接受的部分；风险不必降为零，残余风险须密切监视</text>
</svg>
