<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">接入—汇聚层间四种高可用组网模型（教材图 17-21 重绘）</text>
  <!-- 格1 倒U -->
  <rect x="20" y="40" width="330" height="180" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="185" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">模型一：倒 U 形</text>
  <line x1="175" y1="88" x2="195" y2="88" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="140" y1="100" x2="140" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="230" y1="100" x2="230" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <rect x="105" y="76" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="140" y="92" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="195" y="76" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="230" y="92" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="105" y="140" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="140" y="156" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <rect x="195" y="140" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="230" y="156" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <text x="185" y="182" text-anchor="middle" font-size="10" fill="#22303f">汇聚间二层链路；无环路、不启用 STP；VLAN 可跨汇聚</text>
  <text x="185" y="200" text-anchor="middle" font-size="10" fill="#c05621">缺点：汇聚故障→同侧接入用户不可达</text>
  <!-- 格2 U形 -->
  <rect x="370" y="40" width="330" height="180" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="535" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">模型二：U 形</text>
  <line x1="490" y1="100" x2="490" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="580" y1="100" x2="580" y2="140" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="525" y1="152" x2="545" y2="152" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <rect x="455" y="76" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="490" y="92" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="545" y="76" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="580" y="92" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="455" y="140" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="490" y="156" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <rect x="545" y="140" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="580" y="156" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <text x="535" y="182" text-anchor="middle" font-size="10" fill="#22303f">接入间二层链路（传 VRRP 心跳）；无环路、不启用 STP</text>
  <text x="535" y="200" text-anchor="middle" font-size="10" fill="#c05621">VLAN 不跨汇聚；接入间断→VRRP 心跳异常、网络不稳</text>
  <!-- 格3 矩形 -->
  <rect x="20" y="240" width="330" height="180" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="185" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">模型三：矩形</text>
  <line x1="175" y1="288" x2="195" y2="288" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="140" y1="300" x2="140" y2="340" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="230" y1="300" x2="230" y2="340" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="165" y1="340" x2="205" y2="300" stroke="#6b7a8a" stroke-width="1.2" fill="none"/>
  <line x1="205" y1="340" x2="165" y2="300" stroke="#6b7a8a" stroke-width="1.2" fill="none"/>
  <line x1="175" y1="352" x2="195" y2="352" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <rect x="105" y="276" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="140" y="292" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="195" y="276" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="230" y="292" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="105" y="340" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="140" y="356" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <rect x="195" y="340" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="230" y="356" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <text x="185" y="382" text-anchor="middle" font-size="10" fill="#22303f">接入间/汇聚间/双上联全二层互联；VLAN 可跨汇聚</text>
  <text x="185" y="400" text-anchor="middle" font-size="10" fill="#c05621">有环路启用 STP；上行故障时收敛比变小、易拥塞</text>
  <!-- 格4 三角形 -->
  <rect x="370" y="240" width="330" height="180" rx="8" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1"/>
  <text x="535" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">模型四：三角形（推荐）</text>
  <line x1="525" y1="288" x2="545" y2="288" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="490" y1="300" x2="490" y2="340" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="580" y1="300" x2="580" y2="340" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <line x1="515" y1="340" x2="555" y2="300" stroke="#6b7a8a" stroke-width="1.2" fill="none"/>
  <line x1="555" y1="340" x2="515" y2="300" stroke="#6b7a8a" stroke-width="1.2" fill="none"/>
  <rect x="455" y="276" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="490" y="292" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="545" y="276" width="70" height="24" rx="4" fill="#fdf0e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="580" y="292" text-anchor="middle" font-size="10" fill="#c05621">汇聚</text>
  <rect x="455" y="340" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="490" y="356" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <rect x="545" y="340" width="70" height="24" rx="4" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="580" y="356" text-anchor="middle" font-size="10" fill="#1f4e79">接入</text>
  <text x="535" y="382" text-anchor="middle" font-size="10" fill="#22303f">汇聚间链路+接入双上联；冗余链路与路径、VLAN 跨汇聚</text>
  <text x="535" y="400" text-anchor="middle" font-size="10" fill="#c05621">有环路，生成树计算较矩形复杂；高要求接入推荐</text>
  <text x="360" y="442" text-anchor="middle" font-size="11" fill="#4a6130">三角形组网需使能 MSTP 防环；汇聚部署 VRRP，以 VRRP 组虚拟 IP 作为用户设备网关</text>
</svg>
