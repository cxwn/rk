<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 帧分段 -->
  <g font-size="13" font-weight="bold">
    <rect x="20" y="50" width="110" height="60" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="75" y="85" fill="#1f4e79" text-anchor="middle">DMAC</text>
    <rect x="130" y="50" width="110" height="60" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="185" y="85" fill="#1f4e79" text-anchor="middle">SMAC</text>
    <rect x="240" y="50" width="130" height="60" fill="#fdf0e6" stroke="#c05621"/>
    <text x="305" y="85" fill="#c05621" text-anchor="middle">Length/Type</text>
    <rect x="370" y="50" width="240" height="60" fill="#f3f6ee" stroke="#8aa15c"/>
    <text x="490" y="85" fill="#4a6130" text-anchor="middle">DATA / PAD</text>
    <rect x="610" y="50" width="90" height="60" fill="#eaf1f8" stroke="#1f4e79"/>
    <text x="655" y="85" fill="#1f4e79" text-anchor="middle">FCS</text>
  </g>
  <g font-size="11" fill="#6b7a8a">
    <text x="75" y="132" text-anchor="middle">目的 MAC</text>
    <text x="185" y="132" text-anchor="middle">源 MAC</text>
    <text x="305" y="132" text-anchor="middle">2 字节</text>
    <text x="490" y="132" text-anchor="middle">数据 / 填充</text>
    <text x="655" y="132" text-anchor="middle">帧校验</text>
  </g>
  <g font-size="12" fill="#22303f">
    <text x="20" y="176">• Length/Type：大于 1500 表示上层协议类型（ETHERNET_II）；小于 1500 表示数据帧长度</text>
    <text x="20" y="204">• 最小帧长 64 字节（CSMA/CD 限制），不足时必须在数据部分 PAD 填充；数据域上限通常 1500 字节</text>
    <text x="20" y="232">• 流量控制：半双工用反压技术；全双工用 IEEE 802.3x 的 64 字节 PAUSE 控制帧</text>
  </g>
  <text x="360" y="264" font-size="11" fill="#6b7a8a" text-anchor="middle">（据教材图 2-20 重绘）</text>
</svg>
