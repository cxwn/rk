  <rect x="65" y="100" width="120" height="42" rx="5" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="125" y="126" text-anchor="middle" font-size="12" fill="#22303f">Web 服务器</text>
