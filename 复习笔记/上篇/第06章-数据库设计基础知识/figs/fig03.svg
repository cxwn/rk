  <text x="26" y="425" font-size="14" font-weight="bold" fill="#6b7a8a">物理层</text>
  <rect x="120" y="45" width="160" height="38" rx="6" fill="#f6f9fc" stroke="#6b7a8a"/>
  <text x="200" y="70" text-anchor="middle" font-size="14" fill="#22303f">用户组 A</text>
  <rect x="440" y="45" width="160" height="38" rx="6" fill="#f6f9fc" stroke="#6b7a8a"/>
  <text x="520" y="70" text-anchor="middle" font-size="14" fill="#22303f">用户组 B</text>
  <line x1="200" y1="83" x2="200" y2="89" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="200,97 195.5,89 204.5,89" fill="#1f4e79"/>
  <line x1="520" y1="83" x2="520" y2="89" stroke="#1f4e79" stroke-width="1.5"/>
  <polygon points="520,97 515.5,89 524.5,89" fill="#1f4e79"/>
  <rect x="100" y="100" width="200" height="60" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
