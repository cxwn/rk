<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <!-- 全局外层 -->
  <rect x="60" y="24" width="600" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="360" y="46" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">全局外层</text>
  <g font-size="11" fill="#22303f">
    <rect x="110" y="56" width="140" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="180" y="75" text-anchor="middle">全局视图</text>
    <rect x="290" y="56" width="140" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="360" y="75" text-anchor="middle">全局视图</text>
    <rect x="470" y="56" width="140" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="540" y="75" text-anchor="middle">全局视图</text>
  </g>
  <!-- 全局概念层 -->
  <rect x="60" y="122" width="600" height="72" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="360" y="144" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">全局概念层</text>
  <g font-size="11" fill="#22303f">
    <rect x="110" y="154" width="140" height="28" rx="4" fill="#ffffff" stroke="#1f4e79"/>
    <text x="180" y="173" text-anchor="middle">全局概念模式</text>
    <rect x="290" y="154" width="140" height="28" rx="4" fill="#fdf0e6" stroke="#c05621"/>
    <text x="360" y="173" text-anchor="middle">分片模式</text>
    <rect x="470" y="154" width="140" height="28" rx="4" fill="#fdf0e6" stroke="#c05621"/>
    <text x="540" y="173" text-anchor="middle">分配模式</text>
  </g>
  <!-- 局部概念层 -->
  <rect x="60" y="220" width="600" height="72" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="242" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">局部概念层</text>
  <g font-size="11" fill="#22303f">
    <rect x="110" y="252" width="140" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="180" y="271" text-anchor="middle">局部概念模式</text>
    <rect x="290" y="252" width="140" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="360" y="271" text-anchor="middle">局部概念模式</text>
    <rect x="470" y="252" width="140" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="540" y="271" text-anchor="middle">局部概念模式</text>
  </g>
  <!-- 局部内层 -->
  <rect x="60" y="318" width="600" height="72" rx="6" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="360" y="340" font-size="14" font-weight="bold" fill="#4a6130" text-anchor="middle">局部内层</text>
  <g font-size="11" fill="#22303f">
    <rect x="110" y="350" width="140" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="180" y="369" text-anchor="middle">局部内模式/局部库</text>
    <rect x="290" y="350" width="140" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="360" y="369" text-anchor="middle">局部内模式/局部库</text>
    <rect x="470" y="350" width="140" height="28" rx="4" fill="#ffffff" stroke="#8aa15c"/>
    <text x="540" y="369" text-anchor="middle">局部内模式/局部库</text>
  </g>
  <!-- 层间映射箭头（每层间两条独立竖线） -->
  <g stroke="#6b7a8a" stroke-width="1.4" fill="none">
    <line x1="200" y1="99" x2="200" y2="114"/>
    <polygon points="200,119 195.5,111 204.5,111" fill="#6b7a8a"/>
    <line x1="520" y1="99" x2="520" y2="114"/>
    <polygon points="520,119 515.5,111 524.5,111" fill="#6b7a8a"/>
    <line x1="200" y1="197" x2="200" y2="212"/>
    <polygon points="200,217 195.5,209 204.5,209" fill="#6b7a8a"/>
    <line x1="520" y1="197" x2="520" y2="212"/>
    <polygon points="520,217 515.5,209 524.5,209" fill="#6b7a8a"/>
    <line x1="200" y1="295" x2="200" y2="310"/>
    <polygon points="200,315 195.5,307 204.5,307" fill="#6b7a8a"/>
    <line x1="520" y1="295" x2="520" y2="310"/>
    <polygon points="520,315 515.5,307 524.5,307" fill="#6b7a8a"/>
  </g>
  <text x="360" y="110" font-size="10" fill="#6b7a8a" text-anchor="middle">映射</text>
  <text x="360" y="208" font-size="10" fill="#6b7a8a" text-anchor="middle">映射</text>
  <text x="360" y="306" font-size="10" fill="#6b7a8a" text-anchor="middle">映射</text>
  <text x="360" y="416" font-size="11" fill="#6b7a8a" text-anchor="middle">同构 / 异构分布式数据库均适用；完全分布式：分布性、逻辑相关性、场地透明性、场地自治性</text>
</svg>
