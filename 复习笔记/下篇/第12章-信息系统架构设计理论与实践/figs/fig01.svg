<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e79">信息系统架构：三要素与抽象边界</text>
  <rect x="25" y="55" width="210" height="78" rx="7" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="130" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">软件元素</text>
  <text x="130" y="111" text-anchor="middle" font-size="12" fill="#22303f">模块、构件、对象等抽象单元</text>
  <rect x="255" y="55" width="210" height="78" rx="7" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#c05621">外部可见属性</text>
  <text x="360" y="111" text-anchor="middle" font-size="12" fill="#22303f">服务、性能、接口等外部假设</text>
  <rect x="485" y="55" width="210" height="78" rx="7" fill="#f3f6ee" stroke="#4a6130" stroke-width="1.5"/>
  <text x="590" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a6130">元素之间的关系</text>
  <text x="590" y="111" text-anchor="middle" font-size="12" fill="#22303f">连接、调用、数据与协作关系</text>
  <line x1="130" y1="133" x2="130" y2="179" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="130,187 125.5,179 134.5,179" fill="#1f4e79"/>
  <line x1="360" y1="133" x2="360" y2="179" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="360,187 355.5,179 364.5,179" fill="#c05621"/>
  <line x1="590" y1="133" x2="590" y2="179" stroke="#4a6130" stroke-width="1.5" fill="none"/>
  <polygon points="590,187 585.5,179 594.5,179" fill="#4a6130"/>
  <rect x="25" y="190" width="670" height="72" rx="7" fill="#fbfdff" stroke="#1f4e79" stroke-width="1.8"/>
  <text x="360" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">信息系统架构：系统的一个或多个结构</text>
  <text x="360" y="244" text-anchor="middle" font-size="12" fill="#22303f">静态看大粒度结构，动态看关键行为；架构决策影响深远、变更代价高</text>
  <text x="360" y="286" text-anchor="middle" font-size="11" fill="#6b7a8a">抽象边界：关注外部可见，不描述纯内部实现；任何软件都有架构，但未必有真实有效的架构文档</text>
</svg>
