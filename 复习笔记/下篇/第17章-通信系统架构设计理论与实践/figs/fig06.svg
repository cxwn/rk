<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 385" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">SDN 网络架构：三平面与三类接口（教材图 17-17 重绘）</text>
  <!-- 应用平面 -->
  <rect x="100" y="40" width="520" height="56" rx="8" fill="#fdf0e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="360" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#c05621">应用平面</text>
  <text x="360" y="84" text-anchor="middle" font-size="10" fill="#22303f">SDN 网络应用：无须关心底层细节即可编程、部署新应用</text>
  <!-- 北向接口 -->
  <line x1="360" y1="107" x2="360" y2="139" stroke="#c05621" stroke-width="1.5" fill="none"/>
  <polygon points="360,99 355.5,107 364.5,107" fill="#c05621"/>
  <polygon points="360,147 355.5,139 364.5,139" fill="#c05621"/>
  <text x="375" y="126" font-size="11" fill="#c05621">北向接口 NBI（对应用开放，定制网络管理应用）</text>
  <!-- 控制平面 -->
  <rect x="100" y="150" width="520" height="56" rx="8" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="360" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">控制平面：SDN 控制器</text>
  <text x="360" y="194" text-anchor="middle" font-size="10" fill="#22303f">逻辑集中、掌握网络全局信息、负责转发规则下发</text>
  <!-- 东西向接口 -->
  <text x="672" y="146" text-anchor="middle" font-size="10" fill="#6b7a8a">东西向接口</text>
  <line x1="620" y1="178" x2="633" y2="178" stroke="#6b7a8a" stroke-width="1.5" fill="none"/>
  <rect x="636" y="158" width="72" height="40" rx="6" fill="#f4f6f8" stroke="#6b7a8a" stroke-width="1.2"/>
  <text x="672" y="182" text-anchor="middle" font-size="10" fill="#22303f">其他控制器</text>
  <!-- 南向接口 -->
  <line x1="360" y1="206" x2="360" y2="245" stroke="#1f4e79" stroke-width="1.5" fill="none"/>
  <polygon points="360,253 355.5,245 364.5,245" fill="#1f4e79"/>
  <text x="375" y="232" font-size="11" fill="#1f4e79">南向接口 SBI（OpenFlow 最主流，流表规则下发）</text>
  <!-- 数据平面 -->
  <rect x="100" y="256" width="520" height="90" rx="8" fill="#f3f6ee" stroke="#8aa15c" stroke-width="1.5"/>
  <text x="360" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6130">数据平面（通用硬件转发设备 / 哑交换机）</text>
  <line x1="230" y1="313" x2="250" y2="313" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <line x1="360" y1="313" x2="380" y2="313" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <line x1="490" y1="313" x2="510" y2="313" stroke="#8aa15c" stroke-width="1.5" fill="none"/>
  <rect x="120" y="296" width="110" height="34" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="175" y="317" text-anchor="middle" font-size="11" fill="#4a6130">转发设备</text>
  <rect x="250" y="296" width="110" height="34" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="305" y="317" text-anchor="middle" font-size="11" fill="#4a6130">转发设备</text>
  <rect x="380" y="296" width="110" height="34" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="435" y="317" text-anchor="middle" font-size="11" fill="#4a6130">转发设备</text>
  <rect x="510" y="296" width="110" height="34" rx="5" fill="#ffffff" stroke="#8aa15c" stroke-width="1.2"/>
  <text x="565" y="317" text-anchor="middle" font-size="11" fill="#4a6130">转发设备</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#22303f">OpenFlow 基于流（Flow）匹配：流表由控制器建立、维护并下发，转发设备按表执行动作</text>
</svg>
