    <rect x="310" y="620" width="100" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/><text x="360" y="654">人事子系统</text>
    <rect x="450" y="620" width="100" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/><text x="500" y="654">生产子系统</text>
    <rect x="590" y="620" width="100" height="55" rx="6" fill="#f3f6ee" stroke="#8aa15c"/><text x="640" y="654">供运子系统</text>
