<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <rect width="720" height="510" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#22303f">DSS 基本模式与两库结构</text>
  <rect x="25" y="52" width="320" height="425" rx="10" fill="#f8fafc" stroke="#6b7a8a"/>
  <text x="185" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">基本模式：管理者处于核心</text>
  <rect x="70" y="105" width="230" height="52" rx="7" fill="#eaf1f8" stroke="#1f4e79"/>
