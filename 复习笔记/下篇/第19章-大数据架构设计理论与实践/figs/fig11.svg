  <text x="610" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">Java Merge / Query</text>
  <text x="610" y="148" text-anchor="middle" font-size="10" fill="#22303f">多表、多 key 关联</text>
  <text x="360" y="208" text-anchor="middle" font-size="10" fill="#c05621">瓶颈：服务层逻辑复杂；外部曝光数据不能实时支撑调价与定向</text>
  <rect x="20" y="245" width="330" height="175" rx="8" fill="#eaf1f8" stroke="#1f4e79"/>
  <text x="185" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">第二版：离线预 join</text>
  <text x="45" y="300" font-size="11" fill="#22303f">• 常驻脚本分时频同步第三方报表</text>
  <text x="45" y="326" font-size="11" fill="#22303f">• Hive 预先关联曝光表与转化表</text>
  <text x="45" y="352" font-size="11" fill="#22303f">• Java 压力下降，读 Redis 成新瓶颈</text>
  <rect x="45" y="370" width="280" height="32" rx="5" fill="#ffffff" stroke="#1f4e79"/>
  <text x="185" y="391" text-anchor="middle" font-size="10" fill="#c05621">仍有：key 关联聚合、离线依赖链长</text>
  <rect x="370" y="245" width="330" height="175" rx="8" fill="#f3f6ee" stroke="#8aa15c"/>
  <text x="535" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6130">第三版：一表查询、关联前移</text>
  <text x="395" y="300" font-size="11" fill="#22303f">• 单 MySQL 表：当天实时、历史离线</text>
  <text x="395" y="326" font-size="11" fill="#22303f">• 下单处理时完成广告维度关联</text>
  <text x="395" y="352" font-size="11" fill="#22303f">• Java 服务最终只需读取一张表</text>
  <rect x="395" y="370" width="280" height="32" rx="5" fill="#ffffff" stroke="#8aa15c"/>
  <text x="535" y="391" text-anchor="middle" font-size="10" fill="#4a6130">结果：内外部数据结合，多维准实时分析</text>
  <text x="360" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">演进主线：把 join、聚合、维度关联从查询端前移到收集与计算阶段</text>
</svg>