<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, 微软雅黑, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
  </defs>
  <!-- 四角视角 -->
  <g>
    <rect x="60" y="40" width="190" height="76" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="155" y="70" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">逻辑视角 Logical</text>
    <text x="155" y="94" font-size="11" fill="#22303f" text-anchor="middle">功能需求与结构</text>
    <rect x="470" y="40" width="190" height="76" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="565" y="70" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">开发视角 Development</text>
    <text x="565" y="94" font-size="11" fill="#22303f" text-anchor="middle">代码分包与开发组织</text>
    <rect x="60" y="300" width="190" height="76" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="155" y="330" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">过程视角 Process</text>
    <text x="155" y="354" font-size="11" fill="#22303f" text-anchor="middle">进程线程、并发同步</text>
    <rect x="470" y="300" width="190" height="76" rx="6" fill="#eaf1f8" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="565" y="330" font-size="15" font-weight="bold" fill="#1f4e79" text-anchor="middle">物理视角 Physical</text>
    <text x="565" y="354" font-size="11" fill="#22303f" text-anchor="middle">部署节点与网络</text>
  </g>
  <!-- 中心场景 -->
  <ellipse cx="360" cy="208" rx="88" ry="52" fill="#fdf0e6" stroke="#c05621" stroke-width="1.6"/>
  <text x="360" y="202" font-size="16" font-weight="bold" fill="#c05621" text-anchor="middle">场景 Scenarios</text>
  <text x="360" y="226" font-size="11" fill="#22303f" text-anchor="middle">用例串联验证</text>
  <!-- 四角 -> 中心（各自独立直线，止于椭圆外侧） -->
  <g stroke="#1f4e79" stroke-width="1.5" fill="none">
    <line x1="253" y1="81" x2="296.0" y2="156.1"/>
    <polygon points="300.0,163.0 292.1,158.3 299.9,153.8" fill="#1f4e79"/>
    <line x1="467" y1="81" x2="424.0" y2="156.1"/>
    <polygon points="420.0,163.0 420.1,153.8 427.9,158.3" fill="#1f4e79"/>
    <line x1="253" y1="335" x2="296.0" y2="259.9"/>
    <polygon points="300.0,253.0 299.9,262.2 292.1,257.7" fill="#1f4e79"/>
    <line x1="467" y1="335" x2="424.0" y2="259.9"/>
    <polygon points="420.0,253.0 427.9,257.7 420.1,262.2" fill="#1f4e79"/>
  </g>
  <text x="360" y="406" font-size="12" fill="#6b7a8a" text-anchor="middle">Kruchten（1995）：每个视角只关心系统的一个侧面，场景视角把其余四个视角串联起来</text>
</svg>
